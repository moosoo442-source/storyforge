route('world', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  const world = proj.world || (proj.world = { sections: [] });
  // migrate old format
  world.sections.forEach(s => { if(!s.type) s.type = 'free'; if(!s.fields) s.fields = {}; });

  const body = `
    <div class="card gradient">
      <div class="card-h"><h3>📑 양식 선택해 추가하기</h3>
        <div class="muted" style="font-size:12px">아무 양식이나 골라 빠르게 시작</div></div>
      <div class="grid compact" id="tplGrid"></div>
    </div>
    <div class="flex" style="margin:14px 0;gap:8px;flex-wrap:wrap">
      <input id="wsearch" placeholder="🔍 항목 검색..." style="max-width:280px">
      <select id="wfilter" style="max-width:200px"><option value="">전체 종류</option></select>
    </div>
    <div id="sections"></div>`;
  shell('world', '🌍 세계관 설정', '', body, pid,
    `<a data-go="/dashboard">대시보드</a> › <a data-go="/project/${pid}">${escapeHtml(proj.title)}</a> › <span>세계관</span>`);

  $('#tplGrid').innerHTML = Object.entries(WORLD_TYPES).map(([k,v]) =>
    `<div class="tpl-card" data-tpl="${k}"><div class="em">${v.em}</div><div class="nm">${v.label}</div></div>`).join('');
  $$('.tpl-card').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.tpl; const t = prompt(WORLD_TYPES[k].label + ' 제목', ''); if(!t) return;
    world.sections.push({ id: uid('w_'), type:k, title:t, fields:{}, body:'', image:'' });
    save(); refresh();
  }));

  function save(){ SF.updateProject(pid, { world }); }

  function refresh(){
    const types = Array.from(new Set(world.sections.map(s=>s.type).filter(Boolean)));
    $('#wfilter').innerHTML = '<option value="">전체 종류</option>' + types.map(t => `<option value="${t}">${WORLD_TYPES[t]?WORLD_TYPES[t].label:t}</option>`).join('');
    const q = $('#wsearch').value.trim().toLowerCase();
    const f = $('#wfilter').value;
    const w = $('#sections');
    const list = world.sections.filter(s => {
      if(f && s.type !== f) return false;
      if(!q) return true;
      const allText = [s.title, s.body, ...Object.values(s.fields||{})].join(' ').toLowerCase();
      return allText.includes(q);
    });
    if(!list.length){
      w.innerHTML = `<div class="empty"><div class="ic">🌍</div><h3>세계관 항목이 없어요</h3><p>위에서 양식을 골라 추가하세요.</p></div>`;
      return;
    }
    w.innerHTML = list.map((s) => {
      const tpl = WORLD_TYPES[s.type] || WORLD_TYPES.free;
      const fieldHtml = tpl.fields.map(f => {
        const v = (s.fields||{})[f.k] || '';
        return f.ml
          ? `<div class="field"><label>${f.l}</label><textarea data-fk="${f.k}" rows="2">${escapeHtml(v)}</textarea></div>`
          : `<div class="field"><label>${f.l}</label><input data-fk="${f.k}" value="${escapeAttr(v)}"></div>`;
      }).join('');
      return `
        <div class="card" data-id="${s.id}">
          <div class="card-h">
            <div class="flex" style="gap:10px;flex:1;min-width:0">
              <span class="pill primary">${tpl.em} ${tpl.label}</span>
              <input class="t" value="${escapeAttr(s.title)}" style="flex:1;font-size:16px;font-weight:600;background:transparent;border:none;font-family:var(--font-display)">
            </div>
            <div class="flex" style="gap:6px">
              <button class="btn sm ghost" data-up type="button" title="위로">▲</button>
              <button class="btn sm ghost" data-dn type="button" title="아래">▼</button>
              <button class="btn sm danger" data-del type="button">삭제</button>
            </div>
          </div>
          ${fieldHtml ? `<div class="row">${fieldHtml.match(/<div class="field">[\s\S]*?<\/div>/g) ? `<div class="row">${fieldHtml}</div>` : fieldHtml}</div>`.replace('<div class="row"><div class="row">','<div class="row">').replace('</div></div>','</div>') : ''}
          <div class="field"><label>이미지 URL (선택)</label><input class="img" value="${escapeAttr(s.image||'')}" placeholder="https://..."></div>
          ${s.image?`<img src="${escapeAttr(s.image)}" style="max-height:220px;width:auto;border-radius:var(--radius-sm);margin-bottom:10px">`:''}
          <div class="field"><label>자유 메모 / 추가 설명 (마크다운/HTML)</label><textarea class="b" rows="4">${escapeHtml(s.body||'')}</textarea></div>
        </div>`;
    }).join('');
    $$('.card', w).forEach(card => {
      const id = card.dataset.id; const sec = world.sections.find(x => x.id === id);
      $('.t', card).addEventListener('input', e => { sec.title = e.target.value; debouncedSave(); });
      $('.b', card).addEventListener('input', e => { sec.body = e.target.value; debouncedSave(); });
      $('.img', card).addEventListener('input', e => { sec.image = e.target.value; debouncedSave(); });
      $$('[data-fk]', card).forEach(el => el.addEventListener('input', () => {
        sec.fields = sec.fields || {};
        sec.fields[el.dataset.fk] = el.value; debouncedSave();
      }));
      $('[data-del]', card).addEventListener('click', () => {
        if(!confirm('삭제할까요?')) return;
        const i = world.sections.findIndex(x => x.id === id);
        world.sections.splice(i,1); save(); refresh();
      });
      $('[data-up]', card).addEventListener('click', () => {
        const i = world.sections.findIndex(x => x.id === id);
        if(i>0){ [world.sections[i-1],world.sections[i]] = [world.sections[i],world.sections[i-1]]; save(); refresh(); }
      });
      $('[data-dn]', card).addEventListener('click', () => {
        const i = world.sections.findIndex(x => x.id === id);
        if(i<world.sections.length-1){ [world.sections[i+1],world.sections[i]] = [world.sections[i],world.sections[i+1]]; save(); refresh(); }
      });
    });
  }
  const debouncedSave = debounce(save, 350);
  $('#wsearch').addEventListener('input', refresh);
  $('#wfilter').addEventListener('change', refresh);
  refresh();
});

route('timeline', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  const tl = proj.timeline || (proj.timeline = []);
  const body = `<div class="card"><div class="timeline" id="tl"></div></div>`;
  shell('timeline', '⏳ 타임라인', `<button class="btn grad" id="addEv" type="button">+ 사건 추가</button>`, body, pid,
    `<a data-go="/dashboard">대시보드</a> › <a data-go="/project/${pid}">${escapeHtml(proj.title)}</a> › <span>타임라인</span>`);
  function save(){ SF.updateProject(pid, { timeline: tl }); }
  function refresh(){
    const sorted = [...tl].sort((a,b) => (a.order||0) - (b.order||0));
    const w = $('#tl');
    if(!sorted.length){ w.innerHTML = `<div class="empty"><div class="ic">⏳</div><h3>등록된 사건이 없어요</h3></div>`; return; }

        <div class="when">${escapeHtml(e.when||'')}</div>
        <h4>${escapeHtml(e.name)}</h4>
        <div class="muted">${renderMD(e.body||'')}</div>
      </div>`).join('');
    $$('.tl-item', w).forEach(el => el.addEventListener('click', () => openEv(el.dataset.id)));
  }
  function openEv(id){
    const e = id ? tl.find(x => x.id === id) : { order: tl.length };
    const m = document.createElement('div');
    m.className = 'modal-bg open'; m.innerHTML = `
      <div class="modal">
        <header><h3>${id?'사건 편집':'+ 새 사건'}</h3><button class="close" data-x type="button">×</button></header>
        <form id="ef">
          <div class="row">
            <div class="field"><label>시점/날짜 (자유 형식)</label><input id="evWhen" value="${escapeAttr(e.when||'')}" placeholder="예: 1024년 봄, 또는 1화"></div>
            <div class="field"><label>정렬 키</label><input id="evOrder" type="number" value="${e.order||0}"></div>
          </div>
          <div class="field"><label>제목 *</label><input id="evName" value="${escapeAttr(e.name||'')}" required></div>
          <div class="field"><label>내용 (마크다운/HTML)</label><textarea id="evBody" rows="6">${escapeHtml(e.body||'')}</textarea></div>
          <div class="flex" style="justify-content:space-between">
            <button class="btn danger" id="evDel" type="button" style="${id?'':'display:none'}">삭제</button>
            <div class="flex" style="gap:8px"><button class="btn ghost" type="button" data-x>취소</button>
            <button class="btn" type="submit">저장</button></div>
          </div>
        </form>
      </div>`;
    document.body.appendChild(m);
    const close = () => m.remove();
    $$('[data-x]', m).forEach(b => b.addEventListener('click', close));
    m.addEventListener('click', e2 => { if(e2.target === m) close(); });
    setTimeout(() => $('#evName', m).focus(), 30);
    $('#ef', m).addEventListener('submit', ev => {
      ev.preventDefault();
      const name = $('#evName', m).value.trim(); if(!name){ toast('제목 필수', 'error'); return; }
      const data = { name, when:$('#evWhen', m).value.trim(), order:+$('#evOrder', m).value||0, body:$('#evBody', m).value };
      if(id){ const i = tl.findIndex(x => x.id === id); tl[i] = { ...tl[i], ...data }; }
      else tl.push({ id: uid('e_'), ...data });
      save(); close(); refresh();
    });

      if(!confirm('삭제할까요?')) return;
      const i = tl.findIndex(x => x.id === id); tl.splice(i,1); save(); close(); refresh();
    });
  }
  $('#addEv').addEventListener('click', () => openEv(null));
  refresh();
});

  function save(){ SF.updateProject(pid, { gallery: gal }); }
  function refresh(){

      w.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="ic">🖼️</div>
        <h3>이미지가 없어요</h3><p>URL을 붙여넣거나 파일을 업로드하세요.</p></div>`; return;
    }

      <div class="thumb-card" data-id="${g.id}">
        <div class="avatar" style="background-image:url('${escapeAttr(g.src)}')"></div>
        <div class="info"><div class="muted" style="font-size:12px">${escapeHtml(g.caption||'클릭하여 캡션 편집')}</div></div>
      </div>`).join('');
    $$('.thumb-card', w).forEach(el => el.addEventListener('click', () => {
      const g = gal.find(x => x.id === el.dataset.id);
      const cap = prompt('캡션 (취소: 무변경 / 빈 값 + 확인: 삭제)', g.caption||'');
      if(cap === null) return;
      if(cap === '' && confirm('이 이미지를 삭제할까요?')){ const i = gal.findIndex(x => x.id === g.id); gal.splice(i,1); }
      else g.caption = cap;
      save(); refresh();
    }));
  }
  $('#addUrlBtn').addEventListener('click', () => {
    const u = $('#addUrl').value.trim(); if(!u) return;
    gal.push({ id: uid('g_'), src: u, caption: '' });
    $('#addUrl').value = ''; save(); refresh();
  });
  $('#pickFile').addEventListener('click', () => $('#addFile').click());
  $('#addFile').addEventListener('change', e => {
    const fs = Array.from(e.target.files||[]); let pending = fs.length; if(!pending) return;
    fs.forEach(f => {
      const r2 = new FileReader();
      r2.onload = () => { gal.push({ id: uid('g_'), src: r2.result, caption: f.name }); if(--pending === 0){ save(); refresh(); } };
      r2.readAsDataURL(f);
    });
  });
  refresh();
});

      <button class="btn sm ghost" data-ins="\`코드\`" type="button">코드</button>
      <button class="btn sm ghost" data-ins="[링크 텍스트](https://)" type="button">링크</button>
      <button class="btn sm ghost" data-ins="![설명](https://)" type="button">이미지</button>
      <button class="btn sm ghost" data-ins='&lt;iframe src=&quot;https://&quot; width=&quot;100%&quot; height=&quot;400&quot; frameborder=&quot;0&quot;&gt;&lt;/iframe&gt;' type="button">임베드</button>
      <span class="spacer"></span>
      <select id="modeSel" style="width:auto;max-width:180px"><option value="md">마크다운</option><option value="html">순수 HTML</option></select>
    </div>
    <div class="editor-grid">
      <textarea id="src" placeholder="여기에 작성하세요..."></textarea>
      <div class="preview" id="preview"></div>
    </div>`;
  shell('editor', '📝 문서 / 에디터', `
    <select id="docSel" style="min-width:180px;width:auto"></select>
    <button class="btn ghost" id="newDoc" type="button">+ 새 문서</button>
    <button class="btn ghost" id="renDoc" type="button">이름변경</button>
    <button class="btn ghost" id="dlDoc"  type="button">⤓ 다운로드</button>
    <button class="btn danger" id="delDoc" type="button">삭제</button>`, body, pid,
    `<a data-go="/dashboard">대시보드</a> › <a data-go="/project/${pid}">${escapeHtml(proj.title)}</a> › <span>문서</span>`);

  function save(){ SF.updateProject(pid, { docs: proj.docs }); }
  function refreshSel(selectId){
    const sel = $('#docSel');
    sel.innerHTML = proj.docs.length
      ? proj.docs.map(d => `<option value="${d.id}">${escapeHtml(d.title)} (${d.type})</option>`).join('')
      : '<option value="">문서 없음</option>';
    if(selectId) sel.value = selectId;
    load();
  }
  function current(){ return proj.docs.find(d => d.id === $('#docSel').value); }
  function load(){
    const d = current();
    if(!d){ $('#src').value=''; $('#preview').innerHTML='<div class="muted">문서를 만들어 주세요.</div>'; return; }
    $('#src').value = d.content||''; $('#modeSel').value = d.type||'md'; renderPv();
  }
  function renderPv(){
    const d = current(); if(!d) return;
    $('#preview').innerHTML = $('#modeSel').value === 'html' ? $('#src').value : renderMD($('#src').value);
  }
  $('#docSel').addEventListener('change', load);
  $('#src').addEventListener('input', () => { const d = current(); if(!d) return; d.content = $('#src').value; save(); renderPv(); });
  $('#modeSel').addEventListener('change', () => { const d = current(); if(!d) return; d.type = $('#modeSel').value; save(); renderPv(); });
  $('#newDoc').addEventListener('click', () => {
    const t = prompt('문서 제목', '새 문서'); if(!t) return;
    const d = { id: uid('d_'), title: t, type:'md', content:'' };
    proj.docs.push(d); save(); refreshSel(d.id);
  });
  $('#renDoc').addEventListener('click', () => {
    const d = current(); if(!d) return;
    const t = prompt('새 제목', d.title); if(!t) return;
    d.title = t; save(); refreshSel(d.id);
  });
  $('#delDoc').addEventListener('click', () => {
    const d = current(); if(!d) return;
    if(!confirm('삭제할까요?')) return;
    proj.docs = proj.docs.filter(x => x.id !== d.id); save(); refreshSel();
  });
  $('#dlDoc').addEventListener('click', () => {
    const d = current(); if(!d) return;
    downloadBlob(d.content||'', safeName(d.title) + (d.type==='html'?'.html':'.md'), d.type==='html'?'text/html':'text/markdown');
  });
  $$('[data-ins]').forEach(b => b.addEventListener('click', () => {
    const ins = b.dataset.ins.replace(/\\n/g, '\n');
    const ta = $('#src'); const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0,s) + ins + ta.value.slice(e);
    ta.focus(); ta.selectionStart = ta.selectionEnd = s + ins.length;
    ta.dispatchEvent(new Event('input'));
  }));
  refreshSel(proj.docs[0] && proj.docs[0].id);
});

/* ---------- View: Viewer (관람모드) ---------- */
route('view', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  const body = renderViewerBody(proj);
  shell('view', '👁️ 관람모드 — ' + escapeHtml(proj.title),
    `<button class="btn ghost" data-go="/project/${pid}" type="button">← 편집</button>
     <button class="btn ghost" id="vPrint" type="button">🖨️ 인쇄</button>
     <button class="btn grad" id="vDl" type="button">📤 정적 HTML 출력</button>`, body, pid,
    `<a data-go="/dashboard">대시보드</a> › <a data-go="/project/${pid}">${escapeHtml(proj.title)}</a> › <span>관람모드</span>`);
  $('#vPrint').addEventListener('click', () => window.print());
  $('#vDl').addEventListener('click', () => {
    downloadBlob(buildStandaloneHTML(proj, SF.currentUser()), safeName(proj.title)+'.html', 'text/html');
    toast('관람용 HTML 다운로드됨', 'success');
  });

  // TOC scrollspy
  const links = $$('.view-toc a');
  links.forEach(l => l.addEventListener('click', e => {
    e.preventDefault();
    const tgt = document.getElementById(l.dataset.target);
    if(tgt) tgt.scrollIntoView({ behavior:'smooth', block:'start' });
  }));
  const secs = $$('.view-sec');
  function spy(){
    let cur = secs[0] && secs[0].id;
    for(const s of secs){ if(s.getBoundingClientRect().top <= 80) cur = s.id; }
    links.forEach(l => l.classList.toggle('cur', l.dataset.target === cur));
  }
  window.addEventListener('scroll', spy, { passive:true }); spy();
});

function renderViewerBody(p){
  const sections = [];
  if(p.summary) sections.push({ id:'summary', label:'📝 소개', html:`<p style="font-size:16px;line-height:1.85">${escapeHtml(p.summary)}</p>` });
  if((p.characters||[]).length) sections.push({ id:'characters', label:'👥 등장인물', html:viewerCharsHTML(p.characters) });
  if((p.world&&p.world.sections||[]).length) sections.push({ id:'world', label:'🌍 세계관', html:viewerWorldHTML(p.world.sections) });
  if((p.timeline||[]).length) sections.push({ id:'timeline', label:'⏳ 타임라인', html:viewerTimelineHTML(p.timeline) });
  if((p.items||[]).length) sections.push({ id:'items', label:'⚔️ 아이템', html:viewerItemsHTML(p.items) });
  if((p.glossary||[]).length) sections.push({ id:'glossary', label:'📕 용어집', html:viewerGlossaryHTML(p.glossary) });
  if((p.gallery||[]).length) sections.push({ id:'gallery', label:'🖼️ 갤러리', html:viewerGalleryHTML(p.gallery) });
  if((p.chapters||[]).length) sections.push({ id:'manuscript', label:'📜 원고', html:viewerChaptersHTML(p.chapters) });

  if(!sections.length) return `<div class="empty"><div class="ic">👁️</div><h3>아직 보여줄 내용이 없어요</h3><p>인물·세계관·원고를 추가한 뒤 다시 와 보세요.</p></div>`;
  return `
    <div class="view-page">
      <div class="view-hero" style="${p.cover?`background-image:url('${escapeAttr(p.cover)}')`:''}">
        <div class="meta">
          <h1>${escapeHtml(p.title)}</h1>
          <div class="gen">${escapeHtml(p.genre||'')}</div>
        </div>
      </div>
      <div class="view-grid">
        <nav class="view-toc">
          ${sections.map(s => `<a data-target="${s.id}">${s.label}</a>`).join('')}
        </nav>
        <div>
          ${sections.map(s => `<section class="view-sec" id="${s.id}"><h2>${s.label}</h2>${s.html}</section>`).join('')}
        </div>
      </div>
    </div>`;
}
function viewerCharsHTML(chars){
  return chars.map(c => `
    <div class="view-char">
      <div class="ava" style="${c.avatar?`background-image:url('${escapeAttr(c.avatar)}')`:''}">${c.avatar?'':'👤'}</div>
      <div>
        <h3 style="margin:0 0 4px">${escapeHtml(c.name)}</h3>
        ${c.tagline?`<div class="muted" style="margin-bottom:8px;font-style:italic">${escapeHtml(c.tagline)}</div>`:''}
        <dl>
          ${c.role?`<dt>역할</dt><dd>${escapeHtml(c.role)}</dd>`:''}
          ${c.age?`<dt>나이</dt><dd>${escapeHtml(c.age)}</dd>`:''}
          ${c.gender?`<dt>성별</dt><dd>${escapeHtml(c.gender)}</dd>`:''}
          ${c.job?`<dt>직업</dt><dd>${escapeHtml(c.job)}</dd>`:''}
          ${c.appearance?`<dt>외모</dt><dd style="white-space:pre-wrap">${escapeHtml(c.appearance)}</dd>`:''}
          ${c.personality?`<dt>성격</dt><dd style="white-space:pre-wrap">${escapeHtml(c.personality)}</dd>`:''}
          ${c.ability?`<dt>능력</dt><dd style="white-space:pre-wrap">${escapeHtml(c.ability)}</dd>`:''}
          ${c.background?`<dt>배경</dt><dd style="white-space:pre-wrap">${escapeHtml(c.background)}</dd>`:''}
          ${c.like?`<dt>좋아함</dt><dd>${escapeHtml(c.like)}</dd>`:''}
          ${c.dislike?`<dt>싫어함</dt><dd>${escapeHtml(c.dislike)}</dd>`:''}
        </dl>
        ${(c.tags||[]).length?`<div style="margin-top:10px">${(c.tags||[]).map(t=>`<span class="tag" style="margin-right:4px">${escapeHtml(t)}</span>`).join('')}</div>`:''}
        ${c.note?`<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)" class="preview">${renderMD(c.note)}</div>`:''}
      </div>
    </div>`).join('');
}
function viewerWorldHTML(secs){
  return secs.map(s => {
    const tpl = WORLD_TYPES[s.type] || WORLD_TYPES.free;
    const fields = (tpl.fields||[]).map(f => {
      const v = (s.fields||{})[f.k];
      return v ? `<dt>${f.l}</dt><dd style="white-space:pre-wrap">${escapeHtml(v)}</dd>` : '';
    }).join('');
    return `<div class="view-world-card">
      <div class="tag-row"><span class="pill primary">${tpl.em} ${tpl.label}</span></div>
      <h3 style="margin:0 0 10px">${escapeHtml(s.title)}</h3>
      ${s.image?`<img src="${escapeAttr(s.image)}" style="max-height:260px;width:auto;border-radius:8px;margin-bottom:10px">`:''}
      ${fields?`<dl>${fields}</dl>`:''}
      ${s.body?`<div class="preview" style="padding:0;border:none;background:none">${renderMD(s.body)}</div>`:''}
    </div>`;
  }).join('');
}
function viewerTimelineHTML(tl){
  const sorted = [...tl].sort((a,b) => (a.order||0) - (b.order||0));
  return `<div class="timeline">${sorted.map(e => `
    <div class="tl-item" style="cursor:default">
      <div class="when">${escapeHtml(e.when||'')}</div>
      <h4>${escapeHtml(e.name)}</h4>
      <div class="muted">${renderMD(e.body||'')}</div>
    </div>`).join('')}</div>`;
}
function viewerItemsHTML(items){
  return `<div class="grid compact">${items.map(i=>`
    <div class="thumb-card" style="cursor:default">
      <div class="avatar" style="${i.image?`background-image:url('${escapeAttr(i.image)}')`:''}">${i.image?'':'⚔️'}</div>
      <div class="info">
        <h4>${escapeHtml(i.name)}</h4>
        <div class="role">${escapeHtml(i.type||'')} ${i.rarity?'· '+escapeHtml(i.rarity):''}</div>
        ${i.desc?`<div class="muted" style="font-size:12px;margin-top:4px">${escapeHtml(String(i.desc).slice(0,80))}${String(i.desc).length>80?'...':''}</div>`:''}
      </div>
    </div>`).join('')}</div>`;
}
function viewerGlossaryHTML(gl){
  const sorted = gl.slice().sort((a,b)=>String(a.term||'').localeCompare(String(b.term||''),'ko'));
  return sorted.map(g => `
    <div style="display:grid;grid-template-columns:160px 1fr;gap:14px;padding:10px 0;border-bottom:1px dashed var(--border)">
      <div style="font-weight:700;font-family:var(--font-display)">${escapeHtml(g.term)}
        ${g.alias?`<div style="font-size:11px;color:var(--text-dim);font-weight:400">= ${escapeHtml(g.alias)}</div>`:''}
      </div>
      <div>${renderMD(g.def||'')}</div>
    </div>`).join('');
}
function viewerGalleryHTML(gal){
  return `<div class="grid compact">${gal.map(g=>`
    <div class="thumb-card" style="cursor:default">
      <div class="avatar" style="background-image:url('${escapeAttr(g.src)}')"></div>
      ${g.caption?`<div class="info"><div class="muted" style="font-size:12px">${escapeHtml(g.caption)}</div></div>`:''}
    </div>`).join('')}</div>`;
}
function viewerChaptersHTML(chs){
  const sorted = chs.slice().sort((a,b)=>(a.order||0)-(b.order||0));
  return sorted.map((c,i)=>`
    <div class="view-chapter">
      <h3>${i+1}. ${escapeHtml(c.title||'제목 없음')}</h3>
      ${c.synopsis?`<div class="syn">${escapeHtml(c.synopsis)}</div>`:''}
      <div class="body">${escapeHtml(c.body||'')}</div>
    </div>`).join('');
}

      </div>`).join('')}</div>` });
  }
  if((p.items||[]).length){
    secs.push({ id:'items', label:'⚔️ 아이템', html:`<div class="ig">${p.items.map(i=>`
      <div class="icard">
        <div class="av" style="${i.image?`background-image:url('${escapeAttr(i.image)}')`:''}">${i.image?'':'⚔️'}</div>
        <div class="info">
          <h4 style="margin:0 0 4px">${esc(i.name)}</h4>
          <div style="color:#9aa3b8;font-size:12px">${esc(i.type||'')} ${i.rarity?'· '+esc(i.rarity):''}</div>
          ${i.desc?`<div style="margin-top:8px;font-size:13px">${md(i.desc)}</div>`:''}
        </div>
      </div>`).join('')}</div>` });
  }
  if((p.glossary||[]).length){
    secs.push({ id:'glossary', label:'📕 용어집', html: p.glossary.slice().sort((a,b)=>String(a.term||'').localeCompare(String(b.term||''),'ko')).map(g=>`
      <div class="gloss">
        <div class="t">${esc(g.term)}${g.alias?`<div style="font-size:11px;color:#9aa3b8;font-weight:400">= ${esc(g.alias)}</div>`:''}</div>
        <div>${md(g.def||'')}</div>
      </div>`).join('') });
  }
  if((p.gallery||[]).length){
    secs.push({ id:'gallery', label:'🖼️ 갤러리', html:`<div class="ig">${p.gallery.map(g=>`
      <div class="icard"><div class="av" style="background-image:url('${escapeAttr(g.src)}')"></div>
        ${g.caption?`<div class="info" style="font-size:12px;color:#9aa3b8">${esc(g.caption)}</div>`:''}
      </div>`).join('')}</div>` });
  }
  if((p.chapters||[]).length){
    secs.push({ id:'manuscript', label:'📜 원고', html: [...p.chapters].sort((a,b)=>(a.order||0)-(b.order||0)).map((c,i)=>`
      <div class="chap">
        <h3>${i+1}. ${esc(c.title||'제목 없음')}</h3>
        ${c.synopsis?`<div class="syn">${esc(c.synopsis)}</div>`:''}
        <div class="body">${esc(c.body||'')}</div>
      </div>`).join('') });
  }

  return `<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(p.title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>${css}</style>
</head><body>
<div class="wrap">
  <div class="hero" style="${p.cover?`background-image:url('${escapeAttr(p.cover)}')`:''}">
    <div class="meta"><h1>${esc(p.title)}</h1><div class="gen">${esc(p.genre||'')}${user?` · ${esc(user.displayName)}`:''}</div></div>
  </div>
  <div class="grid">
    <nav class="toc">${secs.map(s=>`<a href="#${s.id}">${s.label}</a>`).join('')}</nav>
    <div>${secs.map(s=>`<section class="sec" id="${s.id}"><h2>${s.label}</h2>${s.html}</section>`).join('') || '<p style="color:#9aa3b8">아직 내용이 없어요.</p>'}</div>
  </div>
  <div class="ftr">Powered by <b>StoryForge</b> · 정적 HTML 출력</div>
</div>
<script>
const links=document.querySelectorAll('.toc a');const secs=document.querySelectorAll('.sec');
function spy(){let cur=secs[0]&&secs[0].id;for(const s of secs){if(s.getBoundingClientRect().top<=80)cur=s.id;}links.forEach(l=>l.classList.toggle('cur',l.getAttribute('href')==='#'+cur));}
window.addEventListener('scroll',spy,{passive:true});spy();
<\/script>
</body></html>`;
}

/* ---------- View: Settings ---------- */
route('settings', function(){
  const u = SF.currentUser(); const s = SF.getSettings();
  const themes = [
    { v:'dark', l:'다크 (기본)' }, { v:'light', l:'라이트' }, { v:'sepia', l:'세피아' },
    { v:'midnight', l:'한밤 (블루)' }, { v:'forest', l:'숲 (녹색)' },
    { v:'rose', l:'장미 (다크 핑크)' }, { v:'ocean', l:'바다 (틸)' },
    { v:'paper', l:'종이 (라이트 베이지)' }, { v:'lavender', l:'라벤더 (라이트 보라)' },
    { v:'mint', l:'민트 (라이트 그린)' }, { v:'cyberpunk', l:'사이버펑크 (네온)' }
  ];
  const fonts = ['Noto Sans KR','Noto Serif KR','IBM Plex Sans KR','Gowun Dodum','Gowun Batang','Gaegu','Nanum Pen Script','Nanum Myeongjo','Black Han Sans','Single Day','Hi Melody','East Sea Dokdo'];
  const body = `
    <div class="row">
      <div>
        <div class="card">
          <div class="card-h"><h3>🎨 테마</h3></div>
          <div class="field"><label>테마</label>
            <select id="themeSel">${themes.map(t=>`<option value="${t.v}">${t.l}</option>`).join('')}</select></div>
          <div class="field">
            <label class="flex" style="gap:6px;align-items:center;cursor:pointer"><input id="autoAccent" type="checkbox" style="width:auto"> 강조색 자동 (테마에 맞춰)</label>
          </div>
          <div class="field"><label>강조 색상 (수동)</label><input id="accent" type="color" value="${s.accent||'#7a5cff'}"></div>
          <div class="field"><label>UI 폰트</label>
            <select id="fontSel">${fonts.map(f=>`<option>${f}</option>`).join('')}</select></div>
          <div class="field"><label>원고 본문 폰트</label>
            <select id="writeFontSel">${fonts.map(f=>`<option>${f}</option>`).join('')}</select></div>
          <button class="btn" id="saveTheme" type="button">적용</button>
        </div>
        <div class="card">
          <div class="card-h"><h3>👤 계정 정보</h3></div>
          <div class="field"><label>아이디</label><input id="userName" disabled value="${escapeAttr(u.username)}"></div>
          <div class="field"><label>표시 이름</label><input id="dispName" value="${escapeAttr(u.displayName)}"></div>
          <button class="btn" id="saveName" type="button">변경</button>
          <div class="divider"></div>
          <h3 style="margin:0 0 10px">🔒 비밀번호 변경</h3>
          <div class="field"><label>현재 비밀번호</label><input id="oldPw" type="password"></div>
          <div class="field"><label>새 비밀번호</label><input id="newPw" type="password"></div>
          <button class="btn" id="changePw" type="button">변경</button>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="card-h"><h3>💾 백업 (내보내기)</h3></div>
          <p class="muted">현재 계정의 모든 데이터(프로젝트·인물·원고 포함)를 JSON 파일로 저장합니다.</p>
          <button class="btn block" id="exportBtn" type="button">📥 JSON 다운로드</button>
        </div>
        <div class="card">
          <div class="card-h"><h3>📂 복원 (가져오기)</h3></div>
          <p class="muted">전체 백업 또는 단일 프로젝트 JSON을 가져올 수 있어요.<br><b>전체 백업</b>은 기존 데이터를 덮어씁니다.</p>
          <input id="importFile" type="file" accept="application/json,.json">
          <button class="btn danger block" id="importBtn" type="button" style="margin-top:10px">📤 가져오기</button>
        </div>
        <div class="card">
          <div class="card-h"><h3>⌨️ 키보드 단축키</h3></div>
          <div class="muted" style="line-height:1.95;font-size:13px">
            <span class="kbd">${navigator.platform.match(/Mac/)?'⌘':'Ctrl'}+K</span> 빠른 검색<br>
            <span class="kbd">Esc</span> 모달 닫기 / 집중모드 종료
          </div>
        </div>
        <div class="card" style="border-color:var(--danger)">
          <div class="card-h"><h3 style="color:var(--danger)">⚠️ 위험 구역</h3></div>
          <button class="btn danger block" id="wipeBtn" type="button">이 계정의 모든 데이터 삭제</button>
        </div>
      </div>
    </div>`;
  shell('settings', '⚙️ 설정 / 백업', '', body);

  $('#themeSel').value = s.theme || 'dark';
  $('#fontSel').value  = s.font  || 'Noto Sans KR';
  $('#writeFontSel').value = s.writeFont || 'Noto Serif KR';
  $('#autoAccent').checked = s.autoAccent !== false;

  $('#themeSel').addEventListener('change', () => { SF.saveSettings({ theme: $('#themeSel').value }); applyTheme(); });
  $('#autoAccent').addEventListener('change', () => { SF.saveSettings({ autoAccent: $('#autoAccent').checked }); applyTheme(); });
  $('#saveTheme').addEventListener('click', () => {
    SF.saveSettings({
      theme: $('#themeSel').value, accent: $('#accent').value,
      font: $('#fontSel').value, writeFont: $('#writeFontSel').value,
      autoAccent: $('#autoAccent').checked
    });
    applyTheme(); toast('테마가 적용되었습니다.', 'success');
  });
  $('#saveName').addEventListener('click', () => {
    const v = $('#dispName').value.trim(); if(!v) return;
    SF.updateUser({ displayName: v }); toast('저장됨', 'success'); setTimeout(render, 400);
  });
  $('#changePw').addEventListener('click', () => {
    try {
      SF.changePassword($('#oldPw').value, $('#newPw').value);
      toast('비밀번호가 변경되었습니다.', 'success');
      $('#oldPw').value = $('#newPw').value = '';
    } catch(e){ toast(e.message, 'error'); }
  });
  $('#exportBtn').addEventListener('click', () => {
    downloadBlob(SF.exportJSON(), `storyforge_${u.username}_${new Date().toISOString().slice(0,10)}.json`, 'application/json');
  });
  $('#importBtn').addEventListener('click', () => {
    const f = $('#importFile').files && $('#importFile').files[0];
    if(!f){ toast('파일을 선택하세요.', 'error'); return; }
    const r = new FileReader();
    r.onload = () => {
      try {
        const newPid = SF.importJSON(r.result);
        if(newPid){ toast('프로젝트 가져옴', 'success'); setTimeout(()=>go('#/project/'+newPid), 400); }
        else { toast('전체 복원 완료', 'success'); setTimeout(render, 400); }
      } catch(e){ toast(e.message, 'error'); }
    };
    r.readAsText(f);
  });
  $('#wipeBtn').addEventListener('click', () => {
    if(!confirm('정말로 모든 프로젝트와 인물 데이터를 삭제할까요?')) return;
    if(!confirm('진심으로 다시 한 번 확인합니다. 되돌릴 수 없어요.')) return;
    SF.wipeMyData(); toast('초기화됨', 'success'); setTimeout(render, 400);
  });
});

/* ---------- Global Search ---------- */
function openSearch(){
  if(document.getElementById('searchModal')) return;
  const m = document.createElement('div');
  m.className = 'modal-bg open'; m.id = 'searchModal'; m.innerHTML = `
    <div class="modal search-modal">
      <header><h3>🔍 빠른 검색</h3><button class="close" data-x type="button">×</button></header>
      <input id="sq" class="search-input" placeholder="프로젝트·인물·챕터·문서·아이템·세계관·용어 검색..." autocomplete="off">
      <div class="search-results" id="srs"></div>
      <p class="muted" style="font-size:11px;margin:10px 0 0">↑/↓ 이동 · Enter 선택 · Esc 닫기</p>
    </div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  $$('[data-x]', m).forEach(b => b.addEventListener('click', close));
  m.addEventListener('click', e => { if(e.target === m) close(); });
  let sel = 0, items = [];
  function search(q){
    q = q.trim().toLowerCase(); items = [];
    SF.getProjects().forEach(p => {
      const m = (s) => String(s||'').toLowerCase().includes(q);
      if(!q || m(p.title) || m(p.genre) || m(p.summary))
        items.push({ ic:'📖', ti:p.title, meta:'프로젝트 · '+(p.genre||''), go:'#/project/'+p.id });
      (p.characters||[]).forEach(c => {
        if(!q || m(c.name)||m(c.role)||m(c.tagline)||(c.tags||[]).some(m))
          items.push({ ic:'👥', ti:c.name, meta:p.title+' · 인물 · '+(c.role||''), go:'#/character/'+p.id });
      });
      (p.chapters||[]).forEach((c,i) => {
        if(!q || m(c.title)||m(c.synopsis)||m(c.body))
          items.push({ ic:'📜', ti:(i+1)+'. '+c.title, meta:p.title+' · 챕터', go:'#/manuscript/'+p.id+'?c='+c.id });
      });
      (p.docs||[]).forEach(d => {
        if(!q || m(d.title)||m(d.content))
          items.push({ ic:'📝', ti:d.title, meta:p.title+' · 문서', go:'#/editor/'+p.id });
      });
      (p.items||[]).forEach(it => {
        if(!q || m(it.name)||m(it.type)||m(it.desc))
          items.push({ ic:'⚔️', ti:it.name, meta:p.title+' · 아이템 · '+(it.type||''), go:'#/items/'+p.id });
      });
      (p.world && p.world.sections || []).forEach(sec => {
        if(!q || m(sec.title)||m(sec.body))
          items.push({ ic:'🌍', ti:sec.title, meta:p.title+' · 세계관', go:'#/world/'+p.id });
      });
      (p.glossary||[]).forEach(g => {
        if(!q || m(g.term)||m(g.def)||m(g.alias))
          items.push({ ic:'📕', ti:g.term, meta:p.title+' · 용어', go:'#/glossary/'+p.id });
      });
    });
    items = items.slice(0, 30); sel = 0; renderRes();
  }
  function renderRes(){
    const w = $('#srs');
    if(!items.length){ w.innerHTML = '<div class="muted" style="padding:14px">결과 없음</div>'; return; }
    w.innerHTML = items.map((it, i) => `
      <div class="res ${i===sel?'sel':''}" data-i="${i}">
        <span class="ic">${it.ic}</span>
        <div style="flex:1;min-width:0">
          <div class="ti">${escapeHtml(it.ti)}</div>
          <div class="meta">${escapeHtml(it.meta)}</div>
        </div>
      </div>`).join('');
    $$('.res', w).forEach(el => { el.addEventListener('click', () => { go(items[+el.dataset.i].go); close(); }); });
  }
  setTimeout(() => $('#sq').focus(), 30);
  $('#sq').addEventListener('input', e => search(e.target.value));
  m.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ e.preventDefault(); close(); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); if(items.length){ sel = (sel+1) % items.length; renderRes(); }}
    else if(e.key === 'ArrowUp'){ e.preventDefault(); if(items.length){ sel = (sel-1+items.length) % items.length; renderRes(); }}
    else if(e.key === 'Enter'){ e.preventDefault(); if(items[sel]){ go(items[sel].go); close(); }}
  });
  search('');
}

/* ---------- Focus mode ---------- */
function toggleFocus(){
  document.body.classList.toggle('focus');
  if(document.body.classList.contains('focus')){
    setTimeout(() => { const ta = $('#chBody'); if(ta) ta.focus(); }, 50);
  }
}
document.getElementById('focusExit').addEventListener('click', () => document.body.classList.remove('focus'));

/* ---------- Global Keys ---------- */
document.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault(); if(SF.currentUser()) openSearch();
  }
  if(e.key === 'Escape'){
    if(document.body.classList.contains('focus')) document.body.classList.remove('focus');
    const open = document.querySelector('.modal-bg.open'); if(open) open.remove();
  }
});

/* ---------- Init ---------- */
window.addEventListener('error', e => console.error('[SF]', e.message, e.filename, e.lineno));
if(!location.hash) location.hash = '#/dashboard';
render();
</script>
