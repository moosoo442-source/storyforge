<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>StoryForge — 창작자를 위한 설정집</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a5cff">
<meta name="description" content="소설가, 웹소설 작가, OC 제작자를 위한 올인원 설정집 + 집필 도구">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=Noto+Serif+KR:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Gaegu&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700;800&family=Black+Han+Sans&family=Single+Day&family=Hi+Melody&family=East+Sea+Dokdo&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e16; --bg-elev:#131725; --bg-soft:#1a2030; --bg-hover:#212a3d; --bg-glass:rgba(19,23,37,.7);
  --border:#252c3f; --border-strong:#33405e;
  --text:#eaecf3; --text-dim:#9aa3b8; --text-faint:#5e6884;
  --primary:#7a5cff; --primary-hover:#6747ee; --primary-soft:rgba(122,92,255,.16);
  --accent:#ff7ab8; --accent-soft:rgba(255,122,184,.16);
  --success:#3ddc97; --warn:#ffb454; --danger:#ff5c7a;
  --grad:linear-gradient(135deg,#7a5cff 0%,#ff7ab8 100%);
  --grad-soft:linear-gradient(135deg,rgba(122,92,255,.18) 0%,rgba(255,122,184,.18) 100%);
  --radius:14px; --radius-sm:10px; --radius-xs:6px;
  --shadow-sm:0 2px 6px rgba(0,0,0,.18);
  --shadow:0 8px 24px rgba(0,0,0,.28);
  --shadow-lg:0 16px 48px rgba(0,0,0,.42);
  --font-base:'Noto Sans KR','IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-display:'Noto Serif KR', 'Nanum Myeongjo', serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --font-write:'Noto Serif KR', 'Nanum Myeongjo', serif;
  --line:1.65; --side-w:264px;
}
[data-theme="light"]{--bg:#f6f8fc;--bg-elev:#fff;--bg-soft:#eef1f7;--bg-hover:#e3e8f1;--bg-glass:rgba(255,255,255,.78);--border:#e0e5ee;--border-strong:#cbd2dd;--text:#1a1d28;--text-dim:#5b6373;--text-faint:#9098a8;--shadow-sm:0 2px 6px rgba(20,20,40,.06);--shadow:0 8px 24px rgba(20,20,40,.10);--shadow-lg:0 16px 48px rgba(20,20,40,.16);}
[data-theme="sepia"]{--bg:#f4ecd6;--bg-elev:#fcf7e6;--bg-soft:#ece1c1;--bg-hover:#e1d5af;--bg-glass:rgba(252,247,230,.85);--border:#d6c89c;--border-strong:#b8a874;--text:#3a2e1f;--text-dim:#7a6a4d;--text-faint:#9c8d6e;--primary:#a05a2c;--primary-hover:#844214;--primary-soft:rgba(160,90,44,.14);--accent:#c97e3a;--accent-soft:rgba(201,126,58,.14);--shadow:0 8px 24px rgba(80,60,20,.12);--grad:linear-gradient(135deg,#a05a2c,#c97e3a);}
[data-theme="midnight"]{--bg:#070b1d;--bg-elev:#0e1430;--bg-soft:#162048;--bg-hover:#1f2a5a;--bg-glass:rgba(14,20,48,.78);--border:#26315f;--border-strong:#3a4a82;--text:#e7ecff;--text-dim:#8a93b8;--text-faint:#5d6489;--primary:#5cc8ff;--primary-hover:#3ab2f5;--primary-soft:rgba(92,200,255,.14);--accent:#9c7bff;--accent-soft:rgba(156,123,255,.14);--grad:linear-gradient(135deg,#5cc8ff,#9c7bff);}
[data-theme="forest"]{--bg:#0c1612;--bg-elev:#13231a;--bg-soft:#1b3024;--bg-hover:#234131;--bg-glass:rgba(19,35,26,.78);--border:#2a4434;--border-strong:#3e6650;--text:#e6efe7;--text-dim:#9bb39f;--text-faint:#6f8275;--primary:#5cc88e;--primary-hover:#3fa872;--primary-soft:rgba(92,200,142,.14);--accent:#e0b54a;--accent-soft:rgba(224,181,74,.14);--grad:linear-gradient(135deg,#5cc88e,#e0b54a);}
[data-theme="rose"]{--bg:#1a0c14;--bg-elev:#23121c;--bg-soft:#371a2a;--bg-hover:#4d2238;--bg-glass:rgba(35,18,28,.78);--border:#4f2538;--border-strong:#723652;--text:#fce6ef;--text-dim:#bd8aa0;--text-faint:#876275;--primary:#ff6b9c;--primary-hover:#e94d83;--primary-soft:rgba(255,107,156,.14);--accent:#ffb454;--accent-soft:rgba(255,180,84,.14);--grad:linear-gradient(135deg,#ff6b9c,#ffb454);}
[data-theme="ocean"]{--bg:#06141a;--bg-elev:#0d1f27;--bg-soft:#152d38;--bg-hover:#1f4252;--bg-glass:rgba(13,31,39,.78);--border:#214251;--border-strong:#356477;--text:#e0f3f9;--text-dim:#7fa7b3;--text-faint:#577783;--primary:#27c2c2;--primary-hover:#15a3a3;--primary-soft:rgba(39,194,194,.14);--accent:#ffae5c;--accent-soft:rgba(255,174,92,.14);--grad:linear-gradient(135deg,#27c2c2,#ffae5c);}
[data-theme="paper"]{--bg:#fdfaf3;--bg-elev:#fff;--bg-soft:#f3eedf;--bg-hover:#ebe4cf;--bg-glass:rgba(255,255,255,.85);--border:#e2dac4;--border-strong:#c8bea0;--text:#22201b;--text-dim:#6f6852;--text-faint:#9c9676;--primary:#5b3a29;--primary-hover:#3f281a;--primary-soft:rgba(91,58,41,.10);--accent:#a86f3c;--accent-soft:rgba(168,111,60,.10);--shadow:0 8px 24px rgba(60,40,20,.08);--grad:linear-gradient(135deg,#5b3a29,#a86f3c);}
[data-theme="lavender"]{--bg:#f5f1fb;--bg-elev:#fff;--bg-soft:#ebe3f6;--bg-hover:#dbcef0;--bg-glass:rgba(255,255,255,.85);--border:#dccff0;--border-strong:#b9a4dd;--text:#241733;--text-dim:#6f5e88;--text-faint:#9285a8;--primary:#7c5cff;--primary-hover:#5d3df0;--primary-soft:rgba(124,92,255,.12);--accent:#ff7ab8;--accent-soft:rgba(255,122,184,.12);--shadow:0 8px 24px rgba(80,40,160,.10);}
[data-theme="mint"]{--bg:#eef9f4;--bg-elev:#fff;--bg-soft:#dcf2e8;--bg-hover:#c6e8d7;--bg-glass:rgba(255,255,255,.85);--border:#bfe3d3;--border-strong:#94caaf;--text:#0f3325;--text-dim:#4d735f;--text-faint:#7a937f;--primary:#1ea674;--primary-hover:#15814f;--primary-soft:rgba(30,166,116,.12);--accent:#ff8a4c;--accent-soft:rgba(255,138,76,.12);--grad:linear-gradient(135deg,#1ea674,#ff8a4c);}
[data-theme="cyberpunk"]{--bg:#06031a;--bg-elev:#100a30;--bg-soft:#1c1448;--bg-hover:#2c1f6a;--bg-glass:rgba(16,10,48,.78);--border:#3b2a78;--border-strong:#5a3fbf;--text:#e8e0ff;--text-dim:#a99dd2;--text-faint:#766abc;--primary:#ff2ad1;--primary-hover:#e019b8;--primary-soft:rgba(255,42,209,.14);--accent:#3df0ff;--accent-soft:rgba(61,240,255,.14);--grad:linear-gradient(135deg,#ff2ad1,#3df0ff);}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-base);font-size:15px;line-height:var(--line);min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .35s ease,color .35s ease;overflow-x:hidden}
a{color:var(--primary);text-decoration:none;transition:color .15s}
a:hover{color:var(--primary-hover);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
img,svg,video{max-width:100%;display:block}
hr{border:none;border-top:1px solid var(--border);margin:20px 0}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint)}
::-webkit-scrollbar-track{background:transparent}

h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;line-height:1.25;margin:0}
h1{font-size:clamp(22px,3vw,30px)} h2{font-size:20px} h3{font-size:17px} h4{font-size:15px}

.app{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh}
.sidebar{background:var(--bg-elev);border-right:1px solid var(--border);padding:18px 14px 100px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;transition:transform .25s cubic-bezier(.4,0,.2,1),background .35s,border-color .35s;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:-.02em}
.brand-logo{width:32px;height:32px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow-sm)}
.brand-name{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.who{font-size:11.5px;color:var(--text-dim);padding:0 8px 12px;display:flex;align-items:center;gap:6px}
.who-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 25%, transparent)}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius-sm);color:var(--text);text-decoration:none;margin-bottom:2px;font-size:13.5px;cursor:pointer;transition:background .12s,color .12s,transform .08s,box-shadow .12s;font-weight:500}
.sidebar nav a:hover{background:var(--bg-soft);text-decoration:none;transform:translateX(2px)}
.sidebar nav a.active{background:var(--primary-soft);color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.sidebar nav a .ic{font-size:15px;width:20px;display:inline-flex;justify-content:center}
.sb-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin:16px 12px 6px;font-weight:700}

.main{padding:26px clamp(18px,3.4vw,40px) 90px;min-width:0;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.menu-btn{display:none;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;cursor:pointer;color:var(--text);margin-bottom:14px;font-size:18px;font-family:inherit}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:14px;flex-wrap:wrap}
.topbar .ttl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{display:inline-block;font-family:var(--font-mono);font-size:11px;padding:1px 6px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;background:var(--bg-soft);color:var(--text-dim)}
.crumb{font-size:13px;color:var(--text-dim);margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--text-dim);cursor:pointer}
.crumb a:hover{color:var(--text)}

.btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;font-size:13.5px;font-family:inherit;transition:background .15s,transform .06s,opacity .15s,box-shadow .2s,border-color .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;white-space:nowrap}
.btn:hover{background:var(--primary-hover);text-decoration:none;box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 35%, transparent);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--bg-soft);box-shadow:none;border-color:var(--border-strong)}
.btn.danger{background:var(--danger)}
.btn.danger:hover{background:#e54866;box-shadow:0 6px 16px rgba(255,92,122,.35)}
.btn.success{background:var(--success);color:#04241a}
.btn.warn{background:var(--warn);color:#3a2400}
.btn.sm{padding:6px 12px;font-size:12.5px;font-weight:500}
.btn.lg{padding:12px 22px;font-size:15px}
.btn.block{width:100%}
.btn.icon{padding:8px;min-width:36px;font-size:15px}
.btn.grad{background:var(--grad)}
.btn.grad:hover{filter:brightness(1.1);box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 40%, transparent)}

input,textarea,select{width:100%;background:var(--bg-elev);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;font-family:inherit;font-size:14px;transition:border-color .15s, box-shadow .15s, background .35s, color .35s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px;cursor:pointer}
input[type="color"]{padding:4px;height:42px;cursor:pointer;background:none}
input[type="file"]{padding:7px;cursor:pointer}
input[type="checkbox"],input[type="radio"]{width:auto;cursor:pointer;accent-color:var(--primary)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent)}
input:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
textarea{resize:vertical;min-height:90px;line-height:1.65}
label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;font-weight:500}
.field{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:760px){.row,.row3,.row4{grid-template-columns:1fr}}

.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:background .35s, border-color .35s, box-shadow .2s, transform .15s}
.card.hover:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.card-h h3{margin:0}
.card.gradient{background:var(--grad-soft);border:1px solid var(--border)}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

.thumb-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .18s cubic-bezier(.4,0,.2,1),border-color .15s,box-shadow .2s;display:flex;flex-direction:column}
.thumb-card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:var(--shadow)}
.thumb-card .avatar{width:100%;aspect-ratio:1/1;background:var(--bg-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:42px;color:var(--text-faint);position:relative}
.thumb-card .avatar::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.18))}
.thumb-card .info{padding:12px 14px;flex:1;display:flex;flex-direction:column}
.thumb-card .info h4{margin:0 0 4px;font-size:14.5px;font-family:var(--font-base);font-weight:600}
.thumb-card .info .role{font-size:12px;color:var(--text-dim)}
.thumb-card .info .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}

.tag{background:var(--bg-soft);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:11px;display:inline-flex;align-items:center;gap:4px;font-weight:500}
.tag.primary{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.tag.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.success{background:color-mix(in srgb,var(--success) 18%, transparent);color:var(--success);border-color:transparent}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%, transparent);color:var(--warn);border-color:transparent}
.tag.danger{background:color-mix(in srgb,var(--danger) 18%, transparent);color:var(--danger);border-color:transparent}
.tag .x{cursor:pointer;opacity:.7}
.tag .x:hover{opacity:1}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;background:var(--bg-soft);color:var(--text-dim);border:1px solid var(--border);font-weight:500}
.pill.primary{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.muted{color:var(--text-dim);font-size:13px}
.flex{display:flex;gap:8px;align-items:center}
.flex.between{justify-content:space-between}
.flex.col{flex-direction:column;align-items:stretch}
.flex.wrap{flex-wrap:wrap}
.spacer{flex:1}
.right{text-align:right}

.stat{display:flex;flex-direction:column;gap:4px;padding:14px 16px;background:var(--bg-soft);border-radius:var(--radius-sm);border:1px solid var(--border);min-width:120px}
.stat .lab{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat .val{font-size:22px;font-weight:700;font-family:var(--font-display);color:var(--text)}
.stat.grad{background:var(--grad-soft);border:none}

.empty{text-align:center;color:var(--text-dim);padding:60px 20px}
.empty .ic{font-size:54px;margin-bottom:12px;opacity:.7}
.empty h3{color:var(--text);margin:8px 0 6px}
.empty p{margin:6px 0;font-size:13.5px}
.divider{height:1px;background:var(--border);margin:18px 0}

.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(900px 600px at 5% -10%, var(--primary-soft), transparent 55%),
             radial-gradient(700px 500px at 100% 110%, var(--accent-soft), transparent 55%),
             var(--bg)}
.auth-card{width:100%;max-width:440px;background:var(--bg-elev);border:1px solid var(--border);border-radius:18px;padding:34px 30px;box-shadow:var(--shadow-lg)}
.auth-card .logo{width:48px;height:48px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:24px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.auth-card h1{font-size:30px;line-height:1.15;margin:0 0 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-card .sub{color:var(--text-dim);margin:0 0 22px;font-size:13.5px}
.tabs{display:flex;background:var(--bg-soft);padding:4px;border-radius:var(--radius-sm);margin-bottom:18px}
.tabs button{flex:1;background:transparent;border:none;padding:9px;color:var(--text-dim);cursor:pointer;border-radius:7px;font-family:inherit;font-size:13.5px;font-weight:600;transition:background .18s,color .18s}
.tabs button.active{background:var(--bg-elev);color:var(--text);box-shadow:var(--shadow-sm)}

.modal-bg{position:fixed;inset:0;background:rgba(2,4,12,.62);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px);animation:fadeBg .18s}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.modal-bg.open{display:flex}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:18px;padding:26px;width:100%;max-width:580px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:popIn .22s cubic-bezier(.4,0,.2,1)}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.modal.lg{max-width:820px}
.modal.xl{max-width:1040px}
.modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.modal header h3{margin:0;font-size:18px}
.modal .close{background:transparent;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;line-height:1;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;transition:background .15s,color .15s}
.modal .close:hover{background:var(--bg-soft);color:var(--text)}

.toast-wrap{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:2000;pointer-events:none}
.toast{background:var(--bg-elev);border:1px solid var(--border);padding:11px 16px;border-radius:var(--radius-sm);box-shadow:var(--shadow);animation:slideIn .25s;min-width:200px;max-width:340px;font-size:13.5px;pointer-events:auto;font-weight:500}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--danger)}
.toast.warn{border-left:4px solid var(--warn)}
.toast.info{border-left:4px solid var(--primary)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

.tree-canvas{position:relative;background:radial-gradient(circle, var(--border) 1px, transparent 1px) 0 0/24px 24px, var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);width:100%;height:min(70vh,640px);overflow:hidden;user-select:none;touch-action:none}
.tree-svg{position:absolute;inset:0;pointer-events:none;color:var(--text-faint)}
.node{position:absolute;background:var(--bg-soft);border:2px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 13px;cursor:grab;user-select:none;min-width:120px;text-align:center;font-size:13px;font-weight:600;color:var(--text);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s,transform .1s}
.node:hover{transform:translateY(-1px)}
.node.dragging{cursor:grabbing;opacity:.85;z-index:5}
.node.selected{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.node small{display:block;color:var(--text-dim);font-weight:400;font-size:11px;margin-top:2px}
.node[data-type="가족"]{border-color:#7c5cff}
.node[data-type="조직"]{border-color:#3ddc97}
.node[data-type="능력"]{border-color:#ffb454}
.node[data-type="기타"]{border-color:#7aa1ff}

.preview{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:20px;overflow-y:auto;word-wrap:break-word}
.preview h1,.preview h2,.preview h3{margin-top:14px}
.preview h1:first-child,.preview h2:first-child,.preview h3:first-child{margin-top:0}
.preview table{border-collapse:collapse;width:100%;margin:10px 0}
.preview th,.preview td{border:1px solid var(--border);padding:7px 10px;text-align:left}
.preview th{background:var(--bg-soft);font-weight:700}
.preview blockquote{border-left:4px solid var(--primary);margin:10px 0;padding:6px 14px;background:var(--bg-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.preview pre{background:var(--bg-soft);padding:13px;border-radius:var(--radius-sm);overflow-x:auto}
.preview code{font-family:var(--font-mono);font-size:13px}
.preview iframe{width:100%;max-width:100%;min-height:280px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.preview img{border-radius:var(--radius-sm)}

.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:70vh}
@media (max-width:920px){.editor-grid{grid-template-columns:1fr;height:auto}.editor-grid textarea{min-height:340px}}
.editor-grid textarea{height:100%;font-family:var(--font-mono);font-size:13.5px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px}

.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--primary),var(--accent))}
.tl-item{position:relative;margin-bottom:18px;cursor:pointer;padding:10px 14px;border-radius:var(--radius-sm);transition:background .15s}
.tl-item:hover{background:var(--bg-soft)}
.tl-item::before{content:'';position:absolute;left:-27px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--primary);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--primary)}
.tl-item .when{font-size:12px;color:var(--text-dim);font-weight:600}
.tl-item h4{margin:2px 0 4px;font-size:15px}

/* Manuscript */
.ms-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;min-height:calc(100vh - 170px)}
.ms-list{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:12px;overflow-y:auto;max-height:calc(100vh - 170px)}
.ms-list .chap{padding:11px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;margin-bottom:4px;transition:background .15s,border-color .15s}
.ms-list .chap:hover{background:var(--bg-soft)}
.ms-list .chap.active{background:var(--primary-soft);border-color:var(--primary)}
.ms-list .chap .ttl{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ms-list .chap .meta{font-size:11px;color:var(--text-dim);margin-top:4px;display:flex;gap:8px;align-items:center}
.ms-list .chap-actions{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .15s}
.ms-list .chap:hover .chap-actions,.ms-list .chap.active .chap-actions{opacity:1}
.ms-list .chap-actions button{flex:1;font-size:11px;padding:4px;background:transparent;color:var(--text-dim);border:1px solid var(--border);border-radius:5px;cursor:pointer;font-family:inherit}
.ms-list .chap-actions button:hover{background:var(--bg);color:var(--text)}
.ms-pane{display:flex;flex-direction:column;gap:10px;min-width:0}
.ms-meta{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;align-items:center}
@media (max-width:600px){.ms-meta{grid-template-columns:1fr auto}}
.ms-write{flex:1;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:8px;min-height:520px}
.ms-write textarea{flex:1;min-height:480px;font-family:var(--font-write);font-size:16px;line-height:1.9;border:none;background:transparent;padding:6px 4px;resize:none}
.ms-write textarea:focus{box-shadow:none}
.ms-stats{display:flex;gap:14px;font-size:12px;color:var(--text-dim);flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:9px;justify-content:space-between}
.ms-stats b{color:var(--text);font-weight:600}
.ms-status{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.status-draft{color:var(--text-dim)}
.status-editing{color:var(--warn)}
.status-done{color:var(--success)}
@media (max-width:920px){.ms-grid{grid-template-columns:1fr}.ms-list{max-height:240px}}

/* Focus mode */
body.focus .sidebar,body.focus .menu-btn,body.focus .topbar,body.focus .crumb,body.focus .mob-nav{display:none !important}
body.focus .app{grid-template-columns:1fr}
body.focus .main{padding:48px max(20px,calc((100vw - 780px)/2))}
body.focus .ms-grid{grid-template-columns:1fr;min-height:calc(100vh - 80px)}
body.focus .ms-list{display:none}
body.focus .ms-write{border:none;background:transparent}
body.focus .ms-write textarea{font-size:18px;line-height:2}
body.focus .focus-bar{display:flex !important}
.focus-bar{display:none;position:fixed;top:14px;right:14px;gap:8px;z-index:50}

/* Search */
.search-modal{max-width:580px}
.search-input{font-size:16px;padding:14px}
.search-results{margin-top:12px;max-height:55vh;overflow-y:auto}
.search-results .res{padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:10px}
.search-results .res:hover,.search-results .res.sel{background:var(--bg-soft);border-color:var(--primary)}
.search-results .res .ic{font-size:18px}
.search-results .res .ti{font-weight:600;font-size:14px}
.search-results .res .meta{font-size:11px;color:var(--text-dim)}

/* World templates */
.tpl-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;text-align:center;transition:transform .15s,border-color .15s,background .15s}
.tpl-card:hover{transform:translateY(-2px);border-color:var(--primary);background:var(--primary-soft)}
.tpl-card .em{font-size:32px;margin-bottom:6px}
.tpl-card .nm{font-weight:600;font-size:13.5px}

/* Mobile bottom nav */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-glass);backdrop-filter:blur(14px);border-top:1px solid var(--border);z-index:50;padding:8px max(8px,env(safe-area-inset-bottom))}
.mob-nav-row{display:flex;gap:0;justify-content:space-around}
.mob-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;color:var(--text-dim);text-decoration:none;font-size:10.5px;border-radius:8px;transition:color .15s,background .15s}
.mob-nav a.active{color:var(--primary);background:var(--primary-soft)}
.mob-nav a .ic{font-size:18px}

/* Viewer */
.view-page{max-width:920px;margin:0 auto}
.view-hero{position:relative;height:280px;border-radius:18px;background:var(--grad-soft) center/cover no-repeat;display:flex;align-items:flex-end;padding:30px;margin-bottom:30px;overflow:hidden}
.view-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.view-hero .meta{position:relative;z-index:1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.view-hero h1{font-size:38px;color:#fff;margin:0 0 6px}
.view-hero .gen{font-size:14px;opacity:.9}
.view-toc{position:sticky;top:18px;align-self:start;font-size:13.5px}
.view-toc a{display:block;padding:6px 12px;color:var(--text-dim);border-left:2px solid transparent;border-radius:0 6px 6px 0;cursor:pointer}
.view-toc a:hover{color:var(--text);background:var(--bg-soft)}
.view-toc a.cur{color:var(--primary);border-left-color:var(--primary);font-weight:600;background:var(--primary-soft)}
.view-grid{display:grid;grid-template-columns:200px 1fr;gap:36px}
@media (max-width:920px){.view-grid{grid-template-columns:1fr}.view-toc{position:static}.view-hero{height:200px;padding:20px}.view-hero h1{font-size:26px}}
.view-sec{padding:30px 0;border-bottom:1px dashed var(--border);scroll-margin-top:20px}
.view-sec h2{font-size:24px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.view-char{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;background:var(--bg-elev)}
.view-char .ava{width:120px;height:120px;border-radius:var(--radius);background:var(--bg-soft) center/cover no-repeat;display:grid;place-items:center;font-size:42px;color:var(--text-faint)}
.view-char dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.view-char dt{color:var(--text-dim);font-weight:500}
.view-char dd{margin:0}
.view-world-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.view-world-card .tag-row{margin-bottom:8px}
.view-world-card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0 0 10px}
.view-world-card dt{color:var(--text-dim);font-weight:500}
.view-chapter{padding:18px 0;border-bottom:1px dashed var(--border)}
.view-chapter h3{font-family:var(--font-write);font-size:20px;margin-bottom:8px}
.view-chapter .syn{color:var(--text-dim);font-style:italic;margin-bottom:8px;font-size:13.5px}
.view-chapter .body{font-family:var(--font-write);font-size:15.5px;line-height:1.95;white-space:pre-wrap}

@media (max-width:820px){
  :root{--side-w:240px}
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:var(--side-w);transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex !important}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:15;backdrop-filter:blur(2px)}
  .scrim.open{display:block}
  .mob-nav{display:block}
  .main{padding-bottom:90px}
}
@media print{
  .sidebar,.actions,.menu-btn,.toast-wrap,.focus-bar,.scrim,.mob-nav,.crumb{display:none !important}
  .app{display:block}.main{padding:0}body{background:#fff;color:#000}
  .ms-grid{grid-template-columns:1fr}.ms-list{display:none}
  .ms-write{border:none;box-shadow:none;padding:0;background:#fff}
  .ms-write textarea{font-size:13pt;line-height:1.85;color:#000;background:#fff !important;-webkit-text-fill-color:#000}
}

<body>
<div id="app">로딩 중...</div>
<div class="scrim" id="scrim"></div>
<div class="toast-wrap" id="toasts"></div>
<div class="focus-bar"><button class="btn ghost sm" id="focusExit" type="button">✕ 집중모드 종료 (Esc)</button></div>

<script>
'use strict';
/* StoryForge — single file SPA (v5)
   Drop index.html into any GitHub Pages repo. No build step. No backend. */

/* ---------- helpers ---------- */
const $  = (s, c) => (c||document).querySelector(s);
const $$ = (s, c) => Array.from((c||document).querySelectorAll(s));
const escapeHtml = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const escapeAttr = s => String(s==null?'':s).replace(/[<>"&]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const uid = pre => (pre||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
function toast(msg, type){
  const w = $('#toasts'); if(!w) return;
  const el = document.createElement('div'); el.className = 'toast ' + (type||'info'); el.textContent = msg;
  w.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),250); }, 2600);
}
function countText(s){
  s = String(s||'');
  return { chars:s.length, charsNoSpace:s.replace(/\s/g,'').length, words:s.trim()?s.trim().split(/\s+/).length:0 };
}
const fmtNum = n => n.toLocaleString('ko-KR');
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
}
function safeName(s){ return String(s||'untitled').replace(/[^\w가-힣\- _.]/g,'_').slice(0,80); }

/* ---------- World templates ---------- */
const WORLD_TYPES = {
  free:     { label:'자유 항목',   em:'📝', fields:[] },
  location: { label:'장소 / 지역', em:'🗺️', fields:[
    { k:'climate',    l:'기후 / 지형' },
    { k:'population', l:'인구 / 주민 구성' },
    { k:'rule',       l:'통치자 / 통치 형태' },
    { k:'features',   l:'특징 · 명소', ml:true } ]},
  magic: { label:'마법 / 능력 체계', em:'✨', fields:[
    { k:'source',  l:'힘의 원천' },
    { k:'limits',  l:'제약 / 대가', ml:true },
    { k:'rank',    l:'등급 / 단계' },
    { k:'examples',l:'대표 스킬 / 주문', ml:true } ]},
  org: { label:'조직 / 길드 / 세력', em:'🏛️', fields:[
    { k:'leader',  l:'수장' },
    { k:'scale',   l:'규모' },
    { k:'rank',    l:'계급 / 직위', ml:true },
    { k:'purpose', l:'목적 / 이념', ml:true },
    { k:'enemy',   l:'적대 / 동맹' } ]},
  race: { label:'종족 / 인종', em:'🧝', fields:[
    { k:'appearance',l:'외형 특징' },
    { k:'lifespan',  l:'평균 수명' },
    { k:'traits',    l:'특기 / 능력', ml:true },
    { k:'society',   l:'사회 / 문화', ml:true },
    { k:'origin',    l:'기원' } ]},
  religion: { label:'종교 / 신화', em:'⛩️', fields:[
    { k:'gods',     l:'신격 / 존재' },
    { k:'doctrine', l:'교리 / 신조', ml:true },
    { k:'rituals',  l:'의식 / 축제', ml:true },
    { k:'priest',   l:'사제 / 조직' } ]},
  event: { label:'역사 / 사건', em:'📜', fields:[
    { k:'when',        l:'시점' },
    { k:'who',         l:'관련 인물 / 세력' },
    { k:'consequence', l:'결과 · 영향', ml:true } ]},
  artifact: { label:'유물 / 보구', em:'💎', fields:[
    { k:'origin',  l:'기원' },
    { k:'power',   l:'능력', ml:true },
    { k:'cost',    l:'대가 / 부작용' },
    { k:'owner',   l:'현재 소유자 / 위치' } ]},
  language: { label:'언어 / 문자', em:'🔤', fields:[
    { k:'speakers', l:'사용자' },
    { k:'grammar',  l:'특징 · 문법', ml:true },
    { k:'phrases',  l:'예시 어휘', ml:true } ]},
  creature: { label:'생물 / 몬스터', em:'🐉', fields:[
    { k:'habitat',  l:'서식지' },
    { k:'size',     l:'크기 / 외형' },
    { k:'rank',     l:'위협 등급' },
    { k:'ability',  l:'능력 / 약점', ml:true },
    { k:'drop',     l:'드롭 / 소재' } ]}
};

/* ---------- Storage ---------- */
const KEY_USERS='sf_users', KEY_SESSION='sf_session', KEY_DATA='sf_data';
function getJSON(k,fb){ try{ return JSON.parse(localStorage.getItem(k)||JSON.stringify(fb)); }catch(e){ return fb; } }
function setJSON(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function djb2(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }

const SF = {
  _users(){ return getJSON(KEY_USERS, []); },
  _saveUsers(u){ setJSON(KEY_USERS, u); },
  hasAnyUser(){ return this._users().length > 0; },
  signup({username, password, displayName}){
    username = String(username||'').trim();
    password = String(password||'');
    displayName = String(displayName||'').trim() || username;
    if(!username) throw new Error('아이디를 입력하세요.');
    if(username.length < 2) throw new Error('아이디는 2자 이상이어야 합니다.');
    if(password.length < 4) throw new Error('비밀번호는 4자 이상이어야 합니다.');
    const users = this._users();
    if(users.some(u=>u.username===username)) throw new Error('이미 존재하는 아이디입니다.');
    const u = { id: uid('u_'), username, passHash: djb2(password+'|'+username), displayName, createdAt: Date.now() };
    users.push(u); this._saveUsers(users);
    this._initData(u.id);
    localStorage.setItem(KEY_SESSION, u.id);
    return u;
  },
  login(username, password){
    username = String(username||'').trim(); password = String(password||'');
    const u = this._users().find(x => x.username === username);
    if(!u || u.passHash !== djb2(password+'|'+username)) throw new Error('아이디 또는 비밀번호가 올바르지 않습니다.');
    localStorage.setItem(KEY_SESSION, u.id); return u;
  },
  logout(){ localStorage.removeItem(KEY_SESSION); },
  currentUser(){
    const id = localStorage.getItem(KEY_SESSION);
    if(!id) return null;
    return this._users().find(u => u.id === id) || null;
  },
  updateUser(patch){
    const u = this.currentUser(); if(!u) return null;
    const users = this._users(); const i = users.findIndex(x => x.id === u.id);
    users[i] = { ...users[i], ...patch }; this._saveUsers(users); return users[i];
  },
  changePassword(oldPw, newPw){
    const u = this.currentUser(); if(!u) throw new Error('로그인이 필요합니다.');
    if(djb2(oldPw+'|'+u.username) !== u.passHash) throw new Error('현재 비밀번호가 일치하지 않습니다.');
    if(String(newPw||'').length < 4) throw new Error('새 비밀번호는 4자 이상이어야 합니다.');
    const users = this._users(); const i = users.findIndex(x => x.id === u.id);
    users[i].passHash = djb2(newPw+'|'+u.username); this._saveUsers(users);
  },
  _all(){ return getJSON(KEY_DATA, {}); },
  _saveAll(d){ setJSON(KEY_DATA, d); },
  _initData(id){
    const d = this._all();
    if(!d[id]){ d[id] = { projects: [], settings:{ theme:'dark', font:'Noto Sans KR', writeFont:'Noto Serif KR', accent:'#7a5cff', autoAccent:true } }; this._saveAll(d); }
  },
  data(){
    const u = this.currentUser(); if(!u) return null;
    const all = this._all(); if(!all[u.id]){ this._initData(u.id); return this._all()[u.id]; }
    return all[u.id];
  },
  saveData(d){ const u = this.currentUser(); if(!u) return; const all = this._all(); all[u.id] = d; this._saveAll(all); },
  getProjects(){ const d = this.data(); return d ? d.projects : []; },
  getProject(id){ return this.getProjects().find(p => p.id === id) || null; },
  addProject(o){
    const d = this.data();
    const p = { id: uid('p_'), title: o.title, genre: o.genre||'미지정', summary: o.summary||'', cover: o.cover||'',
      createdAt: Date.now(), characters: [], relations: [], relPositions:{},
      tree:{ nodes:[], edges:[] }, world:{ sections:[] },
      timeline:[], items:[], gallery:[], docs:[], chapters:[], glossary:[], genres:[], goal:0 };
    d.projects.push(p); this.saveData(d); return p;
  },
  updateProject(id, patch){
    const d = this.data(); const i = d.projects.findIndex(p => p.id === id); if(i<0) return null;
    d.projects[i] = { ...d.projects[i], ...patch, updatedAt: Date.now() }; this.saveData(d); return d.projects[i];
  },
  deleteProject(id){ const d = this.data(); d.projects = d.projects.filter(p => p.id !== id); this.saveData(d); },
  addCharacter(pid, c){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return null;
    c.id = uid('c_'); c.createdAt = Date.now(); p.characters = p.characters||[]; p.characters.push(c); this.saveData(d); return c;
  },
  updateCharacter(pid, cid, patch){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return null;
    const i = (p.characters||[]).findIndex(c => c.id === cid); if(i<0) return null;
    p.characters[i] = { ...p.characters[i], ...patch }; this.saveData(d); return p.characters[i];
  },
  deleteCharacter(pid, cid){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return;
    p.characters = (p.characters||[]).filter(c => c.id !== cid);
    p.relations  = (p.relations ||[]).filter(r => r.from !== cid && r.to !== cid);
    this.saveData(d);
  },
  addChapter(pid, c){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return null;
    p.chapters = p.chapters||[];
    const ch = { id: uid('ch_'), title: c.title || '제목 없음', synopsis:'', body:'', status:'draft',
      order: p.chapters.length, createdAt: Date.now(), updatedAt: Date.now() };
    p.chapters.push(ch); this.saveData(d); return ch;
  },
  updateChapter(pid, cid, patch){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return null;
    const i = (p.chapters||[]).findIndex(c => c.id === cid); if(i<0) return null;
    p.chapters[i] = { ...p.chapters[i], ...patch, updatedAt: Date.now() }; this.saveData(d); return p.chapters[i];
  },
  deleteChapter(pid, cid){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return;
    p.chapters = (p.chapters||[]).filter(c => c.id !== cid).map((c,i)=>({...c,order:i})); this.saveData(d);
  },
  reorderChapter(pid, cid, dir){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return;
    p.chapters = (p.chapters||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const i = p.chapters.findIndex(c => c.id === cid); if(i<0) return;
    const j = i + dir; if(j < 0 || j >= p.chapters.length) return;
    [p.chapters[i], p.chapters[j]] = [p.chapters[j], p.chapters[i]];
    p.chapters.forEach((c, k) => c.order = k); this.saveData(d);
  },
  getSettings(){ const d = this.data(); return (d && d.settings) || { theme:'dark', font:'Noto Sans KR', writeFont:'Noto Serif KR', accent:'#7a5cff', autoAccent:true }; },
  saveSettings(s){ const d = this.data(); if(!d) return; d.settings = { ...d.settings, ...s }; this.saveData(d); },
  exportJSON(){
    const u = this.currentUser(); if(!u) return null;
    return JSON.stringify({ version:3, user:{ username:u.username, displayName:u.displayName }, data: this.data() }, null, 2);
  },
  exportProjectJSON(pid){
    const p = this.getProject(pid); if(!p) return null;
    return JSON.stringify({ version:3, kind:'project', project:p }, null, 2);
  },
  importJSON(text){
    const o = JSON.parse(text); if(!o) throw new Error('잘못된 백업 파일입니다.');
    const u = this.currentUser(); if(!u) throw new Error('로그인이 필요합니다.');
    if(o.kind === 'project' && o.project){
      const d = this.data(); const p = { ...o.project, id: uid('p_'), title: (o.project.title||'') + ' (가져옴)' };
      d.projects.push(p); this.saveData(d); return p.id;
    }
    if(!o.data) throw new Error('잘못된 백업 파일입니다.');
    const all = this._all(); all[u.id] = o.data; this._saveAll(all);
  },
  wipeMyData(){ const u = this.currentUser(); if(!u) return; const all = this._all(); delete all[u.id]; this._saveAll(all); this._initData(u.id); }
};
window.SF = SF;

/* ---------- Theme ---------- */
function applyTheme(){
  const s = SF.getSettings();
  const root = document.documentElement;
  root.setAttribute('data-theme', s.theme || 'dark');
  if(s.font) document.body.style.fontFamily = `'${s.font}','IBM Plex Sans KR', system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`;
  if(s.writeFont) root.style.setProperty('--font-write', `'${s.writeFont}', 'Noto Serif KR', serif`);
  if(s.autoAccent){
    root.style.removeProperty('--primary');
    root.style.removeProperty('--primary-hover');
    root.style.removeProperty('--accent');
  } else if(s.accent){
    root.style.setProperty('--primary', s.accent);
    root.style.setProperty('--primary-hover', s.accent);
  }
}

/* ---------- Markdown ---------- */
function renderMD(src){
  if(!src) return '';
  src = String(src).replace(/\r\n/g, '\n');
  const codes = [];
  src = src.replace(/```([\w-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codes.push(`<pre><code class="lang-${escapeHtml(lang)}">${escapeHtml(code)}</code></pre>`);
    return '\u0000C' + (codes.length-1) + '\u0000';
  });
  src = src.replace(/(^|\n)((?:\|.*\|\n)+)/g, (m, lead, block) => {
    const rows = block.trim().split('\n').map(r => r.trim());
    if(rows.length < 2 || !/^\|[\s:|-]+\|$/.test(rows[1])) return m;
    const head = rows[0].slice(1,-1).split('|').map(s=>s.trim());
    const body = rows.slice(2).map(r => r.slice(1,-1).split('|').map(s=>s.trim()));
    let out = '<table><thead><tr>' + head.map(h=>`<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>';
    body.forEach(r => { out += '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>'; });
    out += '</tbody></table>'; return lead + out;
  });
  const lines = src.split('\n');
  let out = '', inUl=false, inOl=false, inBq=false;
  function close(){ if(inUl){out+='</ul>';inUl=false;} if(inOl){out+='</ol>';inOl=false;} if(inBq){out+='</blockquote>';inBq=false;} }
  for(const line of lines){
    if(/^\s*<\/?(iframe|video|img|audio|div|details|summary|section|article|figure|figcaption|hr|br)/i.test(line)){ close(); out += line + '\n'; continue; }
    if(/^\s*$/.test(line)){ close(); continue; }
    let m;
    if(m = line.match(/^(#{1,6})\s+(.*)$/)){ close(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if(/^\s*([-*_])\1\1[\s\1]*$/.test(line)){ close(); out += '<hr>'; continue; }
    if(m = line.match(/^\s*[-*+]\s+(.*)$/)){ if(!inUl){close(); out+='<ul>'; inUl=true;} out += `<li>${inline(m[1])}</li>`; continue; }
    if(m = line.match(/^\s*\d+\.\s+(.*)$/)){ if(!inOl){close(); out+='<ol>'; inOl=true;} out += `<li>${inline(m[1])}</li>`; continue; }
    if(m = line.match(/^>\s?(.*)$/)){ if(!inBq){close(); out+='<blockquote>'; inBq=true;} out += inline(m[1]) + '<br>'; continue; }
    close(); out += `<p>${inline(line)}</p>`;
  }
  close();
  return out.replace(/\u0000C(\d+)\u0000/g, (_, i) => codes[+i]);
}
function inline(s){
  if(!s) return '';
  s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${escapeHtml(c)}</code>`);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]+)")?\)/g, (_,a,u,t) =>
    `<img alt="${escapeAttr(a)}" src="${escapeAttr(u)}"${t?` title="${escapeAttr(t)}"`:''} loading="lazy">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_,t,u) => `<a href="${escapeAttr(u)}" target="_blank" rel="noopener">${escapeHtml(t)}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s;
}

/* ---------- Router ---------- */
const routes = {};
function route(name, fn){ routes[name] = fn; }
function go(hash){ location.hash = hash; }
function parseHash(){
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  const [pathPart, queryPart] = h.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const params = {};
  if(queryPart) queryPart.split('&').forEach(p => { const [k,v] = p.split('='); params[k] = decodeURIComponent(v||''); });
  return { name: parts[0] || '', arg: parts[1] || '', arg2: parts[2] || '', params };
}
function render(){
  const r = parseHash();
  if(!SF.currentUser()){ routes['auth'](); return; }
  applyTheme();
  const fn = routes[r.name] || routes['dashboard'];
  fn(r);
}
window.addEventListener('hashchange', render);

        </div>

    </div>`;

  $$('[data-x]', m).forEach(b => b.addEventListener('click', close));

            <button class="btn" id="saveProj" type="button">저장</button>
          </div>

        <div class="card">
          <div class="card-h"><h3>🏷️ 커스텀 장르 / 태그</h3></div>
          <p class="muted">자신만의 장르를 만들어 두면 인물·문서에 태그로 사용할 수 있어요.</p>
          <form id="genreForm" class="flex" style="margin-top:8px">

            <button class="btn" type="submit">추가</button>
          </form>
          <div id="genreTags" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px"></div>
        </div>
        <div class="card">
          <div class="card-h"><h3>📤 내보내기</h3></div>
          <p class="muted">이 프로젝트만 따로 백업하거나, 누구나 볼 수 있는 정적 HTML 파일로 출력할 수 있어요.</p>
          <div class="flex wrap" style="gap:8px;margin-top:8px">
            <button class="btn ghost" id="dlProjJson" type="button">⤓ 프로젝트 JSON 백업</button>
            <button class="btn grad" id="dlStandalone" type="button">📤 정적 HTML 출력 (관람용)</button>
          </div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="card-h"><h3>📊 요약</h3></div>
          <div id="counters" style="font-size:13.5px;line-height:1.9"></div>
          ${goal ? `
            <div class="divider"></div>
            <div class="muted" style="font-size:12px">목표 진행률 ${fmtNum(totalChars)} / ${fmtNum(goal)}자 (${pct}%)</div>
            <div style="background:var(--bg-soft);height:10px;border-radius:999px;overflow:hidden;margin-top:6px">
              <div style="width:${pct}%;height:100%;background:var(--grad);transition:width .35s"></div>
            </div>` : ''}
        </div>
        <div class="card">
          <div class="card-h"><h3>🚀 빠른 이동</h3></div>
          <div class="flex col" style="gap:6px">
            <button class="btn ghost" data-go="/manuscript/${proj.id}" type="button">📜 원고 쓰기 시작</button>
            <button class="btn ghost" data-go="/character/${proj.id}" type="button">👥 인물 추가</button>
            <button class="btn ghost" data-go="/world/${proj.id}" type="button">🌍 세계관 작성</button>
            <button class="btn ghost" data-go="/glossary/${proj.id}" type="button">📕 용어집</button>
            <button class="btn grad" data-go="/view/${proj.id}" type="button">👁️ 관람모드 보기</button>
          </div>
        </div>
      </div>
    </div>`;
  shell('project', escapeHtml(proj.title), `<span class="pill">${escapeHtml(proj.genre||'미지정')}</span>`, body, pid,
    `<a data-go="/dashboard">대시보드</a> › <span>${escapeHtml(proj.title)}</span>`);

  $('#saveProj').addEventListener('click', () => {
    SF.updateProject(pid, {
      title: $('#pfTitle').value.trim() || proj.title,
      genre: $('#pfGenre').value.trim(),
      cover: $('#pfCover').value.trim(),
      summary: $('#pfSummary').value.trim(),
      goal: +$('#pfGoal').value || 0
    });

  $('#delProj').addEventListener('click', () => {
    if(!confirm('정말 삭제할까요? 모든 인물·문서·원고가 함께 사라집니다.')) return;
    SF.deleteProject(pid); go('#/dashboard');
  });
  $('#dlProjJson').addEventListener('click', () => {
    downloadBlob(SF.exportProjectJSON(pid), safeName(proj.title)+'.json', 'application/json');
    toast('백업 다운로드됨', 'success');
  });
  $('#dlStandalone').addEventListener('click', () => {
    downloadBlob(buildStandaloneHTML(SF.getProject(pid), SF.currentUser()), safeName(proj.title)+'.html', 'text/html');
    toast('관람용 HTML 다운로드됨', 'success');
  });

  function renderGenres(){
    const tags = SF.getProject(pid).genres || [];
    $('#genreTags').innerHTML = tags.length
      ? tags.map(t => `<span class="tag primary">${escapeHtml(t)} <span class="x" data-t="${escapeAttr(t)}">✕</span></span>`).join('')
      : '<span class="muted">아직 없음</span>';
    $$('.tag .x').forEach(el => el.addEventListener('click', () => {
      const cur = SF.getProject(pid);
      cur.genres = (cur.genres||[]).filter(x => x !== el.dataset.t);
      SF.updateProject(pid, { genres: cur.genres }); renderGenres();

  renderGenres();
  $('#genreForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#newGenre').value.trim(); if(!v) return;

    $('#newGenre').value = ''; renderGenres();

  $('#counters').innerHTML = `
    <div>👥 등장인물 <b>${(proj.characters||[]).length}</b></div>
    <div>💞 관계 <b>${(proj.relations||[]).length}</b></div>
    <div>🌳 가계도 노드 <b>${(proj.tree&&proj.tree.nodes||[]).length}</b></div>
    <div>🌍 세계관 항목 <b>${(proj.world&&proj.world.sections||[]).length}</b></div>
    <div>⏳ 타임라인 <b>${(proj.timeline||[]).length}</b></div>
    <div>⚔️ 아이템 <b>${(proj.items||[]).length}</b></div>
    <div>📕 용어 <b>${(proj.glossary||[]).length}</b></div>
    <div>🖼️ 이미지 <b>${(proj.gallery||[]).length}</b></div>
    <div>📝 설정 문서 <b>${(proj.docs||[]).length}</b></div>
    <div>📜 원고 챕터 <b>${(proj.chapters||[]).length}</b></div>
    <div>✍️ 총 글자수 <b>${fmtNum(totalChars)}</b></div>`;
});

/* ---------- View: Manuscript ---------- */
route('manuscript', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  proj.chapters = proj.chapters || [];
  let activeId = r.params.c || (proj.chapters[0] && proj.chapters[0].id) || null;

  const body = `
    <div class="ms-grid">
      <div class="ms-list" id="msList"></div>
      <div class="ms-pane" id="msPane"></div>
    </div>`;
  shell('manuscript', '📜 원고 — ' + escapeHtml(proj.title),
    `<button class="btn ghost" id="msPrint" type="button">🖨️ 인쇄/PDF</button>
     <button class="btn ghost" id="msExport" type="button">⤓ 내보내기</button>
     <button class="btn grad" id="msNew" type="button">+ 새 챕터</button>`, body, pid,
    `<a data-go="/dashboard">대시보드</a> › <a data-go="/project/${pid}">${escapeHtml(proj.title)}</a> › <span>원고</span>`);

  function refreshList(){
    const list = (SF.getProject(pid).chapters||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const el = $('#msList');
    if(!list.length){
      el.innerHTML = `<div class="empty" style="padding:20px"><div class="ic">📜</div>
        <p>아직 챕터가 없어요.<br>오른쪽 위 <b>+ 새 챕터</b> 로 시작하세요.</p></div>`;
      return;
    }
    el.innerHTML = list.map((c, i) => {
      const cn = countText(c.body); const stat = c.status||'draft';
      const stLabel = stat==='editing'?'수정중':stat==='done'?'완료':'초안';
      return `
        <div class="chap ${c.id===activeId?'active':''}" data-id="${c.id}">
          <div class="ttl"><span>${i+1}. ${escapeHtml(c.title||'제목 없음')}</span></div>
          <div class="meta">
            <span class="ms-status status-${stat}">● ${stLabel}</span>
            <span>${fmtNum(cn.chars)}자</span>
          </div>
          <div class="chap-actions">
            <button data-a="up" title="위로">▲</button>
            <button data-a="dn" title="아래">▼</button>
            <button data-a="dup" title="복제">⎘</button>
            <button data-a="del" title="삭제">🗑</button>
          </div>
        </div>`;
    }).join('');
    $$('.chap', el).forEach(card => {
      const id = card.dataset.id;
      card.addEventListener('click', e => {
        if(e.target.closest('.chap-actions')) return;
        activeId = id; refreshList(); refreshPane();
      });
      $$('.chap-actions button', card).forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        const a = b.dataset.a;
        if(a==='up'){ SF.reorderChapter(pid, id, -1); refreshList(); }
        else if(a==='dn'){ SF.reorderChapter(pid, id, +1); refreshList(); }
        else if(a==='dup'){
          const src = SF.getProject(pid).chapters.find(c=>c.id===id);
          const nc = SF.addChapter(pid, { title:(src.title||'')+' (복제)' });
          SF.updateChapter(pid, nc.id, { synopsis:src.synopsis, body:src.body, status:src.status });
          activeId = nc.id; refreshList(); refreshPane();
        }
        else if(a==='del'){
          if(!confirm('이 챕터를 삭제할까요?')) return;
          SF.deleteChapter(pid, id);
          const left = SF.getProject(pid).chapters; activeId = left[0] && left[0].id || null;
          refreshList(); refreshPane();
        }
      }));
    });
  }

  function refreshPane(){
    const pane = $('#msPane');
    const ch = activeId && (SF.getProject(pid).chapters||[]).find(c=>c.id===activeId);
    if(!ch){
      pane.innerHTML = `<div class="card" style="text-align:center;padding:60px 20px;color:var(--text-dim)">
        <div style="font-size:42px">📜</div><p>왼쪽에서 챕터를 선택하거나 <b>+ 새 챕터</b>로 시작하세요.</p></div>`;
      return;
    }
    pane.innerHTML = `
      <div class="ms-meta">
        <input id="chTitle" value="${escapeAttr(ch.title)}" placeholder="챕터 제목" style="font-size:16px;font-weight:700;font-family:var(--font-display)">
        <select id="chStatus" style="width:auto">
          <option value="draft">초안</option><option value="editing">수정중</option><option value="done">완료</option>
        </select>
        <span class="pill" id="saveInd">저장됨</span>
        <button class="btn ghost icon" id="chFocus" type="button" title="집중모드 (Esc)">🌙</button>
      </div>
      <div class="card" style="padding:14px;margin:0">
        <label style="margin-bottom:6px">개요 / 시놉시스</label>
        <textarea id="chSyn" rows="2" placeholder="이 챕터의 핵심 한두 줄 요약...">${escapeHtml(ch.synopsis||'')}</textarea>
      </div>
      <div class="ms-write">
        <textarea id="chBody" placeholder="여기에 본문을 쓰세요. 자동 저장됩니다.">${escapeHtml(ch.body||'')}</textarea>
        <div class="ms-stats" id="chStats"></div>
      </div>`;
    $('#chStatus').value = ch.status || 'draft';

    const updateStats = () => {
      const v = $('#chBody').value; const c = countText(v);
      const goal = SF.getProject(pid).goal || 0;
      const totalChars = (SF.getProject(pid).chapters||[]).reduce((s,x)=>s+(x.id===ch.id?c.chars:countText(x.body).chars),0);
      $('#chStats').innerHTML = `
        <div class="flex wrap" style="gap:14px">
          <span><b>${fmtNum(c.chars)}</b> 자</span>
          <span><b>${fmtNum(c.charsNoSpace)}</b> 자(공백 제외)</span>
          <span><b>${fmtNum(c.words)}</b> 어절</span>
        </div>
        <div class="muted">프로젝트 총 <b>${fmtNum(totalChars)}</b> 자${goal?` / ${fmtNum(goal)} (${Math.min(100,Math.round(totalChars/goal*100))}%)`:''}</div>`;
    };
    updateStats();

    const saveInd = $('#saveInd');
    const save = debounce(patch => {
      SF.updateChapter(pid, ch.id, patch);
      saveInd.textContent = '저장됨'; saveInd.style.opacity = '.5';
      const list = $('#msList');
      if(list){
        const card = list.querySelector(`.chap[data-id="${ch.id}"]`);
        if(card){
          const cn = countText($('#chBody').value);
          card.querySelector('.meta span:last-child').textContent = fmtNum(cn.chars) + '자';
        }
      }
    }, 300);
    function dirty(patch){ saveInd.textContent = '저장 중...'; saveInd.style.opacity = '1'; save(patch); }

    $('#chTitle').addEventListener('input', e => {
      dirty({ title: e.target.value });
      const card = $('#msList').querySelector(`.chap[data-id="${ch.id}"] .ttl span`);
      if(card){
        const i = (SF.getProject(pid).chapters||[]).findIndex(x=>x.id===ch.id);
        card.textContent = (i+1) + '. ' + (e.target.value || '제목 없음');
      }
    });
    $('#chSyn').addEventListener('input', e => dirty({ synopsis: e.target.value }));
    $('#chBody').addEventListener('input', e => { dirty({ body: e.target.value }); updateStats(); });
    $('#chStatus').addEventListener('change', e => {
      dirty({ status: e.target.value });
      const cardSt = $('#msList').querySelector(`.chap[data-id="${ch.id}"] .ms-status`);
      if(cardSt){
        const v = e.target.value;
        cardSt.className = 'ms-status status-' + v;
        cardSt.textContent = '● ' + (v==='editing'?'수정중':v==='done'?'완료':'초안');
      }
    });
    $('#chFocus').addEventListener('click', toggleFocus);
    setTimeout(() => $('#chBody').focus(), 50);
  }

  $('#msNew').addEventListener('click', () => {
    const t = prompt('새 챕터 제목', (proj.chapters.length+1) + '화'); if(t === null) return;
    const ch = SF.addChapter(pid, { title: t || '제목 없음' });
    activeId = ch.id; refreshList(); refreshPane();
    toast('챕터 추가됨', 'success');
  });
  $('#msPrint').addEventListener('click', () => {
    const chs = (SF.getProject(pid).chapters||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const w = window.open('', '_blank');
    if(!w){ toast('팝업 차단을 해제해 주세요.', 'error'); return; }
    w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${escapeHtml(proj.title)}</title>
      <style>body{font-family:'Noto Serif KR',serif;max-width:720px;margin:40px auto;padding:0 20px;color:#222;line-height:1.85;font-size:13pt}
      h1{font-size:24pt;text-align:center;margin-bottom:8px}.author{text-align:center;color:#888;margin-bottom:40px}
      h2{margin-top:40px;border-bottom:1px solid #ddd;padding-bottom:8px}
      .body{white-space:pre-wrap}@media print{.noprint{display:none}}</style></head><body>
      <h1>${escapeHtml(proj.title)}</h1>
      <div class="author">${escapeHtml(SF.currentUser().displayName)}</div>
      <button class="noprint" onclick="window.print()" style="margin-bottom:30px;padding:10px 20px;cursor:pointer">🖨️ 인쇄 / PDF로 저장</button>
      ${chs.map((c,i)=>`<section class="print-chap"><h2>${i+1}. ${escapeHtml(c.title||'제목 없음')}</h2>
        ${c.synopsis?`<p style="color:#666;font-style:italic">${escapeHtml(c.synopsis)}</p>`:''}
        <div class="body">${escapeHtml(c.body||'')}</div></section>`).join('')}
      </body></html>`);
    w.document.close();
  });
  $('#msExport').addEventListener('click', () => {
    const chs = (SF.getProject(pid).chapters||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const fmt = prompt('형식? (txt / md / html)', 'txt'); if(!fmt) return;
    let out = '', mime = 'text/plain', ext = 'txt';
    if(fmt === 'md'){
      out = `# ${proj.title}\n\n` + chs.map((c,i)=>`## ${i+1}. ${c.title||'제목 없음'}\n\n${c.synopsis?'> '+c.synopsis+'\n\n':''}${c.body||''}\n`).join('\n');
      mime = 'text/markdown'; ext = 'md';
    } else if(fmt === 'html'){
      out = `<!doctype html><meta charset="utf-8"><title>${escapeHtml(proj.title)}</title><h1>${escapeHtml(proj.title)}</h1>`
        + chs.map((c,i)=>`<h2>${i+1}. ${escapeHtml(c.title||'제목 없음')}</h2>`
            + (c.synopsis?`<p><i>${escapeHtml(c.synopsis)}</i></p>`:'')
            + `<pre style="white-space:pre-wrap;font-family:serif">${escapeHtml(c.body||'')}</pre>`).join('');
      mime = 'text/html'; ext = 'html';
    } else {
      out = `${proj.title}\n\n` + chs.map((c,i)=>`【${i+1}. ${c.title||'제목 없음'}】\n\n${c.body||''}\n`).join('\n----\n\n');
    }
    downloadBlob(out, safeName(proj.title)+'.'+ext, mime);
  });
  refreshList(); refreshPane();
});

route('character', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  const body = `
    <div class="flex" style="margin-bottom:14px;gap:8px;flex-wrap:wrap">
      <input id="csearch" placeholder="🔍 인물 검색..." style="max-width:280px">
      <select id="croleFilter" style="max-width:200px"><option value="">전체 역할</option></select>
    </div>
    <div id="charList" class="grid"></div>`;
  shell('character', '👥 등장인물', `<button class="btn grad" id="newBtn" type="button">+ 새 인물</button>`, body, pid,
    `<a data-go="/dashboard">대시보드</a> › <a data-go="/project/${pid}">${escapeHtml(proj.title)}</a> › <span>인물</span>`);

  function refreshFilter(){
    const roles = Array.from(new Set((SF.getProject(pid).characters||[]).map(c=>c.role).filter(Boolean)));
    $('#croleFilter').innerHTML = '<option value="">전체 역할</option>' + roles.map(r=>`<option>${escapeHtml(r)}</option>`).join('');
  }
  function refresh(){
    refreshFilter();
    const q = $('#csearch').value.trim().toLowerCase();
    const f = $('#croleFilter').value;
    const list = (SF.getProject(pid).characters || []).filter(c => {
      if(f && c.role !== f) return false;
      if(!q) return true;
      return [c.name,c.role,c.tagline,...(c.tags||[])].join(' ').toLowerCase().includes(q);
    });
    const w = $('#charList');
    if(!list.length){
      w.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="ic">👥</div>
        <h3>등장인물이 없어요</h3><p><b>+ 새 인물</b>로 첫 캐릭터를 추가하세요.</p></div>`; return;
    }
    w.innerHTML = list.map(c => `
      <div class="thumb-card" data-id="${c.id}">
        <div class="avatar" style="${c.avatar?`background-image:url('${escapeAttr(c.avatar)}')`:''}">${c.avatar?'':'👤'}</div>
        <div class="info">
          <h4>${escapeHtml(c.name)}</h4>
          <div class="role">${escapeHtml(c.role||'')} ${c.age?'· '+escapeHtml(c.age):''}</div>
          ${c.tagline?`<div class="muted" style="margin-top:4px">${escapeHtml(c.tagline)}</div>`:''}
          <div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        </div>
      </div>`).join('');
    $$('.thumb-card', w).forEach(el => el.addEventListener('click', () => openCharModal(pid, el.dataset.id, refresh)));
  }
  $('#csearch').addEventListener('input', refresh);
  $('#croleFilter').addEventListener('change', refresh);
  $('#newBtn').addEventListener('click', () => openCharModal(pid, null, refresh));
  refresh();
});

function openCharModal(pid, cid, onChange){
  const c = cid ? SF.getProject(pid).characters.find(x => x.id === cid) : {};
  const m = document.createElement('div');
  m.className = 'modal-bg open'; m.innerHTML = `
    <div class="modal lg">
      <header><h3>${cid?'👤 '+escapeHtml(c.name||'인물'):'+ 새 인물'}</h3><button class="close" data-x type="button">×</button></header>
      <form id="cf">
        <div class="row">
          <div>
            <div class="field"><label>이미지 (선택)</label>
              <input id="cAvatarFile" type="file" accept="image/*">
              <input id="cAvatar" placeholder="또는 이미지 URL" value="${escapeAttr(c.avatar||'')}" style="margin-top:6px"></div>

  document.body.appendChild(m);

route('relations', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  proj.relations = proj.relations || []; proj.relPositions = proj.relPositions || {};
  const body = `
    <p class="muted">등장인물 페이지에서 만든 인물들 사이의 관계(연인·라이벌·동료·멘토 등)를 자유롭게 연결하세요. 노드를 드래그해 위치를 옮길 수 있어요.</p>
    <div class="tree-canvas" id="canvas"><svg class="tree-svg" id="svg"></svg></div>`;
  shell('relations', '💞 인물 관계 그래프', `
    <button class="btn ghost" id="autoArr" type="button">⟳ 자동 배치</button>
    <button class="btn grad" id="addRel" type="button">+ 관계 추가</button>`, body, pid,
    `<a data-go="/dashboard">대시보드</a> › <a data-go="/project/${pid}">${escapeHtml(proj.title)}</a> › <span>관계</span>`);

  const canvas = $('#canvas'), svg = $('#svg');
  function save(){ SF.updateProject(pid, { relations: proj.relations, relPositions: proj.relPositions }); }
  function autoArr(){
    const chars = proj.characters || []; const n = chars.length; if(!n) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const cx = w/2, cy = h/2, rd = Math.min(w,h)/2 - 80;
    chars.forEach((c, i) => {
      const a = (i/n) * Math.PI * 2 - Math.PI/2;
      proj.relPositions[c.id] = { x: cx + rd*Math.cos(a) - 60, y: cy + rd*Math.sin(a) - 18 };
    });
    save(); draw();
  }
  function draw(){
    $$('.node', canvas).forEach(n => n.remove());
    const chars = proj.characters || [];
    if(!chars.length){
      const e = document.createElement('div');
      e.style.padding='20px'; e.style.color='var(--text-dim)';
      e.textContent='먼저 [등장인물]에서 인물을 추가하세요.';
      canvas.appendChild(e); return;
    }
    chars.forEach((c, i) => {
      if(!proj.relPositions[c.id]) proj.relPositions[c.id] = { x: 40 + (i%6)*160, y: 40 + Math.floor(i/6)*100 };
    });
    chars.forEach(c => {
      const pos = proj.relPositions[c.id];
      const el = document.createElement('div');
      el.className = 'node'; el.style.left = pos.x+'px'; el.style.top = pos.y+'px';
      el.innerHTML = `<div>${escapeHtml(c.name)}</div>${c.role?`<small>${escapeHtml(c.role)}</small>`:''}`;
      canvas.appendChild(el); drag(el, pos);
    });
    drawEdges();
  }
  function drawEdges(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('width', w); svg.setAttribute('height', h);
    let html = '';
    proj.relations.forEach(r2 => {
      const a = proj.relPositions[r2.from], b = proj.relPositions[r2.to];
      if(!a || !b) return;
      const ax = a.x+60, ay = a.y+18, bx = b.x+60, by = b.y+18;
      const color = r2.color || '#7a5cff';
      html += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${color}" stroke-width="2" opacity=".75" data-rid="${r2.id}" style="cursor:pointer;pointer-events:stroke"/>`;
      if(r2.label) html += `<text x="${(ax+bx)/2}" y="${(ay+by)/2-4}" fill="${color}" font-size="12" text-anchor="middle" data-rid="${r2.id}" style="cursor:pointer;pointer-events:auto;font-weight:600">${escapeHtml(r2.label)}</text>`;
    });
    svg.innerHTML = html; svg.style.pointerEvents = 'auto';
    $$('[data-rid]', svg).forEach(el => el.addEventListener('click', () => openRelModal(el.getAttribute('data-rid'))));
  }
  function drag(el, pos){
    let sx,sy,ox,oy;
    const start = (cx,cy) => { sx=cx; sy=cy; ox=pos.x; oy=pos.y; el.classList.add('dragging'); };
    const move = (cx,cy) => {
      pos.x = Math.max(0, Math.min(canvas.clientWidth-130, ox + (cx-sx)));
      pos.y = Math.max(0, Math.min(canvas.clientHeight-50, oy + (cy-sy)));
      el.style.left = pos.x+'px'; el.style.top = pos.y+'px'; drawEdges();
    };
    const end = () => { el.classList.remove('dragging'); save(); };
    el.addEventListener('mousedown', e => {
      if(e.button !== 0) return; e.preventDefault(); start(e.clientX, e.clientY);
      const mm = ev => move(ev.clientX, ev.clientY);
      const mu = () => { document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); end(); };
      document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', e => {
      const t = e.touches[0]; start(t.clientX, t.clientY);
      const tm = ev => { ev.preventDefault(); const t2 = ev.touches[0]; move(t2.clientX, t2.clientY); };
      const te = () => { document.removeEventListener('touchmove', tm); document.removeEventListener('touchend', te); end(); };
      document.addEventListener('touchmove', tm, { passive:false }); document.addEventListener('touchend', te);
    }, { passive:true });
  }
  function openRelModal(rid){
    const chars = proj.characters || [];
    if(!chars.length){ toast('먼저 인물을 만들어 주세요.', 'warn'); return; }
    const r2 = rid ? proj.relations.find(x => x.id === rid) : {};
    const opts = chars.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    const m = document.createElement('div');
    m.className = 'modal-bg open'; m.innerHTML = `
      <div class="modal">
        <header><h3>${rid?'관계 편집':'관계 추가'}</h3><button class="close" data-x type="button">×</button></header>
        <form id="rf">
          <div class="row">
            <div class="field"><label>인물 A</label><select id="rFrom">${opts}</select></div>
            <div class="field"><label>인물 B</label><select id="rTo">${opts}</select></div>
          </div>
          <div class="row">
            <div class="field"><label>관계 라벨</label><input id="rLabel" value="${escapeAttr(r2.label||'')}" placeholder="예: 연인 / 라이벌 / 멘토 / 형제"></div>
            <div class="field"><label>선 색상</label><input id="rColor" type="color" value="${r2.color||'#7a5cff'}"></div>
          </div>
          <div class="flex" style="justify-content:space-between">
            <button class="btn danger" id="rDel" type="button" style="${rid?'':'display:none'}">삭제</button>
            <div class="flex" style="gap:8px"><button class="btn ghost" type="button" data-x>취소</button>
            <button class="btn" type="submit">저장</button></div>
          </div>
        </form>
      </div>`;
    document.body.appendChild(m);
    $('#rFrom', m).value = r2.from || chars[0].id;
    $('#rTo', m).value   = r2.to   || (chars[1]||chars[0]).id;
    const close = () => m.remove();
    $$('[data-x]', m).forEach(b => b.addEventListener('click', close));
    m.addEventListener('click', e => { if(e.target === m) close(); });
    $('#rf', m).addEventListener('submit', e => {
      e.preventDefault();
      const data = { from:$('#rFrom', m).value, to:$('#rTo', m).value, label:$('#rLabel', m).value.trim(), color:$('#rColor', m).value };
      if(data.from === data.to){ toast('서로 다른 인물을 선택하세요.', 'error'); return; }
      if(rid){ const i = proj.relations.findIndex(x => x.id === rid); proj.relations[i] = { ...proj.relations[i], ...data }; }
      else proj.relations.push({ id: uid('r_'), ...data });
      save(); close(); draw();
    });
    $('#rDel', m).addEventListener('click', () => {
      if(!rid) return; if(!confirm('이 관계를 삭제할까요?')) return;
      proj.relations = proj.relations.filter(x => x.id !== rid); save(); close(); draw();
    });
  }
  $('#addRel').addEventListener('click', () => openRelModal(null));
  $('#autoArr').addEventListener('click', autoArr);
  window.addEventListener('resize', drawEdges);
  draw();
});

route('tree', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  const tree = proj.tree || (proj.tree = { nodes:[], edges:[] });
  let linkMode = false, pending = null;

  const body = `
    <p class="muted">노드를 드래그해 위치를 옮기고, [연결 모드]를 켠 뒤 두 노드를 차례로 클릭하면 선이 그려집니다.<br>
    노드 더블클릭=편집, 우클릭=삭제.</p>
    <div class="tree-canvas" id="canvas"><svg class="tree-svg" id="svg"></svg></div>`;
  shell('tree', '🌳 가계도 / 조직도', `
    <select id="typeSel" style="width:auto">
      <option value="가족">가족</option><option value="조직">조직 / 직급</option>
      <option value="능력">능력 트리</option><option value="기타">기타</option>
    </select>
    <button class="btn" id="addNode" type="button">+ 노드</button>
    <button class="btn ghost" id="linkBtn" type="button">🔗 연결: OFF</button>
    <button class="btn danger" id="clearAll" type="button">전체 삭제</button>`, body, pid,
    `<a data-go="/dashboard">대시보드</a> › <a data-go="/project/${pid}">${escapeHtml(proj.title)}</a> › <span>가계도</span>`);

  const canvas = $('#canvas'), svg = $('#svg');
  function save(){ SF.updateProject(pid, { tree }); }
  function draw(){
    $$('.node', canvas).forEach(n => n.remove());
    tree.nodes.forEach(n => {
      const el = document.createElement('div');
      el.className = 'node'; el.style.left = n.x+'px'; el.style.top = n.y+'px';
      el.dataset.type = n.type || '기타';
      el.innerHTML = `<div>${escapeHtml(n.label)}</div>${n.sub?`<small>${escapeHtml(n.sub)}</small>`:''}`;
      canvas.appendChild(el); drag(el, n);
      el.addEventListener('click', e => {
        e.stopPropagation(); if(!linkMode) return;
        if(!pending){ pending = n.id; el.classList.add('selected'); return; }
        if(pending === n.id){ pending = null; el.classList.remove('selected'); return; }
        const label = prompt('관계 라벨 (예: 부모, 부하, 멘토)', '') || '';
        tree.edges.push({ id: uid('e_'), from: pending, to: n.id, label });
        $$('.node.selected', canvas).forEach(s => s.classList.remove('selected'));
        pending = null; save(); drawEdges();
      });
      el.addEventListener('dblclick', e => {
        e.stopPropagation();
        const lab = prompt('이름', n.label); if(lab === null) return;
        const sub = prompt('부가설명', n.sub||'') || '';
        n.label = lab || n.label; n.sub = sub; save(); draw();
      });
      el.addEventListener('contextmenu', e => {
        e.preventDefault();
        if(!confirm('이 노드를 삭제할까요?')) return;
        tree.nodes = tree.nodes.filter(x => x.id !== n.id);
        tree.edges = tree.edges.filter(x => x.from !== n.id && x.to !== n.id);
        save(); draw();
      });
    });
    drawEdges();
  }
  function drawEdges(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('width', w); svg.setAttribute('height', h);
    let html = '';
    tree.edges.forEach(e => {
      const a = tree.nodes.find(n => n.id === e.from); const b = tree.nodes.find(n => n.id === e.to);
      if(!a || !b) return;
      const ax = a.x+60, ay = a.y+18, bx = b.x+60, by = b.y+18;
      html += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="currentColor" stroke-width="2" opacity=".75"/>`;
      if(e.label) html += `<text x="${(ax+bx)/2}" y="${(ay+by)/2-4}" fill="currentColor" font-size="11" text-anchor="middle" font-weight="600">${escapeHtml(e.label)}</text>`;
    });
    svg.innerHTML = html;
  }
  function drag(el, n){
    let sx,sy,ox,oy;
    const start = (cx,cy) => { sx=cx; sy=cy; ox=n.x; oy=n.y; el.classList.add('dragging'); };
    const move  = (cx,cy) => {
      n.x = Math.max(0, Math.min(canvas.clientWidth-130, ox + (cx-sx)));
      n.y = Math.max(0, Math.min(canvas.clientHeight-50, oy + (cy-sy)));
      el.style.left = n.x+'px'; el.style.top = n.y+'px'; drawEdges();
    };
    const end = () => { el.classList.remove('dragging'); save(); };
    el.addEventListener('mousedown', e => {
      if(e.button !== 0 || linkMode) return; e.preventDefault();
      start(e.clientX, e.clientY);
      const mm = ev => move(ev.clientX, ev.clientY);
      const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); end(); };
      document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', e => {
      if(linkMode) return;
      const t = e.touches[0]; start(t.clientX, t.clientY);
      const tm = ev => { ev.preventDefault(); const t2 = ev.touches[0]; move(t2.clientX, t2.clientY); };
      const te = () => { document.removeEventListener('touchmove', tm); document.removeEventListener('touchend', te); end(); };
      document.addEventListener('touchmove', tm, { passive:false }); document.addEventListener('touchend', te);
    }, { passive:true });
  }
  $('#addNode').addEventListener('click', () => {
    const type = $('#typeSel').value;
    const label = prompt(`${type} 노드 이름`, ''); if(!label) return;
    const sub = prompt('부가설명 (선택)', '') || '';
    tree.nodes.push({ id: uid('n_'), label, sub, type, x: 40 + Math.random()*200, y: 40 + Math.random()*200 });
    save(); draw();
  });
  $('#linkBtn').addEventListener('click', () => {
    linkMode = !linkMode;
    $('#linkBtn').textContent = '🔗 연결: ' + (linkMode ? 'ON' : 'OFF');
    pending = null; $$('.node.selected', canvas).forEach(s => s.classList.remove('selected'));
  });
  $('#clearAll').addEventListener('click', () => {
    if(!confirm('모든 노드와 연결을 삭제할까요?')) return;
    tree.nodes = []; tree.edges = []; save(); draw();
  });
  window.addEventListener('resize', drawEdges);
  draw();
});
