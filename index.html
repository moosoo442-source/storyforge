<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>StoryForge — 창작자를 위한 설정집</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Gaegu&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700;800&family=Black+Han+Sans&family=Single+Day&family=Hi+Melody&family=East+Sea+Dokdo&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115; --bg-elev:#161a22; --bg-soft:#1d222c; --border:#2a2f3a;
  --text:#e6e8ee; --text-dim:#9aa3b2;
  --primary:#7c5cff; --primary-hover:#6a48f5; --accent:#ff7ab8;
  --success:#3ddc97; --warn:#ffb454; --danger:#ff5c7a;
  --radius:12px; --radius-sm:8px; --shadow:0 8px 24px rgba(0,0,0,.3);
  --font-base:'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --font-write:'Noto Serif KR', 'Nanum Myeongjo', serif;
  --line:1.6;
}
[data-theme="light"]{--bg:#f7f8fb;--bg-elev:#fff;--bg-soft:#eef0f5;--border:#dfe3eb;--text:#1a1d24;--text-dim:#5b6373;--shadow:0 8px 24px rgba(20,20,40,.08);--primary:#7c5cff;--primary-hover:#6a48f5;}
[data-theme="sepia"]{--bg:#f3ecd8;--bg-elev:#fbf6e6;--bg-soft:#ebe2c6;--border:#d6c89c;--text:#3a2e1f;--text-dim:#7a6a4d;--primary:#a05a2c;--primary-hover:#844214;--accent:#c97e3a;--shadow:0 8px 24px rgba(80,60,20,.12);}
[data-theme="midnight"]{--bg:#0a0e1f;--bg-elev:#121730;--bg-soft:#1b2244;--border:#2a3158;--text:#e7ecff;--text-dim:#8a93b8;--primary:#5cc8ff;--primary-hover:#3ab2f5;--accent:#9c7bff;}
[data-theme="forest"]{--bg:#0f1a14;--bg-elev:#16241c;--bg-soft:#1f3327;--border:#2c4536;--text:#e6efe7;--text-dim:#9bb39f;--primary:#5cc88e;--primary-hover:#3fa872;--accent:#e0b54a;}
[data-theme="rose"]{--bg:#1c0e16;--bg-elev:#26131e;--bg-soft:#3a1c2c;--border:#522538;--text:#fce6ef;--text-dim:#bd8aa0;--primary:#ff6b9c;--primary-hover:#e94d83;--accent:#ffb454;}
[data-theme="ocean"]{--bg:#08161c;--bg-elev:#0f2129;--bg-soft:#172f3a;--border:#234450;--text:#e0f3f9;--text-dim:#7fa7b3;--primary:#27c2c2;--primary-hover:#15a3a3;--accent:#ffae5c;}
[data-theme="paper"]{--bg:#fdfaf3;--bg-elev:#ffffff;--bg-soft:#f3eedf;--border:#e2dac4;--text:#22201b;--text-dim:#6f6852;--primary:#5b3a29;--primary-hover:#3f281a;--accent:#a86f3c;--shadow:0 8px 24px rgba(60,40,20,.08);}
[data-theme="lavender"]{--bg:#f5f1fb;--bg-elev:#ffffff;--bg-soft:#ebe3f6;--border:#dccff0;--text:#241733;--text-dim:#6f5e88;--primary:#7c5cff;--primary-hover:#5d3df0;--accent:#ff7ab8;--shadow:0 8px 24px rgba(80,40,160,.10);}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-base);font-size:15px;line-height:var(--line);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .25s, color .25s}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
img{max-width:100%}
hr{border:none;border-top:1px solid var(--border);margin:20px 0}
::selection{background:var(--primary);color:#fff}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--bg-elev);border-right:1px solid var(--border);padding:20px 16px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;transition:transform .2s, background .25s, border-color .25s}
.sidebar h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px}
.sidebar .who{font-size:12px;color:var(--text-dim);margin:0 4px 14px}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text);text-decoration:none;margin-bottom:3px;font-size:14px;cursor:pointer;transition:background .15s,color .15s,transform .05s}
.sidebar nav a:hover{background:var(--bg-soft);text-decoration:none;transform:translateX(2px)}
.sidebar nav a.active{background:var(--primary);color:#fff}
.sidebar .sb-section{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin:18px 12px 6px}
.main{padding:28px 32px;min-width:0;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:24px}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.menu-btn{display:none;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;color:var(--text);margin-bottom:14px;font-size:18px}
.kbd{display:inline-block;font-family:var(--font-mono);font-size:11px;padding:1px 6px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;background:var(--bg-soft);color:var(--text-dim)}

.btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;font-weight:500;font-size:14px;font-family:inherit;transition:background .15s,transform .05s,opacity .15s,box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1}
.btn:hover{background:var(--primary-hover);text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--bg-soft);box-shadow:none}
.btn.danger{background:var(--danger)}
.btn.success{background:var(--success);color:#04241a}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn.icon{padding:8px;min-width:36px}

input,textarea,select{width:100%;background:var(--bg-elev);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-family:inherit;font-size:14px;transition:border-color .15s, box-shadow .15s, background .25s, color .25s}
input[type="color"]{padding:4px;height:40px;cursor:pointer}
input[type="file"]{padding:6px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:4px}
.field{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:700px){.row,.row3{grid-template-columns:1fr}}

.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:background .25s, border-color .25s}
.card h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}

.thumb-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.thumb-card:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow)}
.thumb-card .avatar{width:100%;aspect-ratio:1/1;background:var(--bg-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--text-dim)}
.thumb-card .info{padding:12px 14px}
.thumb-card .info h4{margin:0 0 4px;font-size:15px}
.thumb-card .info .role{font-size:12px;color:var(--text-dim)}
.thumb-card .info .tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}

.tag{background:var(--bg-soft);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
.tag.primary{background:var(--primary);color:#fff;border-color:transparent}
.tag.accent{background:var(--accent);color:#fff;border-color:transparent}
.tag.success{background:var(--success);color:#04241a;border-color:transparent}
.tag.warn{background:var(--warn);color:#3a2400;border-color:transparent}
.tag .x{cursor:pointer;opacity:.7}
.tag .x:hover{opacity:1}

.auth-wrap{min-height:100vh;display:grid;place-items:center;background:radial-gradient(1000px 600px at -10% -10%, color-mix(in srgb, var(--primary) 22%, transparent), transparent 60%),radial-gradient(800px 500px at 110% 110%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),var(--bg);padding:24px}
.auth-card{width:100%;max-width:430px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow)}
.auth-card h1{margin:0 0 6px;font-size:30px;line-height:1.2;background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-card .sub{color:var(--text-dim);margin:0 0 20px;font-size:14px}
.tabs{display:flex;background:var(--bg-soft);padding:4px;border-radius:var(--radius-sm);margin-bottom:18px}
.tabs button{flex:1;background:transparent;border:none;padding:8px;color:var(--text-dim);cursor:pointer;border-radius:6px;font-family:inherit;font-size:14px;font-weight:500;transition:background .15s,color .15s}
.tabs button.active{background:var(--bg-elev);color:var(--text);box-shadow:var(--shadow)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(2px);animation:fadeBg .15s}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.modal-bg.open{display:flex}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);animation:popIn .18s}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal.lg{max-width:820px}
.modal.xl{max-width:1000px}
.modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal header h3{margin:0}
.modal .close{background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;line-height:1}

.toast-wrap{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:2000}
.toast{background:var(--bg-elev);border:1px solid var(--border);padding:10px 16px;border-radius:var(--radius-sm);box-shadow:var(--shadow);animation:slideIn .25s;min-width:200px}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--danger)}
.toast.warn{border-left:4px solid var(--warn)}
.toast.info{border-left:4px solid var(--primary)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

.empty{text-align:center;color:var(--text-dim);padding:60px 20px}
.empty h3{color:var(--text);margin:12px 0 6px}
.divider{height:1px;background:var(--border);margin:16px 0}
.flex{display:flex;gap:8px;align-items:center}
.flex.between{justify-content:space-between}
.flex.col{flex-direction:column;align-items:stretch}
.spacer{flex:1}
.muted{color:var(--text-dim);font-size:13px}
.right{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--bg-soft);color:var(--text-dim);border:1px solid var(--border)}

.tree-canvas{position:relative;background:radial-gradient(circle, var(--border) 1px, transparent 1px) 0 0/24px 24px, var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);width:100%;height:600px;overflow:hidden;user-select:none;touch-action:none}
.tree-svg{position:absolute;inset:0;pointer-events:none;color:var(--text-dim)}
.node{position:absolute;background:var(--bg-soft);border:2px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;cursor:grab;user-select:none;min-width:120px;text-align:center;font-size:13px;font-weight:500;color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.2);transition:border-color .15s,box-shadow .15s}
.node.dragging{cursor:grabbing;opacity:.85;z-index:5}
.node.selected{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent)}
.node small{display:block;color:var(--text-dim);font-weight:400;font-size:11px;margin-top:2px}
.node[data-type="가족"]{border-color:#7c5cff}
.node[data-type="조직"]{border-color:#3ddc97}
.node[data-type="능력"]{border-color:#ffb454}
.node[data-type="기타"]{border-color:#7aa1ff}

.preview{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:18px;overflow-y:auto;word-wrap:break-word}
.preview h1,.preview h2,.preview h3{margin-top:0}
.preview table{border-collapse:collapse;width:100%;margin:10px 0}
.preview th,.preview td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.preview th{background:var(--bg-soft)}
.preview blockquote{border-left:4px solid var(--primary);margin:8px 0;padding:4px 12px;background:var(--bg-soft)}
.preview pre{background:var(--bg-soft);padding:12px;border-radius:var(--radius-sm);overflow-x:auto}
.preview code{font-family:var(--font-mono);font-size:13px}
.preview iframe{width:100%;max-width:100%;min-height:280px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.preview img{border-radius:var(--radius-sm)}

.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:70vh}
@media (max-width:900px){.editor-grid{grid-template-columns:1fr;height:auto}.editor-grid textarea{min-height:320px}}
.editor-grid textarea{height:100%;font-family:var(--font-mono);font-size:13px}

.timeline{position:relative;padding-left:30px}
.timeline::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:18px;cursor:pointer}
.tl-item::before{content:'';position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid var(--bg)}
.tl-item .when{font-size:12px;color:var(--text-dim)}
.tl-item h4{margin:2px 0 4px}

/* Manuscript */
.ms-grid{display:grid;grid-template-columns:280px 1fr;gap:16px;min-height:calc(100vh - 160px)}
.ms-list{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:12px;overflow-y:auto;max-height:calc(100vh - 160px)}
.ms-list .chap{padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;margin-bottom:4px;transition:background .15s,border-color .15s}
.ms-list .chap:hover{background:var(--bg-soft)}
.ms-list .chap.active{background:var(--bg-soft);border-color:var(--primary)}
.ms-list .chap .ttl{font-size:14px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ms-list .chap .meta{font-size:11px;color:var(--text-dim);margin-top:3px;display:flex;gap:8px;align-items:center}
.ms-list .chap-actions{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .15s}
.ms-list .chap:hover .chap-actions,.ms-list .chap.active .chap-actions{opacity:1}
.ms-list .chap-actions button{flex:1;font-size:11px;padding:3px;background:transparent;color:var(--text-dim);border:1px solid var(--border);border-radius:4px;cursor:pointer}
.ms-list .chap-actions button:hover{background:var(--bg);color:var(--text)}
.ms-pane{display:flex;flex-direction:column;gap:10px;min-width:0}
.ms-meta{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center}
.ms-write{flex:1;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:8px;min-height:520px}
.ms-write textarea{flex:1;min-height:480px;font-family:var(--font-write);font-size:16px;line-height:1.85;border:none;background:transparent;padding:6px 4px;resize:none}
.ms-write textarea:focus{box-shadow:none}
.ms-stats{display:flex;gap:14px;font-size:12px;color:var(--text-dim);flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:8px}
.ms-stats b{color:var(--text)}
.ms-status{display:inline-flex;align-items:center;gap:6px}
.status-draft{color:var(--text-dim)}
.status-editing{color:var(--warn)}
.status-done{color:var(--success)}
@media (max-width:900px){.ms-grid{grid-template-columns:1fr}.ms-list{max-height:240px}}

/* Focus mode */
body.focus .sidebar,body.focus .menu-btn,body.focus .topbar{display:none !important}
body.focus .app{grid-template-columns:1fr}
body.focus .main{padding:40px max(20px, calc((100vw - 760px)/2));max-width:none}
body.focus .ms-grid{grid-template-columns:1fr;min-height:calc(100vh - 80px)}
body.focus .ms-list{display:none}
body.focus .ms-write textarea{font-size:18px;line-height:2}
body.focus .focus-bar{display:flex !important}
.focus-bar{display:none;position:fixed;top:14px;right:14px;gap:8px;z-index:50}

/* Search palette */
.search-modal{max-width:560px}
.search-input{font-size:16px}
.search-results{margin-top:12px;max-height:50vh;overflow-y:auto}
.search-results .res{padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:10px}
.search-results .res:hover,.search-results .res.sel{background:var(--bg-soft);border-color:var(--primary)}
.search-results .res .ic{font-size:18px}
.search-results .res .ti{font-weight:500}
.search-results .res .meta{font-size:11px;color:var(--text-dim)}

@media (max-width:800px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:240px;transform:translateX(-100%);z-index:999;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .main{padding:20px}
  .menu-btn{display:inline-flex !important}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:998}
  .scrim.open{display:block}
}
@media print{
  .sidebar,.actions,.menu-btn,.toast-wrap,.focus-bar,.scrim{display:none !important}
  .app{display:block}.main{padding:0}body{background:#fff;color:#000}
  .ms-grid{grid-template-columns:1fr}.ms-list{display:none}
  .ms-write{border:none;box-shadow:none;padding:0}
  .ms-write textarea{font-size:14pt;line-height:1.8;color:#000;background:#fff !important;-webkit-text-fill-color:#000}
  .print-chap{page-break-after:always;padding:30px 0}
  .print-chap h2{margin-top:0}
  .print-body{white-space:pre-wrap;font-family:var(--font-write);font-size:13pt;line-height:1.85}
}
</style>
</head>
<body>
<div id="app">로딩 중...</div>
<div class="scrim" id="scrim"></div>
<div class="toast-wrap" id="toasts"></div>
<div class="focus-bar"><button class="btn ghost sm" id="focusExit" type="button">✕ 집중모드 종료 (Esc)</button></div>

<script>
/* =====================================================================
 * StoryForge — Single-file SPA  (v4)
 * Drop index.html into any GitHub Pages repo. No build step. No backend.
 * ===================================================================== */
'use strict';

/* ---------- helpers ---------- */
const $  = (s, c) => (c||document).querySelector(s);
const $$ = (s, c) => Array.from((c||document).querySelectorAll(s));
const escapeHtml = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const escapeAttr = s => String(s==null?'':s).replace(/[<>"&]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const uid = pre => (pre||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
function toast(msg, type){
  const w = $('#toasts'); if(!w) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'info'); el.textContent = msg;
  w.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),250); }, 2400);
}
function countText(s){
  s = String(s||'');
  return {
    chars: s.length,
    charsNoSpace: s.replace(/\s/g,'').length,
    words: s.trim() ? s.trim().split(/\s+/).length : 0
  };
}
function fmtNum(n){ return n.toLocaleString('ko-KR'); }

/* ---------- Storage ---------- */
const KEY_USERS='sf_users', KEY_SESSION='sf_session', KEY_DATA='sf_data';
function getJSON(k,fb){ try{ return JSON.parse(localStorage.getItem(k)||JSON.stringify(fb)); }catch(e){ return fb; } }
function setJSON(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function djb2(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }

const SF = {
  _users(){ return getJSON(KEY_USERS, []); },
  _saveUsers(u){ setJSON(KEY_USERS, u); },
  hasAnyUser(){ return this._users().length > 0; },

  signup({username, password, displayName}){
    username = String(username||'').trim();
    password = String(password||'');
    displayName = String(displayName||'').trim() || username;
    if(!username) throw new Error('아이디를 입력하세요.');
    if(username.length < 2) throw new Error('아이디는 2자 이상이어야 합니다.');
    if(password.length < 4) throw new Error('비밀번호는 4자 이상이어야 합니다.');
    const users = this._users();
    if(users.some(u=>u.username===username)) throw new Error('이미 존재하는 아이디입니다.');
    const u = { id: uid('u_'), username, passHash: djb2(password+'|'+username), displayName, createdAt: Date.now() };
    users.push(u); this._saveUsers(users);
    this._initData(u.id);
    localStorage.setItem(KEY_SESSION, u.id);
    return u;
  },
  login(username, password){
    username = String(username||'').trim(); password = String(password||'');
    const u = this._users().find(x => x.username === username);
    if(!u || u.passHash !== djb2(password+'|'+username)) throw new Error('아이디 또는 비밀번호가 올바르지 않습니다.');
    localStorage.setItem(KEY_SESSION, u.id);
    return u;
  },
  logout(){ localStorage.removeItem(KEY_SESSION); },
  currentUser(){
    const id = localStorage.getItem(KEY_SESSION);
    if(!id) return null;
    return this._users().find(u => u.id === id) || null;
  },
  updateUser(patch){
    const u = this.currentUser(); if(!u) return null;
    const users = this._users(); const i = users.findIndex(x => x.id === u.id);
    users[i] = { ...users[i], ...patch }; this._saveUsers(users); return users[i];
  },
  changePassword(oldPw, newPw){
    const u = this.currentUser(); if(!u) throw new Error('로그인이 필요합니다.');
    if(djb2(oldPw+'|'+u.username) !== u.passHash) throw new Error('현재 비밀번호가 일치하지 않습니다.');
    if(String(newPw||'').length < 4) throw new Error('새 비밀번호는 4자 이상이어야 합니다.');
    const users = this._users(); const i = users.findIndex(x => x.id === u.id);
    users[i].passHash = djb2(newPw+'|'+u.username); this._saveUsers(users);
  },
  _all(){ return getJSON(KEY_DATA, {}); },
  _saveAll(d){ setJSON(KEY_DATA, d); },
  _initData(id){
    const d = this._all();
    if(!d[id]){ d[id] = { projects: [], settings:{ theme:'dark', font:'Noto Sans KR', writeFont:'Noto Serif KR', accent:'#7c5cff', autoAccent:true } }; this._saveAll(d); }
  },
  data(){
    const u = this.currentUser(); if(!u) return null;
    const all = this._all(); if(!all[u.id]){ this._initData(u.id); return this._all()[u.id]; }
    return all[u.id];
  },
  saveData(d){ const u = this.currentUser(); if(!u) return; const all = this._all(); all[u.id] = d; this._saveAll(all); },
  getProjects(){ const d = this.data(); return d ? d.projects : []; },
  getProject(id){ return this.getProjects().find(p => p.id === id) || null; },
  addProject(o){
    const d = this.data();
    const p = { id: uid('p_'), title: o.title, genre: o.genre||'미지정', summary: o.summary||'', cover: o.cover||'',
      createdAt: Date.now(), characters: [], relations: [], relPositions:{},
      tree:{ nodes:[], edges:[] }, world:{ sections:[] },
      timeline:[], items:[], gallery:[], docs:[], chapters:[], genres:[],
      goal:0 };
    d.projects.push(p); this.saveData(d); return p;
  },
  updateProject(id, patch){
    const d = this.data(); const i = d.projects.findIndex(p => p.id === id); if(i<0) return null;
    d.projects[i] = { ...d.projects[i], ...patch, updatedAt: Date.now() }; this.saveData(d); return d.projects[i];
  },
  deleteProject(id){ const d = this.data(); d.projects = d.projects.filter(p => p.id !== id); this.saveData(d); },
  addCharacter(pid, c){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return null;
    c.id = uid('c_'); c.createdAt = Date.now(); p.characters = p.characters||[]; p.characters.push(c); this.saveData(d); return c;
  },
  updateCharacter(pid, cid, patch){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return null;
    const i = (p.characters||[]).findIndex(c => c.id === cid); if(i<0) return null;
    p.characters[i] = { ...p.characters[i], ...patch }; this.saveData(d); return p.characters[i];
  },
  deleteCharacter(pid, cid){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return;
    p.characters = (p.characters||[]).filter(c => c.id !== cid);
    p.relations  = (p.relations ||[]).filter(r => r.from !== cid && r.to !== cid);
    this.saveData(d);
  },
  addChapter(pid, c){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return null;
    p.chapters = p.chapters||[];
    const ch = { id: uid('ch_'), title: c.title || '제목 없음', synopsis:'', body:'', status:'draft',
      order: p.chapters.length, createdAt: Date.now(), updatedAt: Date.now() };
    p.chapters.push(ch); this.saveData(d); return ch;
  },
  updateChapter(pid, cid, patch){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return null;
    const i = (p.chapters||[]).findIndex(c => c.id === cid); if(i<0) return null;
    p.chapters[i] = { ...p.chapters[i], ...patch, updatedAt: Date.now() }; this.saveData(d); return p.chapters[i];
  },
  deleteChapter(pid, cid){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return;
    p.chapters = (p.chapters||[]).filter(c => c.id !== cid).map((c,i)=>({...c,order:i})); this.saveData(d);
  },
  reorderChapter(pid, cid, dir){
    const d = this.data(); const p = d.projects.find(x => x.id === pid); if(!p) return;
    p.chapters = (p.chapters||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const i = p.chapters.findIndex(c => c.id === cid); if(i<0) return;
    const j = i + dir; if(j < 0 || j >= p.chapters.length) return;
    [p.chapters[i], p.chapters[j]] = [p.chapters[j], p.chapters[i]];
    p.chapters.forEach((c, k) => c.order = k);
    this.saveData(d);
  },
  getSettings(){ const d = this.data(); return (d && d.settings) || { theme:'dark', font:'Noto Sans KR', writeFont:'Noto Serif KR', accent:'#7c5cff', autoAccent:true }; },
  saveSettings(s){ const d = this.data(); if(!d) return; d.settings = { ...d.settings, ...s }; this.saveData(d); },
  exportJSON(){
    const u = this.currentUser(); if(!u) return null;
    return JSON.stringify({ version:2, user:{ username:u.username, displayName:u.displayName }, data: this.data() }, null, 2);
  },
  importJSON(text){
    const o = JSON.parse(text); if(!o || !o.data) throw new Error('잘못된 백업 파일입니다.');
    const u = this.currentUser(); if(!u) throw new Error('로그인이 필요합니다.');
    const all = this._all(); all[u.id] = o.data; this._saveAll(all);
  },
  wipeMyData(){ const u = this.currentUser(); if(!u) return; const all = this._all(); delete all[u.id]; this._saveAll(all); this._initData(u.id); }
};
window.SF = SF;

/* ---------- Theme ---------- */
const THEME_PRESETS = {
  dark:     { primary:'#7c5cff', accent:'#ff7ab8' },
  light:    { primary:'#7c5cff', accent:'#ff7ab8' },
  sepia:    { primary:'#a05a2c', accent:'#c97e3a' },
  midnight: { primary:'#5cc8ff', accent:'#9c7bff' },
  forest:   { primary:'#5cc88e', accent:'#e0b54a' },
  rose:     { primary:'#ff6b9c', accent:'#ffb454' },
  ocean:    { primary:'#27c2c2', accent:'#ffae5c' },
  paper:    { primary:'#5b3a29', accent:'#a86f3c' },
  lavender: { primary:'#7c5cff', accent:'#ff7ab8' }
};
function applyTheme(){
  const s = SF.getSettings();
  const root = document.documentElement;
  root.setAttribute('data-theme', s.theme || 'dark');
  if(s.font) document.body.style.fontFamily = `'${s.font}', system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`;
  if(s.writeFont) root.style.setProperty('--font-write', `'${s.writeFont}', 'Noto Serif KR', serif`);
  if(s.autoAccent){
    root.style.removeProperty('--primary');
    root.style.removeProperty('--primary-hover');
    root.style.removeProperty('--accent');
  } else if(s.accent){
    root.style.setProperty('--primary', s.accent);
    root.style.setProperty('--primary-hover', s.accent);
  }
}

/* ---------- Markdown ---------- */
function renderMD(src){
  if(!src) return '';
  src = String(src).replace(/\r\n/g, '\n');
  const codes = [];
  src = src.replace(/```([\w-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codes.push(`<pre><code class="lang-${escapeHtml(lang)}">${escapeHtml(code)}</code></pre>`);
    return '\u0000C' + (codes.length-1) + '\u0000';
  });
  src = src.replace(/(^|\n)((?:\|.*\|\n)+)/g, (m, lead, block) => {
    const rows = block.trim().split('\n').map(r => r.trim());
    if(rows.length < 2 || !/^\|[\s:|-]+\|$/.test(rows[1])) return m;
    const head = rows[0].slice(1,-1).split('|').map(s=>s.trim());
    const body = rows.slice(2).map(r => r.slice(1,-1).split('|').map(s=>s.trim()));
    let out = '<table><thead><tr>' + head.map(h=>`<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>';
    body.forEach(r => { out += '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>'; });
    out += '</tbody></table>'; return lead + out;
  });
  const lines = src.split('\n');
  let out = '', inUl=false, inOl=false, inBq=false;
  function close(){ if(inUl){out+='</ul>';inUl=false;} if(inOl){out+='</ol>';inOl=false;} if(inBq){out+='</blockquote>';inBq=false;} }
  for(const line of lines){
    if(/^\s*<\/?(iframe|video|img|audio|div|details|summary|section|article|figure|figcaption|hr|br)/i.test(line)){ close(); out += line + '\n'; continue; }
    if(/^\s*$/.test(line)){ close(); continue; }
    let m;
    if(m = line.match(/^(#{1,6})\s+(.*)$/)){ close(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if(/^\s*([-*_])\1\1[\s\1]*$/.test(line)){ close(); out += '<hr>'; continue; }
    if(m = line.match(/^\s*[-*+]\s+(.*)$/)){ if(!inUl){close(); out+='<ul>'; inUl=true;} out += `<li>${inline(m[1])}</li>`; continue; }
    if(m = line.match(/^\s*\d+\.\s+(.*)$/)){ if(!inOl){close(); out+='<ol>'; inOl=true;} out += `<li>${inline(m[1])}</li>`; continue; }
    if(m = line.match(/^>\s?(.*)$/)){ if(!inBq){close(); out+='<blockquote>'; inBq=true;} out += inline(m[1]) + '<br>'; continue; }
    close(); out += `<p>${inline(line)}</p>`;
  }
  close();
  return out.replace(/\u0000C(\d+)\u0000/g, (_, i) => codes[+i]);
}
function inline(s){
  if(!s) return '';
  s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${escapeHtml(c)}</code>`);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]+)")?\)/g, (_,a,u,t) =>
    `<img alt="${escapeAttr(a)}" src="${escapeAttr(u)}"${t?` title="${escapeAttr(t)}"`:''} loading="lazy">`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_,t,u) => `<a href="${escapeAttr(u)}" target="_blank" rel="noopener">${escapeHtml(t)}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s;
}

/* ---------- Router ---------- */
const routes = {};
function route(name, fn){ routes[name] = fn; }
function go(hash){ location.hash = hash; }
function parseHash(){
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  const [pathPart, queryPart] = h.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const params = {};
  if(queryPart) queryPart.split('&').forEach(p => { const [k,v] = p.split('='); params[k] = decodeURIComponent(v||''); });
  return { name: parts[0] || '', arg: parts[1] || '', params };
}
function render(){
  const r = parseHash();
  if(!SF.currentUser()){ routes['auth'](); return; }
  applyTheme();
  const fn = routes[r.name] || routes['dashboard'];
  fn(r);
}
window.addEventListener('hashchange', render);

/* ---------- Shell ---------- */
function shell(activeKey, title, actionsHtml, bodyHtml, pid){
  const u = SF.currentUser();
  const isProjScope = ['project','character','relations','tree','world','timeline','items','gallery','editor','manuscript'].includes(activeKey);
  pid = pid || (isProjScope ? '' : '');
  const projLink = pid ? '/' + pid : '';
  function nav(key, hash, icon, label, kbd){
    return `<a class="${activeKey===key?'active':''}" data-go="${hash}">${icon} ${label}${kbd?` <span class="spacer"></span><span class="kbd">${kbd}</span>`:''}</a>`;
  }
  const sidebarNav = `
    ${nav('dashboard', '/dashboard', '🏠', '대시보드')}
    <a data-act="search">🔍 빠른 검색 <span class="spacer"></span><span class="kbd">${navigator.platform.match(/Mac/)?'⌘K':'Ctrl+K'}</span></a>
    ${pid ? `
      <div class="sb-section">현재 프로젝트</div>
      ${nav('project',     '/project'    + projLink, '📖', '프로젝트 홈')}
      ${nav('manuscript',  '/manuscript' + projLink, '📜', '원고 / 챕터')}
      ${nav('character',   '/character'  + projLink, '👥', '등장인물')}
      ${nav('relations',   '/relations'  + projLink, '💞', '관계 그래프')}
      ${nav('tree',        '/tree'       + projLink, '🌳', '가계도/조직도')}
      ${nav('world',       '/world'      + projLink, '🌍', '세계관')}
      ${nav('timeline',    '/timeline'   + projLink, '⏳', '타임라인')}
      ${nav('items',       '/items'      + projLink, '⚔️', '아이템 도감')}
      ${nav('gallery',     '/gallery'    + projLink, '🖼️', '영감 보드')}
      ${nav('editor',      '/editor'     + projLink, '📝', '문서 / 에디터')}
    ` : ''}
    <div class="sb-section">계정</div>
    ${nav('settings', '/settings', '⚙️', '설정 / 백업')}
    <a id="sf-logout">🚪 로그아웃</a>`;

  document.getElementById('app').innerHTML = `
    <div class="app">
      <aside class="sidebar" id="sf-sidebar">
        <h2>📚 StoryForge</h2>
        <div class="who">${escapeHtml(u.displayName)}</div>
        <nav>${sidebarNav}</nav>
      </aside>
      <main class="main">
        <button class="menu-btn" id="sf-menu" type="button">☰</button>
        <div class="topbar">
          <h1>${title}</h1>
          <div class="actions">${actionsHtml||''}</div>
        </div>
        ${bodyHtml}
      </main>
    </div>`;

  const sidebar = document.getElementById('sf-sidebar');
  const scrim   = document.getElementById('scrim');
  const close = () => { sidebar.classList.remove('open'); scrim.classList.remove('open'); };
  document.getElementById('sf-menu').addEventListener('click', () => {
    sidebar.classList.add('open'); scrim.classList.add('open');
  });
  scrim.addEventListener('click', close);
  $$('nav a', sidebar).forEach(a => a.addEventListener('click', close));
  $$('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go('#' + a.dataset.go); }));
  $$('[data-act="search"]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); openSearch(); }));
  document.getElementById('sf-logout').addEventListener('click', () => {
    if(!confirm('로그아웃 할까요?')) return;
    SF.logout(); location.hash = '#/'; render();
  });
}

});

/* ---------- View: Dashboard ---------- */
route('dashboard', function(){
  const list = SF.getProjects();
  const totalWords = list.reduce((sum, p) => sum + (p.chapters||[]).reduce((s,c)=>s+countText(c.body).chars,0), 0);
  const body = `
    <div class="card" style="display:flex;gap:24px;flex-wrap:wrap;align-items:center">
      <div><div class="muted" style="font-size:12px">프로젝트</div><b style="font-size:24px">${list.length}</b></div>
      <div><div class="muted" style="font-size:12px">총 인물</div><b style="font-size:24px">${list.reduce((s,p)=>s+(p.characters||[]).length,0)}</b></div>
      <div><div class="muted" style="font-size:12px">총 글자수 (원고)</div><b style="font-size:24px">${fmtNum(totalWords)}</b></div>
      <div class="spacer"></div>
      <button class="btn ghost" data-act="search" type="button">🔍 빠른 검색</button>
    </div>
    ${list.length
      ? `<div class="grid">${list.map(p => `
        <div class="thumb-card" data-go="/project/${p.id}">
          <div class="avatar" style="${p.cover?`background-image:url('${escapeAttr(p.cover)}')`:''}">${p.cover?'':'📖'}</div>
          <div class="info">
            <h4>${escapeHtml(p.title)}</h4>
            <div class="role">${escapeHtml(p.genre||'미지정')}</div>
            <div class="muted" style="font-size:12px;margin-top:4px">
              인물 ${(p.characters||[]).length} · 챕터 ${(p.chapters||[]).length} · ${fmtNum((p.chapters||[]).reduce((s,c)=>s+countText(c.body).chars,0))}자
            </div>
          </div>
        </div>`).join('')}</div>`
      : `<div class="empty"><div style="font-size:48px">📖</div>
        <h3>아직 프로젝트가 없어요</h3><p>오른쪽 위 <b>+ 새 프로젝트</b> 로 첫 작품을 만들어 보세요.</p></div>`
    }`;
  shell('dashboard', '내 프로젝트',
    `<button class="btn" id="newProjBtn" type="button">+ 새 프로젝트</button>`,
    body);

  $$('.thumb-card').forEach(el => el.addEventListener('click', () => go('#' + el.dataset.go)));
  $('#newProjBtn').addEventListener('click', () => openProjModal(null));
  $$('[data-act="search"]').forEach(b => b.addEventListener('click', openSearch));
});

function openProjModal(pid){
  const proj = pid ? SF.getProject(pid) : { title:'', genre:'', summary:'', cover:'' };
  const m = document.createElement('div');
  m.className = 'modal-bg open'; m.innerHTML = `
    <div class="modal">
      <header><h3>${pid?'프로젝트 정보':'새 프로젝트 만들기'}</h3><button class="close" data-x type="button">×</button></header>
      <form id="npf">
        <div class="field"><label>제목 *</label>
          <input id="npTitle" value="${escapeAttr(proj.title)}" required></div>
        <div class="field"><label>장르 (자유 입력)</label>
          <input id="npGenre" value="${escapeAttr(proj.genre)}" placeholder="예: 헌터물 / 능력물 / 로맨스 판타지..."></div>
        <div class="field"><label>한줄 소개</label>
          <textarea id="npSummary">${escapeHtml(proj.summary)}</textarea></div>
        <div class="field"><label>커버 이미지 URL (선택)</label>
          <input id="npCover" value="${escapeAttr(proj.cover)}" placeholder="https://..."></div>
        <div class="flex" style="justify-content:flex-end;gap:8px">
          <button class="btn ghost" type="button" data-x>취소</button>
          <button class="btn" type="submit">${pid?'저장':'만들기'}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  $$('[data-x]', m).forEach(b => b.addEventListener('click', close));
  m.addEventListener('click', e => { if(e.target === m) close(); });
  setTimeout(() => $('#npTitle', m).focus(), 30);
  $('#npf', m).addEventListener('submit', e => {
    e.preventDefault();
    const title = $('#npTitle', m).value.trim(); if(!title){ toast('제목을 입력하세요.', 'error'); return; }
    const data = { title, genre: $('#npGenre', m).value.trim(), summary: $('#npSummary', m).value.trim(), cover: $('#npCover', m).value.trim() };
    if(pid){ SF.updateProject(pid, data); close(); render(); toast('저장됨', 'success'); }
    else   { const np = SF.addProject(data); close(); go('#/project/' + np.id); }
  });
}

      <div>
        <div class="card">

            <div class="muted" style="font-size:12px">목표 진행률 ${fmtNum(totalChars)} / ${fmtNum(goal)}자 (${pct}%)</div>
            <div style="background:var(--bg-soft);height:10px;border-radius:999px;overflow:hidden;margin-top:6px">

            <button class="btn ghost" data-go="/manuscript/${proj.id}" type="button">📜 원고 쓰기 시작</button>
            <button class="btn ghost" data-go="/character/${proj.id}" type="button">👥 인물 추가</button>
            <button class="btn ghost" data-go="/world/${proj.id}" type="button">🌍 세계관 작성</button>

      </div>

  $('#saveProj').addEventListener('click', () => {
    SF.updateProject(pid, {
      title: $('#pfTitle').value.trim() || proj.title,
      genre: $('#pfGenre').value.trim(),
      cover: $('#pfCover').value.trim(),
      summary: $('#pfSummary').value.trim(),
      goal: +$('#pfGoal').value || 0

});

route('manuscript', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  proj.chapters = proj.chapters || [];
  let activeId = r.params.c || (proj.chapters[0] && proj.chapters[0].id) || null;

  const body = `
    <div class="ms-grid">
      <div class="ms-list" id="msList"></div>
      <div class="ms-pane" id="msPane"></div>
    </div>`;
  shell('manuscript', '📜 원고 — ' + escapeHtml(proj.title),
    `<button class="btn ghost" id="msPrint" type="button">🖨️ 인쇄/PDF</button>
     <button class="btn ghost" id="msExport" type="button">⤓ 전체 내보내기</button>
     <button class="btn" id="msNew" type="button">+ 새 챕터</button>`, body, pid);

  function refreshList(){
    const list = (SF.getProject(pid).chapters||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const el = $('#msList');
    if(!list.length){
      el.innerHTML = `<div class="empty" style="padding:20px"><div style="font-size:36px">📜</div>
        <p>아직 챕터가 없어요.<br>오른쪽 위 <b>+ 새 챕터</b> 로 시작하세요.</p></div>`;
      return;
    }
    el.innerHTML = list.map((c, i) => {
      const cn = countText(c.body);
      const stat = c.status||'draft';
      const stLabel = stat==='editing'?'수정중':stat==='done'?'완료':'초안';
      return `
        <div class="chap ${c.id===activeId?'active':''}" data-id="${c.id}">
          <div class="ttl"><span>${i+1}. ${escapeHtml(c.title||'제목 없음')}</span></div>
          <div class="meta">
            <span class="ms-status status-${stat}">● ${stLabel}</span>
            <span>${fmtNum(cn.chars)}자</span>
          </div>
          <div class="chap-actions">
            <button data-a="up" title="위로">▲</button>
            <button data-a="dn" title="아래">▼</button>
            <button data-a="dup" title="복제">⎘</button>
            <button data-a="del" title="삭제">🗑</button>
          </div>
        </div>`;
    }).join('');
    $$('.chap', el).forEach(card => {
      const id = card.dataset.id;
      card.addEventListener('click', e => {
        if(e.target.closest('.chap-actions')) return;
        activeId = id; refreshList(); refreshPane();
      });
      $$('.chap-actions button', card).forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        const a = b.dataset.a;
        if(a==='up'){ SF.reorderChapter(pid, id, -1); refreshList(); }
        else if(a==='dn'){ SF.reorderChapter(pid, id, +1); refreshList(); }
        else if(a==='dup'){
          const src = SF.getProject(pid).chapters.find(c=>c.id===id);
          const nc = SF.addChapter(pid, { title:(src.title||'')+' (복제)' });
          SF.updateChapter(pid, nc.id, { synopsis:src.synopsis, body:src.body, status:src.status });
          activeId = nc.id; refreshList(); refreshPane();
        }
        else if(a==='del'){
          if(!confirm('이 챕터를 삭제할까요?')) return;
          SF.deleteChapter(pid, id);
          const left = SF.getProject(pid).chapters; activeId = left[0] && left[0].id || null;
          refreshList(); refreshPane();
        }
      }));
    });
  }

  function refreshPane(){
    const pane = $('#msPane');
    const ch = activeId && (SF.getProject(pid).chapters||[]).find(c=>c.id===activeId);
    if(!ch){
      pane.innerHTML = `<div class="card" style="text-align:center;padding:60px 20px;color:var(--text-dim)">
        <div style="font-size:36px">📜</div><p>왼쪽에서 챕터를 선택하거나 <b>+ 새 챕터</b> 로 시작하세요.</p></div>`;
      return;
    }
    pane.innerHTML = `
      <div class="ms-meta">
        <input id="chTitle" value="${escapeAttr(ch.title)}" placeholder="챕터 제목" style="font-size:16px;font-weight:600">
        <select id="chStatus" style="width:auto">
          <option value="draft">초안</option><option value="editing">수정중</option><option value="done">완료</option>
        </select>
        <span class="pill" id="saveInd">저장됨</span>
        <button class="btn ghost icon" id="chFocus" type="button" title="집중모드">🌙</button>
      </div>
      <div class="card" style="padding:14px;margin:0">
        <label style="margin-bottom:6px">개요 / 시놉시스</label>
        <textarea id="chSyn" rows="2" placeholder="이 챕터의 핵심 한두 줄 요약...">${escapeHtml(ch.synopsis||'')}</textarea>
      </div>
      <div class="ms-write">
        <textarea id="chBody" placeholder="여기에 본문을 쓰세요. 자동 저장됩니다.">${escapeHtml(ch.body||'')}</textarea>
        <div class="ms-stats" id="chStats"></div>
      </div>`;
    $('#chStatus').value = ch.status || 'draft';

    const updateStats = () => {
      const v = $('#chBody').value;
      const c = countText(v);
      const goal = SF.getProject(pid).goal || 0;
      const totalChars = (SF.getProject(pid).chapters||[]).reduce((s,x)=>s+(x.id===ch.id?c.chars:countText(x.body).chars),0);
      $('#chStats').innerHTML = `
        <span><b>${fmtNum(c.chars)}</b> 자</span>
        <span><b>${fmtNum(c.charsNoSpace)}</b> 자(공백 제외)</span>
        <span><b>${fmtNum(c.words)}</b> 어절</span>
        <span class="muted">|</span>
        <span>프로젝트 총 <b>${fmtNum(totalChars)}</b> 자${goal?` / ${fmtNum(goal)} (${Math.min(100,Math.round(totalChars/goal*100))}%)`:''}</span>`;
    };
    updateStats();

    const saveInd = $('#saveInd');
    const save = debounce(patch => {
      SF.updateChapter(pid, ch.id, patch);
      saveInd.textContent = '저장됨'; saveInd.style.opacity = '.5';
      const list = $('#msList'); if(list){
        const card = list.querySelector(`.chap[data-id="${ch.id}"]`);
        if(card){
          const cn = countText($('#chBody').value);
          card.querySelector('.meta span:last-child').textContent = fmtNum(cn.chars) + '자';
        }
      }
    }, 350);
    function dirty(patch){ saveInd.textContent = '저장 중...'; saveInd.style.opacity = '1'; save(patch); }

    $('#chTitle').addEventListener('input', e => {
      dirty({ title: e.target.value });
      const card = $('#msList').querySelector(`.chap[data-id="${ch.id}"] .ttl span`);
      if(card){
        const i = (SF.getProject(pid).chapters||[]).findIndex(x=>x.id===ch.id);
        card.textContent = (i+1) + '. ' + (e.target.value || '제목 없음');
      }
    });
    $('#chSyn').addEventListener('input', e => dirty({ synopsis: e.target.value }));
    $('#chBody').addEventListener('input', e => { dirty({ body: e.target.value }); updateStats(); });
    $('#chStatus').addEventListener('change', e => {
      dirty({ status: e.target.value });
      const cardSt = $('#msList').querySelector(`.chap[data-id="${ch.id}"] .ms-status`);
      if(cardSt){
        const v = e.target.value;
        cardSt.className = 'ms-status status-' + v;
        cardSt.textContent = '● ' + (v==='editing'?'수정중':v==='done'?'완료':'초안');
      }
    });
    $('#chFocus').addEventListener('click', toggleFocus);
    setTimeout(() => $('#chBody').focus(), 50);
  }

  $('#msNew').addEventListener('click', () => {
    const t = prompt('새 챕터 제목', (proj.chapters.length+1) + '화');
    if(t === null) return;
    const ch = SF.addChapter(pid, { title: t || '제목 없음' });
    activeId = ch.id; refreshList(); refreshPane();
    toast('챕터 추가됨', 'success');
  });
  $('#msPrint').addEventListener('click', () => {
    const chs = (SF.getProject(pid).chapters||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const w = window.open('', '_blank');
    if(!w){ toast('팝업 차단을 해제해 주세요.', 'error'); return; }
    w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${escapeHtml(proj.title)}</title>
      <style>body{font-family:'Noto Serif KR',serif;max-width:720px;margin:40px auto;padding:0 20px;color:#222;line-height:1.85;font-size:13pt}
      h1{font-size:24pt;text-align:center;margin-bottom:8px}.author{text-align:center;color:#888;margin-bottom:40px}
      h2{margin-top:40px;border-bottom:1px solid #ddd;padding-bottom:8px}
      .body{white-space:pre-wrap}@media print{.noprint{display:none}}</style></head><body>
      <h1>${escapeHtml(proj.title)}</h1>
      <div class="author">${escapeHtml(SF.currentUser().displayName)}</div>
      <button class="noprint" onclick="window.print()" style="margin-bottom:30px;padding:10px 20px;cursor:pointer">🖨️ 인쇄 / PDF로 저장</button>
      ${chs.map((c,i)=>`<section class="print-chap"><h2>${i+1}. ${escapeHtml(c.title||'제목 없음')}</h2>
        ${c.synopsis?`<p style="color:#666;font-style:italic">${escapeHtml(c.synopsis)}</p>`:''}
        <div class="body">${escapeHtml(c.body||'')}</div></section>`).join('')}
      </body></html>`);
    w.document.close();
  });
  $('#msExport').addEventListener('click', () => {
    const chs = (SF.getProject(pid).chapters||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const fmt = prompt('형식? (txt / md / html)', 'txt');
    if(!fmt) return;
    let out = '', mime = 'text/plain', ext = 'txt';
    if(fmt === 'md'){
      out = `# ${proj.title}\n\n` + chs.map((c,i)=>`## ${i+1}. ${c.title||'제목 없음'}\n\n${c.synopsis?'> '+c.synopsis+'\n\n':''}${c.body||''}\n`).join('\n');
      mime = 'text/markdown'; ext = 'md';
    } else if(fmt === 'html'){
      out = `<!doctype html><meta charset="utf-8"><title>${escapeHtml(proj.title)}</title>`
          + `<h1>${escapeHtml(proj.title)}</h1>`
          + chs.map((c,i)=>`<h2>${i+1}. ${escapeHtml(c.title||'제목 없음')}</h2>`
              + (c.synopsis?`<p><i>${escapeHtml(c.synopsis)}</i></p>`:'')
              + `<pre style="white-space:pre-wrap;font-family:serif">${escapeHtml(c.body||'')}</pre>`).join('');
      mime = 'text/html'; ext = 'html';
    } else {
      out = `${proj.title}\n\n` + chs.map((c,i)=>`【${i+1}. ${c.title||'제목 없음'}】\n\n${c.body||''}\n`).join('\n----\n\n');
    }
    const blob = new Blob([out], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = proj.title.replace(/[^\w가-힣\- _.]/g,'_') + '.' + ext;
    a.click();
  });

  refreshList(); refreshPane();
});

route('character', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  const body = `
    <div class="flex" style="margin-bottom:12px;gap:8px">
      <input id="csearch" placeholder="검색..." style="max-width:240px">
    </div>
    <div id="charList" class="grid"></div>`;
  shell('character', '👥 등장인물',
    `<button class="btn" id="newBtn" type="button">+ 새 인물</button>`, body, pid);

  function refresh(){
    const q = $('#csearch').value.trim().toLowerCase();
    const list = (SF.getProject(pid).characters || []).filter(c => {
      if(!q) return true;
      return [c.name,c.role,c.tagline,...(c.tags||[])].join(' ').toLowerCase().includes(q);
    });
    const w = $('#charList');
    if(!list.length){
      w.innerHTML = `<div class="empty" style="grid-column:1/-1"><div style="font-size:48px">👥</div>
        <h3>등장인물이 없어요</h3><p><b>+ 새 인물</b> 로 첫 캐릭터를 추가하세요.</p></div>`;
      return;
    }
    w.innerHTML = list.map(c => `
      <div class="thumb-card" data-id="${c.id}">
        <div class="avatar" style="${c.avatar?`background-image:url('${escapeAttr(c.avatar)}')`:''}">${c.avatar?'':'👤'}</div>
        <div class="info">
          <h4>${escapeHtml(c.name)}</h4>
          <div class="role">${escapeHtml(c.role||'')} ${c.age?'· '+escapeHtml(c.age):''}</div>
          ${c.tagline?`<div class="muted" style="margin-top:4px">${escapeHtml(c.tagline)}</div>`:''}
          <div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        </div>
      </div>`).join('');
    $$('.thumb-card', w).forEach(el => el.addEventListener('click', () => openCharModal(pid, el.dataset.id, refresh)));
  }
  $('#csearch').addEventListener('input', refresh);
  $('#newBtn').addEventListener('click', () => openCharModal(pid, null, refresh));
  refresh();
});

function openCharModal(pid, cid, onChange){
  const c = cid ? SF.getProject(pid).characters.find(x => x.id === cid) : {};
  const m = document.createElement('div');
  m.className = 'modal-bg open'; m.innerHTML = `
    <div class="modal lg">
      <header><h3>${cid?'인물 편집 · '+escapeHtml(c.name||''):'새 인물'}</h3><button class="close" data-x type="button">×</button></header>
      <form id="cf">
        <div class="row">
          <div>
            <div class="field"><label>이미지 (선택)</label>
              <input id="cAvatarFile" type="file" accept="image/*">
              <input id="cAvatar" placeholder="또는 이미지 URL" value="${escapeAttr(c.avatar||'')}" style="margin-top:6px"></div>

  document.body.appendChild(m);

route('relations', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  proj.relations = proj.relations || []; proj.relPositions = proj.relPositions || {};

  const body = `
    <p class="muted">등장인물 페이지에서 만든 인물들 사이의 관계(연인·라이벌·동료·멘토 등)를 자유롭게 연결하세요. 노드를 드래그해 위치를 옮길 수 있어요.</p>
    <div class="tree-canvas" id="canvas"><svg class="tree-svg" id="svg"></svg></div>`;
  shell('relations', '💞 인물 관계 그래프', `
    <button class="btn ghost" id="autoArr" type="button">⟳ 자동 배치</button>
    <button class="btn" id="addRel" type="button">+ 관계 추가</button>`, body, pid);

  const canvas = $('#canvas'), svg = $('#svg');
  function save(){ SF.updateProject(pid, { relations: proj.relations, relPositions: proj.relPositions }); }

  function autoArr(){
    const chars = proj.characters || []; const n = chars.length; if(!n) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const cx = w/2, cy = h/2, rd = Math.min(w,h)/2 - 80;
    chars.forEach((c, i) => {
      const a = (i/n) * Math.PI * 2 - Math.PI/2;
      proj.relPositions[c.id] = { x: cx + rd*Math.cos(a) - 60, y: cy + rd*Math.sin(a) - 18 };
    });
    save(); draw();
  }

  function draw(){
    $$('.node', canvas).forEach(n => n.remove());
    const chars = proj.characters || [];
    if(!chars.length){
      const e = document.createElement('div');
      e.style.padding = '20px'; e.style.color = 'var(--text-dim)';
      e.textContent = '먼저 [등장인물]에서 인물을 추가하세요.';
      canvas.appendChild(e); return;
    }
    chars.forEach((c, i) => {
      if(!proj.relPositions[c.id]) proj.relPositions[c.id] = { x: 40 + (i%6)*160, y: 40 + Math.floor(i/6)*100 };
    });
    chars.forEach(c => {
      const pos = proj.relPositions[c.id];
      const el = document.createElement('div');
      el.className = 'node'; el.style.left = pos.x+'px'; el.style.top = pos.y+'px';
      el.innerHTML = `<div>${escapeHtml(c.name)}</div>${c.role?`<small>${escapeHtml(c.role)}</small>`:''}`;
      canvas.appendChild(el);
      drag(el, pos);
    });
    drawEdges();
  }

  function drawEdges(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('width', w); svg.setAttribute('height', h);
    let html = '';
    proj.relations.forEach(r2 => {
      const a = proj.relPositions[r2.from], b = proj.relPositions[r2.to];
      if(!a || !b) return;
      const ax = a.x+60, ay = a.y+18, bx = b.x+60, by = b.y+18;
      const color = r2.color || '#7c5cff';
      html += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${color}" stroke-width="2" opacity=".75" data-rid="${r2.id}" style="cursor:pointer;pointer-events:stroke"/>`;
      if(r2.label) html += `<text x="${(ax+bx)/2}" y="${(ay+by)/2-4}" fill="${color}" font-size="12" text-anchor="middle" data-rid="${r2.id}" style="cursor:pointer;pointer-events:auto">${escapeHtml(r2.label)}</text>`;
    });
    svg.innerHTML = html; svg.style.pointerEvents = 'auto';
    $$('[data-rid]', svg).forEach(el => el.addEventListener('click', () => openRelModal(el.getAttribute('data-rid'))));
  }

  function drag(el, pos){
    let sx,sy,ox,oy;
    const start = (cx, cy) => {
      sx=cx; sy=cy; ox=pos.x; oy=pos.y;
      el.classList.add('dragging');
    };
    const move = (cx, cy) => {
      pos.x = Math.max(0, Math.min(canvas.clientWidth-130, ox + (cx - sx)));
      pos.y = Math.max(0, Math.min(canvas.clientHeight-50,  oy + (cy - sy)));
      el.style.left = pos.x+'px'; el.style.top = pos.y+'px'; drawEdges();
    };
    const end = () => { el.classList.remove('dragging'); save(); };
    el.addEventListener('mousedown', e => {
      if(e.button !== 0) return; e.preventDefault(); start(e.clientX, e.clientY);
      const mm = ev => move(ev.clientX, ev.clientY);
      const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); end(); };
      document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', e => {
      const t = e.touches[0]; start(t.clientX, t.clientY);
      const tm = ev => { ev.preventDefault(); const t2 = ev.touches[0]; move(t2.clientX, t2.clientY); };
      const te = () => { document.removeEventListener('touchmove', tm); document.removeEventListener('touchend', te); end(); };
      document.addEventListener('touchmove', tm, { passive:false }); document.addEventListener('touchend', te);
    }, { passive:true });
  }

  function openRelModal(rid){
    const chars = proj.characters || [];
    if(!chars.length){ toast('먼저 인물을 만들어 주세요.', 'warn'); return; }
    const r2 = rid ? proj.relations.find(x => x.id === rid) : {};
    const opts = chars.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    const m = document.createElement('div');
    m.className = 'modal-bg open'; m.innerHTML = `
      <div class="modal">
        <header><h3>${rid?'관계 편집':'관계 추가'}</h3><button class="close" data-x type="button">×</button></header>
        <form id="rf">
          <div class="row">
            <div class="field"><label>인물 A</label><select id="rFrom">${opts}</select></div>
            <div class="field"><label>인물 B</label><select id="rTo">${opts}</select></div>
          </div>
          <div class="row">
            <div class="field"><label>관계 라벨</label>
              <input id="rLabel" value="${escapeAttr(r2.label||'')}" placeholder="예: 연인 / 라이벌 / 멘토 / 형제"></div>
            <div class="field"><label>선 색상</label>
              <input id="rColor" type="color" value="${r2.color||'#7c5cff'}"></div>
          </div>
          <div class="flex" style="justify-content:space-between">
            <button class="btn danger" id="rDel" type="button" style="${rid?'':'display:none'}">삭제</button>
            <div class="flex" style="gap:8px"><button class="btn ghost" type="button" data-x>취소</button>
            <button class="btn" type="submit">저장</button></div>
          </div>
        </form>
      </div>`;
    document.body.appendChild(m);
    $('#rFrom', m).value = r2.from || chars[0].id;
    $('#rTo', m).value   = r2.to   || (chars[1]||chars[0]).id;
    const close = () => m.remove();
    $$('[data-x]', m).forEach(b => b.addEventListener('click', close));
    m.addEventListener('click', e => { if(e.target === m) close(); });
    $('#rf', m).addEventListener('submit', e => {
      e.preventDefault();
      const data = { from:$('#rFrom', m).value, to:$('#rTo', m).value, label:$('#rLabel', m).value.trim(), color:$('#rColor', m).value };
      if(data.from === data.to){ toast('서로 다른 인물을 선택하세요.', 'error'); return; }
      if(rid){ const i = proj.relations.findIndex(x => x.id === rid); proj.relations[i] = { ...proj.relations[i], ...data }; }
      else proj.relations.push({ id: uid('r_'), ...data });
      save(); close(); draw();
    });
    $('#rDel', m).addEventListener('click', () => {
      if(!rid) return; if(!confirm('이 관계를 삭제할까요?')) return;
      proj.relations = proj.relations.filter(x => x.id !== rid);
      save(); close(); draw();
    });
  }

  $('#addRel').addEventListener('click', () => openRelModal(null));
  $('#autoArr').addEventListener('click', autoArr);
  window.addEventListener('resize', drawEdges);
  draw();
});

route('tree', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  const tree = proj.tree || (proj.tree = { nodes:[], edges:[] });
  let linkMode = false, pending = null;

  const body = `
    <p class="muted">노드를 드래그해 위치를 옮기고, [연결 모드] 를 켠 뒤 두 노드를 차례로 클릭하면 선이 그려집니다.<br>
    노드 더블클릭=편집, 우클릭=삭제.</p>
    <div class="tree-canvas" id="canvas"><svg class="tree-svg" id="svg"></svg></div>`;
  shell('tree', '🌳 가계도 / 조직도', `
    <select id="typeSel" style="width:auto">
      <option value="가족">가족</option><option value="조직">조직 / 직급</option>
      <option value="능력">능력 트리</option><option value="기타">기타</option>
    </select>
    <button class="btn" id="addNode" type="button">+ 노드</button>
    <button class="btn ghost" id="linkBtn" type="button">🔗 연결: OFF</button>
    <button class="btn danger" id="clearAll" type="button">전체 삭제</button>`, body, pid);

  const canvas = $('#canvas'), svg = $('#svg');
  function save(){ SF.updateProject(pid, { tree }); }

  function draw(){
    $$('.node', canvas).forEach(n => n.remove());
    tree.nodes.forEach(n => {
      const el = document.createElement('div');
      el.className = 'node'; el.style.left = n.x+'px'; el.style.top = n.y+'px';
      el.dataset.type = n.type || '기타';
      el.innerHTML = `<div>${escapeHtml(n.label)}</div>${n.sub?`<small>${escapeHtml(n.sub)}</small>`:''}`;
      canvas.appendChild(el);
      drag(el, n);
      el.addEventListener('click', e => {
        e.stopPropagation(); if(!linkMode) return;
        if(!pending){ pending = n.id; el.classList.add('selected'); return; }
        if(pending === n.id){ pending = null; el.classList.remove('selected'); return; }
        const label = prompt('관계 라벨 (예: 부모, 부하, 멘토)', '') || '';
        tree.edges.push({ id: uid('e_'), from: pending, to: n.id, label });
        $$('.node.selected', canvas).forEach(s => s.classList.remove('selected'));
        pending = null; save(); drawEdges();
      });
      el.addEventListener('dblclick', e => {
        e.stopPropagation();
        const lab = prompt('이름', n.label); if(lab === null) return;
        const sub = prompt('부가설명', n.sub||'') || '';
        n.label = lab || n.label; n.sub = sub; save(); draw();
      });
      el.addEventListener('contextmenu', e => {
        e.preventDefault();
        if(!confirm('이 노드를 삭제할까요?')) return;
        tree.nodes = tree.nodes.filter(x => x.id !== n.id);
        tree.edges = tree.edges.filter(x => x.from !== n.id && x.to !== n.id);
        save(); draw();
      });
    });
    drawEdges();
  }

  function drawEdges(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('width', w); svg.setAttribute('height', h);
    let html = '';
    tree.edges.forEach(e => {
      const a = tree.nodes.find(n => n.id === e.from); const b = tree.nodes.find(n => n.id === e.to);
      if(!a || !b) return;
      const ax = a.x+60, ay = a.y+18, bx = b.x+60, by = b.y+18;
      html += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="currentColor" stroke-width="2" opacity=".75"/>`;
      if(e.label) html += `<text x="${(ax+bx)/2}" y="${(ay+by)/2-4}" fill="currentColor" font-size="11" text-anchor="middle">${escapeHtml(e.label)}</text>`;
    });
    svg.innerHTML = html;
  }

  function drag(el, n){
    let sx,sy,ox,oy;
    const start = (cx,cy) => { sx=cx; sy=cy; ox=n.x; oy=n.y; el.classList.add('dragging'); };
    const move  = (cx,cy) => {
      n.x = Math.max(0, Math.min(canvas.clientWidth-130, ox + (cx - sx)));
      n.y = Math.max(0, Math.min(canvas.clientHeight-50,  oy + (cy - sy)));
      el.style.left = n.x+'px'; el.style.top = n.y+'px'; drawEdges();
    };
    const end = () => { el.classList.remove('dragging'); save(); };
    el.addEventListener('mousedown', e => {
      if(e.button !== 0 || linkMode) return; e.preventDefault();
      start(e.clientX, e.clientY);
      const mm = ev => move(ev.clientX, ev.clientY);
      const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); end(); };
      document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', e => {
      if(linkMode) return;
      const t = e.touches[0]; start(t.clientX, t.clientY);
      const tm = ev => { ev.preventDefault(); const t2 = ev.touches[0]; move(t2.clientX, t2.clientY); };
      const te = () => { document.removeEventListener('touchmove', tm); document.removeEventListener('touchend', te); end(); };
      document.addEventListener('touchmove', tm, { passive:false }); document.addEventListener('touchend', te);
    }, { passive:true });
  }

  $('#addNode').addEventListener('click', () => {
    const type = $('#typeSel').value;
    const label = prompt(`${type} 노드 이름`, ''); if(!label) return;
    const sub = prompt('부가설명 (선택)', '') || '';
    tree.nodes.push({ id: uid('n_'), label, sub, type, x: 40 + Math.random()*200, y: 40 + Math.random()*200 });
    save(); draw();
  });
  $('#linkBtn').addEventListener('click', () => {
    linkMode = !linkMode;
    $('#linkBtn').textContent = '🔗 연결: ' + (linkMode ? 'ON' : 'OFF');
    pending = null; $$('.node.selected', canvas).forEach(s => s.classList.remove('selected'));
  });
  $('#clearAll').addEventListener('click', () => {
    if(!confirm('모든 노드와 연결을 삭제할까요?')) return;
    tree.nodes = []; tree.edges = []; save(); draw();
  });
  window.addEventListener('resize', drawEdges);
  draw();
});

route('world', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  const world = proj.world || (proj.world = { sections: [] });
  const body = `
    <p class="muted">지역, 종족, 마법 체계, 길드, 헌터협회, 계급, 유물 등 자유롭게 항목을 만들 수 있어요. (마크다운/HTML)</p>
    <div id="sections"></div>`;
  shell('world', '🌍 세계관 설정', `<button class="btn" id="addSec" type="button">+ 항목 추가</button>`, body, pid);

  function save(){ SF.updateProject(pid, { world }); }
  function refresh(){
    const w = $('#sections');
    if(!world.sections.length){
      w.innerHTML = `<div class="empty"><div style="font-size:48px">🌍</div><h3>세계관 항목이 없어요</h3></div>`;
      return;
    }
    w.innerHTML = world.sections.map((s, i) => `
      <div class="card" data-i="${i}">
        <div class="flex between" style="margin-bottom:8px">
          <input class="t" value="${escapeAttr(s.title)}" style="flex:1;font-size:16px;font-weight:600;background:transparent;border:none">
          <div class="flex" style="gap:6px">
            <button class="btn sm ghost" data-up type="button">▲</button>
            <button class="btn sm ghost" data-dn type="button">▼</button>
            <button class="btn sm danger" data-del type="button">삭제</button>
          </div>
        </div>
        <textarea class="b" rows="6" placeholder="자유 서술 (마크다운/HTML)">${escapeHtml(s.body||'')}</textarea>
      </div>`).join('');
    $$('.card', w).forEach(card => {
      const i = +card.dataset.i;
      $('.t', card).addEventListener('input', e => { world.sections[i].title = e.target.value; save(); });
      $('.b', card).addEventListener('input', e => { world.sections[i].body  = e.target.value; save(); });
      $('[data-del]', card).addEventListener('click', () => { if(confirm('삭제할까요?')){ world.sections.splice(i,1); save(); refresh(); }});
      $('[data-up]', card).addEventListener('click', () => { if(i>0){ [world.sections[i-1],world.sections[i]] = [world.sections[i],world.sections[i-1]]; save(); refresh(); }});
      $('[data-dn]', card).addEventListener('click', () => { if(i<world.sections.length-1){ [world.sections[i+1],world.sections[i]] = [world.sections[i],world.sections[i+1]]; save(); refresh(); }});
    });
  }
  $('#addSec').addEventListener('click', () => {
    const t = prompt('항목 제목 (예: 헌터 등급, 마탑, 길드, 종족...)', ''); if(!t) return;
    world.sections.push({ title: t, body: '' }); save(); refresh();
  });
  refresh();
});

/* ---------- View: Timeline ---------- */
route('timeline', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  const tl = proj.timeline || (proj.timeline = []);
  const body = `<div class="card"><div class="timeline" id="tl"></div></div>`;
  shell('timeline', '⏳ 타임라인', `<button class="btn" id="addEv" type="button">+ 사건 추가</button>`, body, pid);

  function save(){ SF.updateProject(pid, { timeline: tl }); }
  function refresh(){
    const sorted = [...tl].sort((a,b) => (a.order||0) - (b.order||0));

        <h4>${escapeHtml(e.name)}</h4>
        <div>${renderMD(e.body||'')}</div>
      </div>`).join('');
    $$('.tl-item', w).forEach(el => el.addEventListener('click', () => openEv(el.dataset.id)));
  }
  function openEv(id){
    const e = id ? tl.find(x => x.id === id) : { order: tl.length };
    const m = document.createElement('div');
    m.className = 'modal-bg open'; m.innerHTML = `
      <div class="modal">
        <header><h3>${id?'사건 편집':'새 사건'}</h3><button class="close" data-x type="button">×</button></header>

          <div class="field"><label>제목 *</label><input id="evName" value="${escapeAttr(e.name||'')}" required></div>
          <div class="field"><label>내용 (마크다운/HTML)</label><textarea id="evBody" rows="6">${escapeHtml(e.body||'')}</textarea></div>
          <div class="flex" style="justify-content:space-between">
            <button class="btn danger" id="evDel" type="button" style="${id?'':'display:none'}">삭제</button>
            <div class="flex" style="gap:8px"><button class="btn ghost" type="button" data-x>취소</button>
            <button class="btn" type="submit">저장</button></div>
          </div>
        </form>
      </div>`;
    document.body.appendChild(m);
    const close = () => m.remove();
    $$('[data-x]', m).forEach(b => b.addEventListener('click', close));
    m.addEventListener('click', e2 => { if(e2.target === m) close(); });
    setTimeout(() => $('#evName', m).focus(), 30);
    $('#ef', m).addEventListener('submit', ev => {
      ev.preventDefault();
      const name = $('#evName', m).value.trim(); if(!name){ toast('제목 필수', 'error'); return; }
      const data = { name, when:$('#evWhen', m).value.trim(), order:+$('#evOrder', m).value||0, body:$('#evBody', m).value };
      if(id){ const i = tl.findIndex(x => x.id === id); tl[i] = { ...tl[i], ...data }; }
      else tl.push({ id: uid('e_'), ...data });
      save(); close(); refresh();
    });
    $('#evDel', m).addEventListener('click', () => {
      if(!confirm('삭제할까요?')) return;
      const i = tl.findIndex(x => x.id === id); tl.splice(i,1); save(); close(); refresh();
    });
  }
  $('#addEv').addEventListener('click', () => openEv(null));
  refresh();
});

route('items', function(r){

  const body = `
    <div class="flex" style="margin-bottom:12px;gap:8px;flex-wrap:wrap">

      <select id="itypeFilter" style="max-width:200px"><option value="">전체 종류</option></select>

  function save(){ SF.updateProject(pid, { items }); }
  function refreshFilter(){
    const types = Array.from(new Set(items.map(i => i.type).filter(Boolean)));
    $('#itypeFilter').innerHTML = '<option value="">전체 종류</option>' + types.map(t => `<option>${escapeHtml(t)}</option>`).join('');
  }
  function refresh(){
    refreshFilter();
    const q = $('#isearch').value.trim().toLowerCase();
    const f = $('#itypeFilter').value;
    const list = items.filter(i => {
      if(f && i.type !== f) return false;
      if(!q) return true;
      return [i.name,i.type,i.rarity,...(i.tags||[])].join(' ').toLowerCase().includes(q);
    });
    const w = $('#ilist');

      w.innerHTML = `<div class="empty" style="grid-column:1/-1"><div style="font-size:48px">⚔️</div>

        <div class="info">
          <h4>${escapeHtml(i.name)}</h4>
          <div class="role">${escapeHtml(i.type||'')} ${i.rarity?'· '+escapeHtml(i.rarity):''}</div>
          <div class="tags">${(i.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        </div>

  }
  function openItem(id){
    const i = id ? items.find(x => x.id === id) : {};
    const m = document.createElement('div');
    m.className = 'modal-bg open'; m.innerHTML = `
      <div class="modal">
        <header><h3>${id?'아이템 편집':'새 아이템'}</h3><button class="close" data-x type="button">×</button></header>
        <form id="if">

            <div class="field"><label>종류</label><input id="iType" value="${escapeAttr(i.type||'')}" placeholder="예: 무기 / 스킬 / 유물"></div>
          </div>
          <div class="row">

          </div>
          <div class="field"><label>설명 (마크다운/HTML)</label><textarea id="iDesc" rows="6">${escapeHtml(i.desc||'')}</textarea></div>
          <div class="field"><label>태그 (쉼표)</label><input id="iTags" value="${escapeAttr((i.tags||[]).join(', '))}"></div>
          <div class="flex" style="justify-content:space-between">
            <button class="btn danger" id="iDel" type="button" style="${id?'':'display:none'}">삭제</button>
            <div class="flex" style="gap:8px"><button class="btn ghost" type="button" data-x>취소</button>
            <button class="btn" type="submit">저장</button></div>
          </div>
        </form>
      </div>`;
    document.body.appendChild(m);
    const close = () => m.remove();
    $$('[data-x]', m).forEach(b => b.addEventListener('click', close));
    m.addEventListener('click', e => { if(e.target === m) close(); });
    setTimeout(() => $('#iName', m).focus(), 30);
    $('#if', m).addEventListener('submit', e => {
      e.preventDefault();
      const name = $('#iName', m).value.trim(); if(!name){ toast('이름 필수', 'error'); return; }
      const data = {
        name, type:$('#iType', m).value.trim(), rarity:$('#iRarity', m).value.trim(),
        image:$('#iImage', m).value.trim(), desc:$('#iDesc', m).value,
        tags:$('#iTags', m).value.split(',').map(s => s.trim()).filter(Boolean)
      };
      if(id){ const idx = items.findIndex(x => x.id === id); items[idx] = { ...items[idx], ...data }; }
      else items.push({ id: uid('i_'), ...data });
      save(); close(); refresh();
    });
    $('#iDel', m).addEventListener('click', () => {
      if(!confirm('삭제할까요?')) return;
      const idx = items.findIndex(x => x.id === id); items.splice(idx,1); save(); close(); refresh();
    });
  }
  $('#newBtn').addEventListener('click', () => openItem(null));

  refresh();
});

route('gallery', function(r){
  const pid = r.arg; const proj = SF.getProject(pid);
  if(!proj){ go('#/dashboard'); return; }
  const gal = proj.gallery || (proj.gallery = []);
  const body = `
    <p class="muted">참고 이미지 / 무드보드 / 장면 스케치 등을 모아 두는 공간이에요. 카드를 클릭하면 캡션을 편집할 수 있습니다.</p>
    <div id="grid" class="grid compact"></div>`;
  shell('gallery', '🖼️ 영감 보드', `
    <input id="addUrl" placeholder="이미지 URL" style="min-width:220px;width:auto">
    <button class="btn" id="addUrlBtn" type="button">URL 추가</button>
    <input id="addFile" type="file" accept="image/*" multiple style="display:none">
    <button class="btn ghost" id="pickFile" type="button">파일 업로드</button>`, body, pid);

  function save(){ SF.updateProject(pid, { gallery: gal }); }
  function refresh(){
    const w = $('#grid');
    if(!gal.length){
      w.innerHTML = `<div class="empty" style="grid-column:1/-1"><div style="font-size:48px">🖼️</div>
        <h3>이미지가 없어요</h3><p>URL 을 붙여넣거나 파일을 업로드하세요.</p></div>`; return;
    }
    w.innerHTML = gal.map(g => `
      <div class="thumb-card" data-id="${g.id}">
        <div class="avatar" style="background-image:url('${escapeAttr(g.src)}')"></div>
        <div class="info"><div class="muted" style="font-size:12px">${escapeHtml(g.caption||'클릭하여 캡션')}</div></div>
      </div>`).join('');
    $$('.thumb-card', w).forEach(el => el.addEventListener('click', () => {
      const g = gal.find(x => x.id === el.dataset.id);
      const cap = prompt('캡션 (취소: 무변경 / 빈 값 + 확인: 삭제)', g.caption||'');
      if(cap === null) return;
      if(cap === '' && confirm('이 이미지를 삭제할까요?')){ const i = gal.findIndex(x => x.id === g.id); gal.splice(i,1); }
      else g.caption = cap;
      save(); refresh();
    }));
  }
  $('#addUrlBtn').addEventListener('click', () => {
    const u = $('#addUrl').value.trim(); if(!u) return;
    gal.push({ id: uid('g_'), src: u, caption: '' });
    $('#addUrl').value = ''; save(); refresh();
  });
  $('#pickFile').addEventListener('click', () => $('#addFile').click());
  $('#addFile').addEventListener('change', e => {
    const fs = Array.from(e.target.files||[]); let pending = fs.length; if(!pending) return;
    fs.forEach(f => {
      const r2 = new FileReader();
      r2.onload = () => { gal.push({ id: uid('g_'), src: r2.result, caption: f.name }); if(--pending === 0){ save(); refresh(); } };
      r2.readAsDataURL(f);
    });
  });
  refresh();
});
