<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>영감 보드 · StoryForge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Dodum&family=Gaegu&family=Nanum+Pen+Script&family=Nanum+Myeongjo&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <h1>🖼️ 영감 보드</h1>
  <div class="actions">
    <input id="addUrl" placeholder="이미지 URL 붙여넣기" style="min-width:240px">
    <button class="btn" id="addUrlBtn" type="button">URL 추가</button>
    <input id="addFile" type="file" accept="image/*" multiple style="display:none">
    <button class="btn ghost" id="pickFile" type="button">파일 업로드</button>
  </div>
</div>

<p class="muted">참고 이미지 / 무드보드 / 장면 스케치 등을 모아 두는 공간이에요. 카드를 클릭하면 캡션을 편집할 수 있습니다.</p>

<div id="grid" class="grid compact"></div>

<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script>
(function () {
  if (!mountApp('gallery')) return;
  const pid = getQuery('p');
  const proj = SF.getProject(pid);
  if (!proj) { location.href = 'dashboard.html'; return; }
  const gallery = proj.gallery || (proj.gallery = []);
  function save() { SF.updateProject(pid, { gallery }); }

  function render() {
    const wrap = $('#grid');
    if (!gallery.length) {
      wrap.innerHTML = `<div class="empty" style="grid-column:1/-1">
        <div style="font-size:48px">🖼️</div><h3>이미지가 없어요</h3>
        <p>URL 을 붙여넣거나 파일을 업로드하세요.</p></div>`;
      return;
    }
    wrap.innerHTML = gallery.map(g => `
      <div class="thumb-card" data-id="${g.id}">
        <div class="avatar" style="background-image:url('${escapeAttr(g.src)}')"></div>
        <div class="info">
          <div class="muted" style="font-size:12px;">${escapeHtml(g.caption || '클릭하여 캡션')}</div>
        </div>
      </div>`).join('');
    $$('.thumb-card').forEach(el => {
      el.addEventListener('click', () => {
        const g = gallery.find(x => x.id === el.dataset.id);
        const cap = prompt('캡션 (취소: 무변경 / 빈 값 + 확인: 삭제)', g.caption || '');
        if (cap === null) return;
        if (cap === '' && confirm('이 이미지를 삭제할까요?')) {
          const i = gallery.findIndex(x => x.id === g.id);
          gallery.splice(i, 1);
        } else {
          g.caption = cap;
        }
        save(); render();
      });
    });
  }
  render();

  $('#addUrlBtn').addEventListener('click', () => {
    const u = $('#addUrl').value.trim();
    if (!u) return;
    gallery.push({ id: SF._uid('g_'), src: u, caption: '' });
    $('#addUrl').value = ''; save(); render();
  });
  $('#pickFile').addEventListener('click', () => $('#addFile').click());
  $('#addFile').addEventListener('change', e => {
    const files = Array.from(e.target.files || []);
    let pending = files.length;
    if (!pending) return;
    files.forEach(f => {
      const r = new FileReader();
      r.onload = () => {
        gallery.push({ id: SF._uid('g_'), src: r.result, caption: f.name });
        if (--pending === 0) { save(); render(); }
      };
      r.readAsDataURL(f);
    });
  });
})();
</script>
</body>
</html>
