<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>세계관 · StoryForge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Dodum&family=Gaegu&family=Nanum+Pen+Script&family=Nanum+Myeongjo&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <h1>🌍 세계관 설정</h1>
  <div class="actions">
    <button class="btn" id="addSection" type="button">+ 항목 추가</button>
  </div>
</div>

<p class="muted">지역, 종족, 마법 체계, 길드, 헌터협회, 계급, 유물 등 자유롭게 항목을 만들 수 있어요. (마크다운/HTML)</p>

<div id="sections"></div>

<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script>
(function () {
  if (!mountApp('world')) return;
  const pid = getQuery('p');
  const proj = SF.getProject(pid);
  if (!proj) { location.href = 'dashboard.html'; return; }
  const world = proj.world || (proj.world = { sections: [] });

  function save() { SF.updateProject(pid, { world }); }

  function render() {
    const wrap = $('#sections');
    if (!world.sections.length) {
      wrap.innerHTML = `<div class="empty">
        <div style="font-size:48px">🌍</div>
        <h3>세계관 항목이 없어요</h3>
        <p><b>+ 항목 추가</b> 로 시작하세요.</p></div>`;
      return;
    }
    wrap.innerHTML = world.sections.map((s, i) => `
      <div class="card" data-i="${i}">
        <div class="flex between" style="margin-bottom:8px">
          <input class="t" value="${escapeAttr(s.title)}" style="flex:1; font-size:16px; font-weight:600; background:transparent; border:none;">
          <div class="flex" style="gap:6px;">
            <button class="btn sm ghost" data-up   type="button">▲</button>
            <button class="btn sm ghost" data-down type="button">▼</button>
            <button class="btn sm danger" data-del type="button">삭제</button>
          </div>
        </div>
        <textarea class="b" rows="6" placeholder="자유 서술 (마크다운/HTML)">${escapeHtml(s.body || '')}</textarea>
      </div>
    `).join('');
    $$('.card').forEach(card => {
      const i = +card.dataset.i;
      card.querySelector('.t').addEventListener('input', e => { world.sections[i].title = e.target.value; save(); });
      card.querySelector('.b').addEventListener('input', e => { world.sections[i].body  = e.target.value; save(); });
      card.querySelector('[data-del]').addEventListener('click', () => {
        if (!confirm('삭제할까요?')) return;
        world.sections.splice(i, 1); save(); render();
      });
      card.querySelector('[data-up]').addEventListener('click', () => {
        if (i === 0) return;
        [world.sections[i-1], world.sections[i]] = [world.sections[i], world.sections[i-1]];
        save(); render();
      });
      card.querySelector('[data-down]').addEventListener('click', () => {
        if (i === world.sections.length - 1) return;
        [world.sections[i+1], world.sections[i]] = [world.sections[i], world.sections[i+1]];
        save(); render();
      });
    });
  }

  $('#addSection').addEventListener('click', () => {
    const t = prompt('항목 제목 (예: 헌터 등급, 마탑, 길드, 종족...)', '');
    if (!t) return;
    world.sections.push({ title: t, body: '' });
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
