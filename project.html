<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프로젝트 · StoryForge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Dodum&family=Gaegu&family=Nanum+Pen+Script&family=Nanum+Myeongjo&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="head"></div>

<div class="row" style="grid-template-columns: 2fr 1fr;">
  <div>
    <div class="card">
      <h3>프로젝트 정보</h3>
      <div class="field"><label>제목</label><input id="pfTitle"></div>
      <div class="row">
        <div class="field"><label>장르</label><input id="pfGenre" placeholder="자유 입력"></div>
        <div class="field"><label>커버 이미지 URL</label><input id="pfCover"></div>
      </div>
      <div class="field"><label>한줄 소개</label><textarea id="pfSummary"></textarea></div>
      <div class="flex" style="justify-content:flex-end; gap:8px;">
        <button class="btn danger" id="delProj" type="button">프로젝트 삭제</button>
        <button class="btn" id="saveProj" type="button">저장</button>
      </div>
    </div>

    <div class="card">
      <h3>커스텀 장르 / 태그</h3>
      <p class="muted">자신만의 장르를 만들어 두면 인물·문서에 태그로 사용할 수 있어요.</p>
      <form id="genreForm" class="flex">
        <input id="newGenre" placeholder="예: 흑마법 학원물">
        <button class="btn" type="submit">추가</button>
      </form>
      <div id="genreTags" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h3>요약</h3>
      <div id="counters"></div>
    </div>
    <div class="card">
      <h3>빠른 이동</h3>
      <div class="flex col" style="gap:8px;">
        <a class="btn ghost" id="lkChar">👥 등장인물</a>
        <a class="btn ghost" id="lkRel">💞 관계 그래프</a>
        <a class="btn ghost" id="lkTree">🌳 가계도/조직도</a>
        <a class="btn ghost" id="lkWorld">🌍 세계관</a>
        <a class="btn ghost" id="lkTl">⏳ 타임라인</a>
        <a class="btn ghost" id="lkItems">⚔️ 아이템</a>
        <a class="btn ghost" id="lkGal">🖼️ 영감 보드</a>
        <a class="btn ghost" id="lkEd">📝 문서</a>
      </div>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script>
(function () {
  if (!mountApp('project')) return;
  const pid = getQuery('p');
  const proj = SF.getProject(pid);
  if (!proj) { location.href = 'dashboard.html'; return; }

  $('#head').innerHTML = `
    <div class="topbar"><h1>${escapeHtml(proj.title)}</h1>
      <div class="muted">${escapeHtml(proj.genre || '미지정')}</div></div>`;

  $('#pfTitle').value = proj.title;
  $('#pfGenre').value = proj.genre;
  $('#pfCover').value = proj.cover || '';
  $('#pfSummary').value = proj.summary || '';

  $('#saveProj').addEventListener('click', () => {
    SF.updateProject(pid, {
      title: $('#pfTitle').value.trim() || proj.title,
      genre: $('#pfGenre').value.trim(),
      cover: $('#pfCover').value.trim(),
      summary: $('#pfSummary').value.trim()
    });
    toast('저장되었습니다.', 'success');
    setTimeout(() => location.reload(), 350);
  });

  $('#delProj').addEventListener('click', () => {
    if (!confirm('정말 삭제할까요? 모든 인물·문서가 함께 사라집니다.')) return;
    SF.deleteProject(pid);
    location.href = 'dashboard.html';
  });

  function renderGenres() {
    const tags = (SF.getProject(pid).genres) || [];
    const wrap = $('#genreTags');
    wrap.innerHTML = tags.length
      ? tags.map(t => `<span class="tag primary">${escapeHtml(t)} <span class="x" data-t="${escapeAttr(t)}">✕</span></span>`).join('')
      : '<span class="muted">아직 없음</span>';
    $$('.tag .x', wrap).forEach(el => el.addEventListener('click', () => {
      const t = el.dataset.t;
      const cur = SF.getProject(pid);
      cur.genres = (cur.genres || []).filter(x => x !== t);
      SF.updateProject(pid, { genres: cur.genres });
      renderGenres();
    }));
  }
  renderGenres();
  $('#genreForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#newGenre').value.trim(); if (!v) return;
    const cur = SF.getProject(pid);
    cur.genres = Array.from(new Set([...(cur.genres || []), v]));
    SF.updateProject(pid, { genres: cur.genres });
    $('#newGenre').value = ''; renderGenres();
  });

  $('#counters').innerHTML = `
    <div>등장인물 <b>${(proj.characters || []).length}</b></div>
    <div>관계 <b>${(proj.relations || []).length}</b></div>
    <div>가계도 노드 <b>${(proj.tree && proj.tree.nodes || []).length}</b></div>
    <div>세계관 항목 <b>${(proj.world && proj.world.sections || []).length}</b></div>
    <div>타임라인 <b>${(proj.timeline || []).length}</b></div>
    <div>아이템 <b>${(proj.items || []).length}</b></div>
    <div>영감 이미지 <b>${(proj.gallery || []).length}</b></div>
    <div>문서 <b>${(proj.docs || []).length}</b></div>`;

  const map = { lkChar:'character', lkRel:'relations', lkTree:'family-tree',
                lkWorld:'world', lkTl:'timeline', lkItems:'items',
                lkGal:'gallery', lkEd:'editor' };
  Object.entries(map).forEach(([id, page]) => $('#' + id).href = page + '.html?p=' + encodeURIComponent(pid));
})();
</script>
</body>
</html>
