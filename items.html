<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>아이템 도감 · StoryForge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Dodum&family=Gaegu&family=Nanum+Pen+Script&family=Nanum+Myeongjo&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <h1>⚔️ 아이템 도감</h1>
  <div class="actions">
    <input id="search" placeholder="검색..." style="width:180px">
    <select id="typeFilter">
      <option value="">전체 종류</option>
    </select>
    <button class="btn" id="newBtn" type="button">+ 새 아이템</button>
  </div>
</div>

<div id="list" class="grid compact"></div>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true">
  <div class="modal">
    <header><h3 id="mTitle">아이템</h3><button class="close" data-close type="button">×</button></header>
    <form id="iForm">
      <div class="row">
        <div class="field"><label>이름 *</label><input id="iName" required></div>
        <div class="field"><label>종류</label>
          <input id="iType" placeholder="예: 무기 / 스킬 / 유물 / 아티팩트" list="typeList">
          <datalist id="typeList"></datalist>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>등급 / 희귀도</label>
          <input id="iRarity" placeholder="예: SSR / S+ / 전설"></div>
        <div class="field"><label>이미지 URL</label><input id="iImage"></div>
      </div>
      <div class="field"><label>설명 (마크다운/HTML)</label><textarea id="iDesc" rows="6"></textarea></div>
      <div class="field"><label>태그 (쉼표)</label><input id="iTags"></div>
      <div class="flex" style="justify-content:space-between">
        <button class="btn danger" id="iDelete" type="button" style="display:none">삭제</button>
        <div class="flex" style="gap:8px;">
          <button class="btn ghost" type="button" data-close>취소</button>
          <button class="btn" type="submit">저장</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script>
(function () {
  if (!mountApp('items')) return;
  const pid = getQuery('p');
  const proj = SF.getProject(pid);
  if (!proj) { location.href = 'dashboard.html'; return; }
  const items = proj.items || (proj.items = []);
  let editId = null;

  function save() { SF.updateProject(pid, { items }); }

  function refreshTypeFilter() {
    const types = Array.from(new Set(items.map(i => i.type).filter(Boolean)));
    $('#typeFilter').innerHTML = '<option value="">전체 종류</option>' +
      types.map(t => `<option>${escapeHtml(t)}</option>`).join('');
    $('#typeList').innerHTML = types.map(t => `<option value="${escapeAttr(t)}">`).join('');
  }

  function render() {
    refreshTypeFilter();
    const q = $('#search').value.trim().toLowerCase();
    const f = $('#typeFilter').value;
    const list = items.filter(i => {
      if (f && i.type !== f) return false;
      if (!q) return true;
      return [i.name, i.type, i.rarity, ...(i.tags || [])].join(' ').toLowerCase().includes(q);
    });
    const wrap = $('#list');
    if (!list.length) {
      wrap.innerHTML = `<div class="empty" style="grid-column:1/-1">
        <div style="font-size:48px">⚔️</div><h3>아이템이 없어요</h3>
        <p><b>+ 새 아이템</b> 으로 추가하세요.</p></div>`;
      return;
    }
    wrap.innerHTML = list.map(i => `
      <div class="thumb-card" data-id="${i.id}">
        <div class="avatar" style="${i.image ? `background-image:url('${escapeAttr(i.image)}')` : ''}">
          ${i.image ? '' : '⚔️'}
        </div>
        <div class="info">
          <h4>${escapeHtml(i.name)}</h4>
          <div class="role">${escapeHtml(i.type || '')} ${i.rarity ? '· ' + escapeHtml(i.rarity) : ''}</div>
          <div class="tags">${(i.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        </div>
      </div>`).join('');
    $$('.thumb-card').forEach(el => el.addEventListener('click', () => open(el.dataset.id)));
  }
  $('#search').addEventListener('input', render);
  $('#typeFilter').addEventListener('change', render);
  render();

  // Modal
  const modal = $('#modal');
  const close = () => modal.classList.remove('open');
  $$('[data-close]').forEach(b => b.addEventListener('click', close));
  modal.addEventListener('click', e => { if (e.target === modal) close(); });

  function open(id) {
    editId = id;
    const i = id ? items.find(x => x.id === id) : {};
    $('#mTitle').textContent = id ? '아이템 편집' : '새 아이템';
    $('#iName').value = i.name || '';
    $('#iType').value = i.type || '';
    $('#iRarity').value = i.rarity || '';
    $('#iImage').value = i.image || '';
    $('#iDesc').value = i.desc || '';
    $('#iTags').value = (i.tags || []).join(', ');
    $('#iDelete').style.display = id ? '' : 'none';
    modal.classList.add('open');
    setTimeout(() => $('#iName').focus(), 30);
  }
  $('#newBtn').addEventListener('click', () => open(null));

  $('#iForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#iName').value.trim();
    if (!name) { toast('이름 필수', 'error'); return; }
    const data = {
      name,
      type: $('#iType').value.trim(),
      rarity: $('#iRarity').value.trim(),
      image: $('#iImage').value.trim(),
      desc: $('#iDesc').value,
      tags: $('#iTags').value.split(',').map(s => s.trim()).filter(Boolean)
    };
    if (editId) {
      const idx = items.findIndex(x => x.id === editId);
      items[idx] = { ...items[idx], ...data };
    } else {
      items.push({ id: SF._uid('i_'), ...data });
    }
    save(); close(); render();
  });
  $('#iDelete').addEventListener('click', () => {
    if (!confirm('삭제할까요?')) return;
    const idx = items.findIndex(x => x.id === editId);
    items.splice(idx, 1); save(); close(); render();
  });
})();
</script>
</body>
</html>
