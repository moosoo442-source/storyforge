<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>등장인물 · StoryForge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Dodum&family=Gaegu&family=Nanum+Pen+Script&family=Nanum+Myeongjo&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <h1>👥 등장인물</h1>
  <div class="actions">
    <input id="search" placeholder="검색..." style="width:200px">
    <button class="btn" id="newBtn" type="button">+ 새 인물</button>
  </div>
</div>

<div id="charList" class="grid"></div>

<!-- 편집 모달 -->
<div class="modal-bg" id="charModal" role="dialog" aria-modal="true">
  <div class="modal lg">
    <header><h3 id="modalTitle">인물 편집</h3><button class="close" data-close type="button">×</button></header>

    <form id="charForm">
      <div class="row">
        <div>
          <div class="field">
            <label>이미지 (선택)</label>
            <input id="cAvatarFile" type="file" accept="image/*">
            <input id="cAvatar" placeholder="또는 이미지 URL" style="margin-top:6px">
          </div>
          <div id="avatarPreview" style="border-radius:8px; height:200px; background-size:cover; background-position:center; background-color:var(--bg-soft); display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:36px;">👤</div>
        </div>
        <div>
          <div class="field"><label>이름 *</label><input id="cName" required></div>
          <div class="row">
            <div class="field"><label>역할</label><input id="cRole" placeholder="주인공/조연/적대..."></div>
            <div class="field"><label>나이</label><input id="cAge"></div>
          </div>
          <div class="row">
            <div class="field"><label>성별</label><input id="cGender"></div>
            <div class="field"><label>직업/소속</label><input id="cJob"></div>
          </div>
          <div class="field"><label>한줄 소개</label><input id="cTagline"></div>
        </div>
      </div>

      <div class="field"><label>외모</label><textarea id="cAppearance"></textarea></div>
      <div class="field"><label>성격</label><textarea id="cPersonality"></textarea></div>
      <div class="field"><label>능력 / 스킬 / 특기</label><textarea id="cAbility"></textarea></div>
      <div class="field"><label>배경 / 과거사</label><textarea id="cBackground"></textarea></div>
      <div class="row">
        <div class="field"><label>좋아하는 것</label><input id="cLike"></div>
        <div class="field"><label>싫어하는 것</label><input id="cDislike"></div>
      </div>
      <div class="field"><label>태그 (쉼표로 구분)</label>
        <input id="cTags" placeholder="예: 헌터, A급, 빙결계열"></div>
      <div class="field"><label>자유 메모 (마크다운/HTML 가능)</label>
        <textarea id="cNote" rows="4"></textarea></div>

      <div class="flex" style="justify-content:space-between;">
        <button class="btn danger" id="cDelete" type="button">삭제</button>
        <div class="flex" style="gap:8px;">
          <button class="btn ghost" type="button" data-close>취소</button>
          <button class="btn" type="submit">저장</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script>
(function () {
  if (!mountApp('character')) return;
  const pid = getQuery('p');
  if (!SF.getProject(pid)) { location.href = 'dashboard.html'; return; }

  let editingId = null;

  function render() {
    const q = $('#search').value.trim().toLowerCase();
    const list = (SF.getProject(pid).characters || []).filter(c => {
      if (!q) return true;
      return [c.name, c.role, c.tagline, ...(c.tags || [])].join(' ').toLowerCase().includes(q);
    });
    const wrap = $('#charList');
    if (!list.length) {
      wrap.innerHTML = `<div class="empty" style="grid-column:1/-1">
        <div style="font-size:48px">👥</div>
        <h3>등장인물이 없어요</h3>
        <p><b>+ 새 인물</b> 로 첫 캐릭터를 추가하세요.</p></div>`;
      return;
    }
    wrap.innerHTML = list.map(c => `
      <div class="thumb-card" data-id="${c.id}">
        <div class="avatar" style="${c.avatar ? `background-image:url('${escapeAttr(c.avatar)}')` : ''}">
          ${c.avatar ? '' : '👤'}
        </div>
        <div class="info">
          <h4>${escapeHtml(c.name)}</h4>
          <div class="role">${escapeHtml(c.role || '')} ${c.age ? '· ' + escapeHtml(c.age) : ''}</div>
          ${c.tagline ? `<div class="muted" style="margin-top:4px">${escapeHtml(c.tagline)}</div>` : ''}
          <div class="tags">${(c.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        </div>
      </div>`).join('');
    $$('.thumb-card').forEach(el => el.addEventListener('click', () => openModal(el.dataset.id)));
  }
  $('#search').addEventListener('input', render);
  render();

  // ---------- Modal ----------
  const modal = $('#charModal');
  const closeM = () => modal.classList.remove('open');
  $$('[data-close]').forEach(b => b.addEventListener('click', closeM));
  modal.addEventListener('click', e => { if (e.target === modal) closeM(); });

  function setAvatar(url) {
    const p = $('#avatarPreview');
    p.style.backgroundImage = url ? `url('${url}')` : '';
    p.textContent = url ? '' : '👤';
  }

  function openModal(id) {
    editingId = id;
    const c = id ? SF.getProject(pid).characters.find(x => x.id === id) : {};
    $('#modalTitle').textContent = id ? '인물 편집 · ' + (c.name || '') : '새 인물';
    $('#cName').value = c.name || '';
    $('#cRole').value = c.role || '';
    $('#cAge').value  = c.age || '';
    $('#cGender').value = c.gender || '';
    $('#cJob').value = c.job || '';
    $('#cTagline').value = c.tagline || '';
    $('#cAppearance').value = c.appearance || '';
    $('#cPersonality').value = c.personality || '';
    $('#cAbility').value = c.ability || '';
    $('#cBackground').value = c.background || '';
    $('#cLike').value = c.like || '';
    $('#cDislike').value = c.dislike || '';
    $('#cTags').value = (c.tags || []).join(', ');
    $('#cNote').value = c.note || '';
    $('#cAvatar').value = c.avatar || '';
    $('#cAvatarFile').value = '';
    setAvatar(c.avatar);
    $('#cDelete').style.display = id ? '' : 'none';
    modal.classList.add('open');
    setTimeout(() => $('#cName').focus(), 30);
  }
  $('#newBtn').addEventListener('click', () => openModal(null));

  $('#cAvatar').addEventListener('input', e => setAvatar(e.target.value));
  $('#cAvatarFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('#cAvatar').value = r.result; setAvatar(r.result); };
    r.readAsDataURL(f);
  });

  $('#charForm').addEventListener('submit', e => {
    e.preventDefault();
    const data = {
      name: $('#cName').value.trim(),
      role: $('#cRole').value.trim(),
      age: $('#cAge').value.trim(),
      gender: $('#cGender').value.trim(),
      job: $('#cJob').value.trim(),
      tagline: $('#cTagline').value.trim(),
      appearance: $('#cAppearance').value,
      personality: $('#cPersonality').value,
      ability: $('#cAbility').value,
      background: $('#cBackground').value,
      like: $('#cLike').value.trim(),
      dislike: $('#cDislike').value.trim(),
      tags: $('#cTags').value.split(',').map(s => s.trim()).filter(Boolean),
      note: $('#cNote').value,
      avatar: $('#cAvatar').value.trim()
    };
    if (!data.name) { toast('이름은 필수입니다.', 'error'); return; }
    if (editingId) SF.updateCharacter(pid, editingId, data);
    else SF.addCharacter(pid, data);
    closeM(); render();
    toast('저장되었습니다.', 'success');
  });

  $('#cDelete').addEventListener('click', () => {
    if (!editingId) return;
    if (!confirm('이 인물을 삭제할까요?')) return;
    SF.deleteCharacter(pid, editingId);
    closeM(); render();
  });
})();
</script>
</body>
</html>
