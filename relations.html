<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관계 그래프 · StoryForge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Dodum&family=Gaegu&family=Nanum+Pen+Script&family=Nanum+Myeongjo&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <h1>💞 인물 관계 그래프</h1>
  <div class="actions">
    <button class="btn ghost" id="autoArrange" type="button">⟳ 자동 배치</button>
    <button class="btn" id="addRel" type="button">+ 관계 추가</button>
  </div>
</div>

<p class="muted">등장인물 페이지에서 만든 인물들 사이의 관계(연인·라이벌·동료·멘토 등)를 자유롭게 연결하세요. 노드를 드래그해 위치를 옮길 수 있어요.</p>

<div class="tree-canvas" id="canvas">
  <svg class="tree-svg" id="svg"></svg>
</div>

<!-- 관계 모달 -->
<div class="modal-bg" id="relModal" role="dialog" aria-modal="true">
  <div class="modal">
    <header><h3 id="rmTitle">관계 추가</h3><button class="close" data-close type="button">×</button></header>
    <form id="relForm">
      <div class="row">
        <div class="field"><label>인물 A</label><select id="rFrom"></select></div>
        <div class="field"><label>인물 B</label><select id="rTo"></select></div>
      </div>
      <div class="row">
        <div class="field"><label>관계 라벨</label>
          <input id="rLabel" placeholder="예: 연인 / 라이벌 / 멘토 / 형제"></div>
        <div class="field"><label>선 색상</label><input id="rColor" type="color" value="#7c5cff"></div>
      </div>
      <div class="flex" style="justify-content:space-between">
        <button class="btn danger" id="rDelete" type="button" style="display:none">삭제</button>
        <div class="flex" style="gap:8px;">
          <button class="btn ghost" type="button" data-close>취소</button>
          <button class="btn" type="submit">저장</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/sidebar.js"></script>
<script>
(function () {
  if (!mountApp('relations')) return;
  const pid = getQuery('p');
  const proj = SF.getProject(pid);
  if (!proj) { location.href = 'dashboard.html'; return; }

  const canvas = $('#canvas');
  const svg = $('#svg');

  // Layout positions stored in proj.relPositions: { [charId]: {x,y} }
  proj.relPositions = proj.relPositions || {};
  proj.relations = proj.relations || [];

  function save(extra) {
    SF.updateProject(pid, { relations: proj.relations, relPositions: proj.relPositions, ...(extra || {}) });
  }

  function autoArrange() {
    const chars = proj.characters || [];
    const n = chars.length;
    if (!n) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const cx = w / 2, cy = h / 2;
    const r = Math.min(w, h) / 2 - 80;
    chars.forEach((c, i) => {
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      proj.relPositions[c.id] = { x: cx + r * Math.cos(a) - 60, y: cy + r * Math.sin(a) - 18 };
    });
    save();
    render();
  }

  let editingRelId = null;

  function fillSelects() {
    const chars = proj.characters || [];
    const opts = chars.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    $('#rFrom').innerHTML = opts;
    $('#rTo').innerHTML = opts;
  }

  function render() {
    $$('.node', canvas).forEach(n => n.remove());
    const chars = proj.characters || [];
    if (!chars.length) {
      // Show empty
      svg.innerHTML = '';
      const e = document.createElement('div');
      e.className = 'node';
      e.style.left = '20px'; e.style.top = '20px';
      e.style.position = 'static';
      e.innerHTML = '먼저 [등장인물]에서 인물을 추가하세요.';
      canvas.appendChild(e);
      return;
    }

    // Make sure every char has a position
    chars.forEach((c, i) => {
      if (!proj.relPositions[c.id]) {
        proj.relPositions[c.id] = { x: 40 + (i % 6) * 160, y: 40 + Math.floor(i / 6) * 100 };
      }
    });

    chars.forEach(c => {
      const pos = proj.relPositions[c.id];
      const el = document.createElement('div');
      el.className = 'node';
      el.style.left = pos.x + 'px';
      el.style.top  = pos.y + 'px';
      el.dataset.id = c.id;
      el.innerHTML = `<div>${escapeHtml(c.name)}</div>${c.role ? `<small>${escapeHtml(c.role)}</small>` : ''}`;
      canvas.appendChild(el);
      makeDraggable(el, pos);
    });

    drawEdges();
  }

  function drawEdges() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w); svg.setAttribute('height', h);
    const ns = 'http://www.w3.org/2000/svg';
    let html = '';
    proj.relations.forEach(r => {
      const a = proj.relPositions[r.from], b = proj.relPositions[r.to];
      if (!a || !b) return;
      const ax = a.x + 60, ay = a.y + 18;
      const bx = b.x + 60, by = b.y + 18;
      const color = r.color || '#7c5cff';
      html += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${color}" stroke-width="2" opacity=".75" data-rid="${r.id}" style="cursor:pointer; pointer-events:stroke;"/>`;
      if (r.label) {
        html += `<text x="${(ax+bx)/2}" y="${(ay+by)/2 - 4}" fill="${color}" font-size="12" text-anchor="middle" data-rid="${r.id}" style="cursor:pointer; pointer-events:auto;">${escapeHtml(r.label)}</text>`;
      }
    });
    svg.innerHTML = html;
    svg.style.pointerEvents = 'auto';
    $$('[data-rid]', svg).forEach(el => el.addEventListener('click', () => openRelModal(el.dataset.rid)));
  }

  function makeDraggable(el, pos) {
    let sx, sy, ox, oy;
    el.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      sx = e.clientX; sy = e.clientY; ox = pos.x; oy = pos.y;
      el.classList.add('dragging');
      const move = ev => {
        pos.x = Math.max(0, Math.min(canvas.clientWidth - 130, ox + (ev.clientX - sx)));
        pos.y = Math.max(0, Math.min(canvas.clientHeight - 50, oy + (ev.clientY - sy)));
        el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px';
        drawEdges();
      };
      const up = () => {
        el.classList.remove('dragging');
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        save();
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  }

  // Modal
  const modal = $('#relModal');
  const closeM = () => modal.classList.remove('open');
  $$('[data-close]').forEach(b => b.addEventListener('click', closeM));
  modal.addEventListener('click', e => { if (e.target === modal) closeM(); });

  function openRelModal(id) {
    fillSelects();
    editingRelId = id;
    const r = id ? proj.relations.find(x => x.id === id) : {};
    $('#rmTitle').textContent = id ? '관계 편집' : '관계 추가';
    $('#rFrom').value = r.from || (proj.characters[0] && proj.characters[0].id) || '';
    $('#rTo').value   = r.to   || (proj.characters[1] && proj.characters[1].id) || (proj.characters[0] && proj.characters[0].id) || '';
    $('#rLabel').value = r.label || '';
    $('#rColor').value = r.color || '#7c5cff';
    $('#rDelete').style.display = id ? '' : 'none';
    modal.classList.add('open');
  }

  $('#addRel').addEventListener('click', () => {
    if (!(proj.characters || []).length) { toast('먼저 인물을 만들어 주세요.', 'warn'); return; }
    openRelModal(null);
  });

  $('#relForm').addEventListener('submit', e => {
    e.preventDefault();
    const data = {
      from: $('#rFrom').value,
      to: $('#rTo').value,
      label: $('#rLabel').value.trim(),
      color: $('#rColor').value
    };
    if (!data.from || !data.to) return;
    if (data.from === data.to) { toast('서로 다른 인물을 선택하세요.', 'error'); return; }
    if (editingRelId) {
      const i = proj.relations.findIndex(r => r.id === editingRelId);
      proj.relations[i] = { ...proj.relations[i], ...data };
    } else {
      proj.relations.push({ id: SF._uid('r_'), ...data });
    }
    save(); closeM(); render();
  });

  $('#rDelete').addEventListener('click', () => {
    if (!editingRelId) return;
    if (!confirm('이 관계를 삭제할까요?')) return;
    proj.relations = proj.relations.filter(r => r.id !== editingRelId);
    save(); closeM(); render();
  });

  $('#autoArrange').addEventListener('click', autoArrange);

  window.addEventListener('resize', drawEdges);
  render();
})();
</script>
</body>
</html>
